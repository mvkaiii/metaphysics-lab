name: v1.6 Post-release Docs Check

on:
  push:
    branches: [docs/v1.6.0-post-release-normalization]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Run post-release docs contract
        run: python -m unittest tests.test_v16_post_release_docs -v
      - name: Run affected documentation contracts
        run: |
          python -m unittest tests.test_ai_distribution_docs -v
          python -m unittest tests.test_v15_terminology_contract -v
      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile and diff checks
        run: |
          python -m compileall -q engine tools tests
          git diff --check HEAD^ HEAD
