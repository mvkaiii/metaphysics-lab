name: Temporary v1.3.0 Release Sync

on:
  push:
    branches:
      - feature/portable-offline-natal-pipeline

permissions:
  contents: write

jobs:
  sync-release:
    if: contains(github.event.head_commit.message, '[release-sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm main SHA
        run: |
          test "$(git rev-parse HEAD)" = "e43d1106fcd4132ab57456ec7d080ca00a3cbc4f"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify deterministic distribution
        run: |
          python tools/build_ai_distribution.py --check

      - name: Full repository regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall engine tests tools

      - name: Verify clean tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Sync v1.3.0 release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3.0 \
            dist/ai/metaphysics_lab.py \
            dist/ai/metaphysics_core.md \
            dist/ai/project_instructions.md \
            --clobber
          gh release edit v1.3.0 --notes-file docs/發布說明-v1.3.0.md
          gh release view v1.3.0 --json tagName,name,isDraft,isPrerelease,assets
