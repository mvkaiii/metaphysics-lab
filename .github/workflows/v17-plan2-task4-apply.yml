name: v1.7 Plan 2 Task 4 Apply

on:
  push:
    branches:
      - feature/v1.7-case-doctor-reconciliation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.7-case-doctor-reconciliation
      - name: Export planner from case_doctor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/distribution/case_doctor.py')
          text = path.read_text(encoding='utf-8')
          line = 'from .case_reconciliation import plan_case_reconciliation'
          if line not in text:
              path.write_text(text.rstrip() + '\n\n' + line + '\n', encoding='utf-8')
          PY
      - name: Commit edit when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/case_doctor.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: export Case reconciliation planner"
          git push origin HEAD:feature/v1.7-case-doctor-reconciliation
