name: Phase 2A Task 1 GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Task 1 model tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_models -v 2>&1 | tee task1-models.txt
      - name: Run syntax gate
        shell: bash
        run: |
          python -m py_compile engine/ziwei/errors.py engine/ziwei/models.py
          echo TASK1_SYNTAX_PASS | tee task1-syntax.txt
      - name: Run existing regressions
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_engine_module_layout tests.test_ziwei_capabilities -v 2>&1 | tee task1-regression.txt
      - name: Upload GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task1-green-evidence
          path: |
            task1-models.txt
            task1-syntax.txt
            task1-regression.txt
