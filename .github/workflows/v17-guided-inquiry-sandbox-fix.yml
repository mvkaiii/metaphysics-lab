name: v1.7 Guided Inquiry Sandbox Fix

on:
  push:
    branches:
      - release/v1.7.0-integration
    paths:
      - .github/workflows/v17-guided-inquiry-sandbox-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.7.0-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply minimal presentation-contract fix
        shell: python
        run: |
          from pathlib import Path

          prompt_path = Path('core/核心提示詞.md')
          workflow_path = Path('core/AI工作流程.md')

          prompt = prompt_path.read_text(encoding='utf-8')
          workflow = workflow_path.read_text(encoding='utf-8')

          old_opening = '''回答任何命理、本命、流年、決策或合盤問題前，**必須完整讀取並遵循 `metaphysics_core.md`**。它是完整作業規範；本 Project Instructions 只負責啟動、路由與不可弱化的底線。若 `metaphysics_core.md` 不存在、無法讀取或內容不完整，明確告知並停止需要其規範的高精度分析，不得假裝已讀，也不得依記憶補造規則。'''
          new_opening = '''回答命理、本命、流年、決策或合盤前，**必須完整讀取並遵循 `metaphysics_core.md`**；它是完整作業規範。若缺失、不可讀或不完整，明確告知並停止需要其規範的高精度分析，不得假裝已讀或依記憶補造。'''
          assert prompt.count(old_opening) == 1
          prompt = prompt.replace(old_opening, new_opening, 1)

          old_status = '''**內部校準狀態碼不得直接當成使用者結論。** 對外固定翻譯：`uncalibrated` →「尚未完成歷史事件校準」；`basic` →「已完成初步校準」；`calibrated` →「已完成較完整校準」；`scorable` →「可正式評估」；`unscorable` →「目前資料不足以正式評估」。`runtime validator`、schema、migration、JSON 欄位名等屬內部工程資訊；**除非使用者明確要求技術檢查**，正常回答不主動提。**不影響資料使用的純內部欄位名稱差異，正常回答省略**；若差異會影響結果，只說實際影響與需要採取的動作。應說「**目前已完成初步校準**」，不要說「basic 狀態成立」或主動解釋 validator/schema。'''
          new_status = '''**內部校準狀態碼不得直接當成使用者結論。** 固定翻譯：`uncalibrated` →「尚未完成歷史事件校準」；`basic` →「已完成初步校準」；`calibrated` →「已完成較完整校準」；`scorable` →「可正式評估」；`unscorable` →「目前資料不足以正式評估」。`runtime validator`、schema、migration 是內部資訊；**除非使用者明確要求技術檢查**，正常不提。**不影響資料使用的純內部欄位名稱差異，正常回答省略**；有影響只說影響與動作。應說「**目前已完成初步校準**」。'''
          assert prompt.count(old_status) == 1
          prompt = prompt.replace(old_status, new_status, 1)

          prompt_anchor = 'Guided Inquiry 應主動顯示，預設 3 個；不得在盲判前用驗證事件產生建議；使用者可以直接自由輸入、不必選建議。'
          prompt_rules = prompt_anchor + '\n入口模式整個回覆只能有一組可直接接著問的方向；使用者可選方向總數不得超過 4 個，不得先列更多路徑再收斂成 3 個入口。\n若 suggest_inquiries 回傳 4 個合法 suggestions，使用者輸出必須完整呈現 4 個，不得合併、省略或自行收斂成 3 個。'
          assert prompt.count(prompt_anchor) == 1
          prompt = prompt.replace(prompt_anchor, prompt_rules, 1)

          workflow_anchor = '- **第一次 assistant 回覆**：若使用者尚未提出 substantive 問題，主動顯示 3～4 個可直接接著問的方向，預設 3 個；若已有 substantive 問題先回答，再依回答結果決定是否附上後續建議。'
          workflow_rules = workflow_anchor + '\n- 入口模式整個回覆只能有一組可直接接著問的方向；使用者可選方向總數不得超過 4 個，不得先列更多路徑再收斂成 3 個入口。\n- 若 suggest_inquiries 回傳 4 個合法 suggestions，使用者輸出必須完整呈現 4 個，不得合併、省略或自行收斂成 3 個。'
          assert workflow.count(workflow_anchor) == 1
          workflow = workflow.replace(workflow_anchor, workflow_rules, 1)

          assert len(prompt) <= 8000, len(prompt)
          prompt_path.write_text(prompt, encoding='utf-8')
          workflow_path.write_text(workflow, encoding='utf-8')
          print('project instructions chars:', len(prompt))

      - name: Rebuild AI distribution
        run: python tools/build_ai_distribution.py

      - name: Run sandbox follow-up regressions
        run: python -m unittest -v tests.test_v17_sandbox_followup_regressions

      - name: Run Guided Inquiry AI contract
        run: python -m unittest -v tests.test_v17_guided_inquiry_ai_contract

      - name: Run Project UX contract
        run: python -m unittest -v tests.test_project_ux_contract

      - name: Verify deterministic AI distribution
        run: python tools/build_ai_distribution.py --check

      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/AI工作流程.md core/核心提示詞.md dist/ai/metaphysics_core.md dist/ai/project_instructions.txt
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix: enforce guided inquiry presentation bounds'
          git push origin HEAD:release/v1.7.0-integration
