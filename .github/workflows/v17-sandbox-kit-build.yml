name: v1.7 Sandbox Kit Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 4fdc08f9523aec22752367c6811fbfb6ecb02fc7
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build exact deterministic user package and sandbox kit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v17-kit"
          python tools/build_release_package.py --verify --output "$RUNNER_TEMP/v17-kit/Metaphysics-Lab-v1.7.0-User-Package.zip"
          cp docs/release/v1.7.0-isolated-sandbox-script.md "$RUNNER_TEMP/v17-kit/v1.7.0-isolated-sandbox-script.md"
          cp docs/release/v1.7.0-isolated-sandbox-base.json "$RUNNER_TEMP/v17-kit/v1.7.0-isolated-sandbox-base.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          root = Path('/home/runner/work/_temp/v17-kit')
          candidate = '4fdc08f9523aec22752367c6811fbfb6ecb02fc7'
          expected_package = '0d9accd9d0b8643302b921b4a3b11977363d9445e3ba6b7e05ebdf20578e15fc'

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          package = root / 'Metaphysics-Lab-v1.7.0-User-Package.zip'
          if sha(package) != expected_package:
              raise SystemExit('user package SHA mismatch: ' + sha(package))

          script = root / 'v1.7.0-isolated-sandbox-script.md'
          base = root / 'v1.7.0-isolated-sandbox-base.json'
          readme = root / 'README-START-HERE.md'
          readme.write_text(
              '# Metaphysics Lab v1.7.0 Isolated Sandbox Kit v3\n\n'
              f'Tested release candidate: `{candidate}`\n\n'
              '這個 kit 只用於 v1.7.0 最終 isolated sandbox qualification。請建立一個全新的 ChatGPT Project，不要沿用之前的 sandbox Project 或對話。\n\n'
              '1. 解壓 `Metaphysics-Lab-v1.7.0-User-Package.zip`。\n'
              '2. 將 `metaphysics_lab.py`、`metaphysics_core.md` 上傳到新 Project 的 Sources。\n'
              '3. 將 `project_instructions.txt` 的完整內容貼到 Project Instructions；不要把它當第四個 Source。\n'
              '4. 將 `v1.7.0-isolated-sandbox-base.json` 上傳到同一個 Project 的 Sources。\n'
              '5. 執行前記下介面上「實際顯示」的 model UI label，大小寫與文字必須逐字保存，不要自行正規化。\n'
              '6. 嚴格依 `v1.7.0-isolated-sandbox-script.md` 的 conversation grouping、setup message 與 prompt 執行 S01-S12。\n'
              '7. 不重試、不補答、不改寫失敗回覆；所有 setup prompt、scenario prompt 與 assistant response 都逐字保存。\n\n'
              'Release gate 只有在 S01-S12 與全部 critical rubrics 都 PASS，且 evidence validator 回傳 `release_allowed: true` 時才可關閉。\n',
              encoding='utf-8',
          )

          checks = {
              'Metaphysics-Lab-v1.7.0-User-Package.zip': sha(package),
              'v1.7.0-isolated-sandbox-base.json': sha(base),
              'v1.7.0-isolated-sandbox-script.md': sha(script),
              'README-START-HERE.md': sha(readme),
          }
          checks_path = root / 'CHECKSUMS.txt'
          checks_path.write_text(''.join(f'{digest}  {name}\n' for name, digest in checks.items()), encoding='utf-8')

          members = [
              'README-START-HERE.md',
              'CHECKSUMS.txt',
              'Metaphysics-Lab-v1.7.0-User-Package.zip',
              'v1.7.0-isolated-sandbox-base.json',
              'v1.7.0-isolated-sandbox-script.md',
          ]
          out = Path('/home/runner/work/_temp/Metaphysics-Lab-v1.7.0-Isolated-Sandbox-Kit-v3.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in members:
                  data = (root / name).read_bytes()
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = (0o100644 << 16)
                  z.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print('candidate', candidate)
          print('user_package_sha256', sha(package))
          print('script_sha256', sha(script))
          print('base_fixture_sha256', sha(base))
          print('kit_sha256', sha(out))
          print('kit_members', members)
          PY

      - name: Upload kit
        uses: actions/upload-artifact@v4
        with:
          name: Metaphysics-Lab-v1.7.0-Isolated-Sandbox-Kit-v3
          path: ${{ runner.temp }}/Metaphysics-Lab-v1.7.0-Isolated-Sandbox-Kit-v3.zip
          if-no-files-found: error
          compression-level: 0
