name: v1.7 Investigate Phase2 Artifact Bundles

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-artifact-investigate-phase2.yml

permissions:
  actions: read
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect phase2c0 source bundle artifacts and their runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(9472509976 9471797723 9471740460 9471857418 9471759305 9472311556 9471483673)
          for id in "${ids[@]}"; do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            run_id="$(jq -r '.workflow_run.id' <<<"$artifact")"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -n \
              --argjson artifact "$artifact" \
              --argjson run "$run" \
              '{artifact:{id:$artifact.id,name:$artifact.name,size_in_bytes:$artifact.size_in_bytes,expired:$artifact.expired,created_at:$artifact.created_at,head_sha:$artifact.workflow_run.head_sha,run_id:$artifact.workflow_run.id},run:{id:$run.id,name:$run.name,path:$run.path,event:$run.event,status:$run.status,conclusion:$run.conclusion,head_branch:$run.head_branch,head_sha:$run.head_sha,display_title:$run.display_title,created_at:$run.created_at}}'
          done
