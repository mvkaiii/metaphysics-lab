name: v1.7 Plan 1 Focused

on:
  push:
    branches:
      - feature/v1.7-capability-manifest-v1

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Plan 1 focused tests
        run: |
          python -m unittest \
            tests.test_v17_capability_manifest \
            tests.test_distribution_runtime_info -v
      - name: Compile touched runtime
        run: |
          python -m py_compile \
            engine/distribution/manifest.py \
            engine/distribution/runtime.py \
            engine/ziwei/capabilities.py
