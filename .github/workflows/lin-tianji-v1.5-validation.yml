name: 林氏天機 v1.5 Validation

on:
  push:
    branches:
      - feature/progressive-case-historical-calibration
      - fix/postmerge-audit-161-165
      - 'feature/lin-tianji-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm validation SHA
        run: |
          echo "event=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"
          git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bazi flow-day/hour qualification evidence
        run: |
          python tools/build_bazi_flow_time_qualification.py --check

      - name: Ziwei flow-day/hour qualification evidence
        run: |
          python tools/build_ziwei_flow_time_qualification.py --check

      - name: Ziwei month-boundary qualification evidence
        run: |
          python tools/build_ziwei_month_boundary_qualification.py --check

      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Upload rebuilt distribution snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lin-tianji-v1.5-rebuilt-ai-distribution-${{ github.sha }}
          path: dist/ai/
          if-no-files-found: error

      - name: 林氏天機 v1.5 focused regression
        run: |
          python -m unittest \
            tests.test_bazi_structural_relations \
            tests.test_distribution_bazi_structural_interpretation \
            tests.test_distribution_ziwei_structural_interpretation \
            tests.test_distribution_structural_interpretation \
            tests.test_distribution_evidence_models \
            tests.test_distribution_evidence \
            tests.test_distribution_evidence_audit \
            tests.test_distribution_evidence_ranker \
            tests.test_distribution_evidence_runtime \
            tests.test_distribution_forecast \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_historical_integrity \
            tests.test_distribution_historical_support \
            tests.test_distribution_historical_personalization_policy \
            tests.test_distribution_historical_personalization \
            tests.test_distribution_historical_personalization_runtime \
            tests.test_distribution_historical_personalization_bundle \
            tests.test_distribution_interpretation_contract \
            tests.test_distribution_interpretation_contract_local_window_validation \
            tests.test_distribution_interpretation_contract_runtime \
            tests.test_distribution_interpretation_contract_bundle \
            tests.test_project_ux_contract \
            tests.test_ai_contract_docs \
            tests.test_distribution_case_pack \
            tests.test_distribution_blind_sources \
            tests.test_distribution_blind_source_bundle_parity \
            tests.test_distribution_prospective \
            tests.test_distribution_prospective_evaluation \
            tests.test_distribution_prospective_evaluation_comparison \
            tests.test_distribution_partial_case \
            tests.test_postmerge_audit_regressions \
            tests.test_second_round_adversarial_regressions \
            tests.test_third_round_adversarial_regressions \
            tests.test_third_round_bundle_parity \
            tests.test_fourth_round_nonfinite_case_records \
            tests.test_fifth_round_legacy_record_id_compat \
            tests.test_distribution_runtime_info -v

      - name: Run 林氏天機預測驗證
        run: python tools/run_lin_tianji_prediction_validation.py --json

      - name: Run v1.5 發行面驗證
        run: python tools/run_v15_release_surface_validation.py --json

      - name: Verify deterministic three-file user package
        run: python tools/build_release_package.py --verify --output "$RUNNER_TEMP/Metaphysics-Lab-v1.5.0-User-Package.zip"

      - name: Full repository regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall engine tests tools

      - name: Verify clean tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload generated distribution
        uses: actions/upload-artifact@v4
        with:
          name: lin-tianji-v1.5-ai-distribution-${{ github.sha }}
          path: dist/ai/
          if-no-files-found: error
