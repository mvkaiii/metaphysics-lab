name: Phase 2A Task 7 CLI RED

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run expected failing direct CLI regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_qualification_tools.ZiweiPublicQualificationTests.test_direct_cli_invocation_can_import_project_engine -v 2>&1 | tee task7-cli-red.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task7-cli-red-evidence
          path: task7-cli-red.txt
