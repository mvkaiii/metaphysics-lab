name: Phase 2A Task 3 GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run transformation and prior Phase 2A tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests.test_ziwei_transformations \
            tests.test_ziwei_basis \
            tests.test_ziwei_phase2a_models \
            -v 2>&1 | tee task3-green.txt
      - name: Verify exact 40 transformation entries
        shell: bash
        run: |
          python - <<'PY' | tee task3-marker.txt
          from engine.ziwei.transformations import get_transformation_set
          checked = sum(len(get_transformation_set(stem).transformations) for stem in "甲乙丙丁戊己庚辛壬癸")
          assert checked == 40, checked
          print("TRANSFORMATION_TABLE_PASS 40/40")
          PY
      - name: Upload GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task3-green-evidence
          path: |
            task3-green.txt
            task3-marker.txt
