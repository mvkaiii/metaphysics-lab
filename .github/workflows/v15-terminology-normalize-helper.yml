name: v1.5 Terminology Normalize Helper

on:
  push:
    branches:
      - feature/lin-tianji-v1.5-release-preparation

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Apply terminology normalization
        run: python tools/v15_terminology_normalize.py

      - name: Verify terminology contract
        run: python -m unittest tests.test_v15_terminology_contract -v

      - name: Verify renamed validation suites
        run: |
          python -m unittest \
            tests.test_lin_tianji_prediction_validation \
            tests.test_lin_tianji_prediction_validation_progressive \
            tests.test_v15_release_surface_validation \
            tests.test_v15_release_contract -v

      - name: Remove one-shot normalization helper
        run: |
          git rm .github/workflows/v15-terminology-normalize-helper.yml
          git rm tools/v15_terminology_normalize.py

      - name: Commit normalized release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: normalize 林氏天機 v1.5 terminology"
          git push origin HEAD:feature/lin-tianji-v1.5-release-preparation
