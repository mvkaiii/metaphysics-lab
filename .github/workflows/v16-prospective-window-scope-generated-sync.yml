name: v1.6 prospective window scope generated sync

on:
  push:
    branches:
      - research/v1.6-prospective-window-scope-v1

permissions:
  contents: write

jobs:
  sync-generated-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/v1.6-prospective-window-scope-v1
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild deterministic AI distribution
        run: python tools/build_ai_distribution.py

      - name: Fail closed unless only the expected generated artifact changed
        id: dirty
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess

          status = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          )
          lines = [line for line in status.splitlines() if line]
          print("generated_sync_status=", lines)
          allowed = [" M dist/ai/metaphysics_lab.py"]
          if not lines:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("changed=false\n")
          elif lines == allowed:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("changed=true\n")
          else:
              raise SystemExit("unexpected generated-sync dirty tree: " + " | ".join(lines))
          PY

      - name: Commit deterministic generated artifact
        if: steps.dirty.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/ai/metaphysics_lab.py
          git diff --cached --exit-code --quiet && exit 0
          git commit -m 'chore(research): sync generated AI distribution'
          git push origin HEAD:research/v1.6-prospective-window-scope-v1
