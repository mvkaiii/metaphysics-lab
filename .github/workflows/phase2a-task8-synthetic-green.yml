name: Phase 2A Task 8 Synthetic GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all qualification tooling tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_qualification_tools -v 2>&1 | tee task8-synthetic.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task8-synthetic-green-evidence
          path: task8-synthetic.txt
