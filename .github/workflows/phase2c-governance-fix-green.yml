name: Phase 2C Governance Fix GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-flowing-stars-v1

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Re-run exact failed governance contracts
        run: |
          python -m unittest \
            tests.test_ziwei_phase2c_rule_source \
            tests.test_natal_qualification_summary -v
          echo PHASE2C_GOVERNANCE_TARGETED_PASS
      - name: Re-run Phase 2C focused suite
        run: |
          python -m unittest \
            tests.test_ziwei_phase2c_rule_source \
            tests.test_calendar_sexagenary_phase2c \
            tests.test_ziwei_flowing_star_models \
            tests.test_ziwei_flowing_star_sources \
            tests.test_ziwei_flowing_stars \
            tests.test_ziwei_flowing_star_view \
            tests.test_ziwei_phase2c_capabilities \
            tests.test_ziwei_phase2c_qualification \
            tests.test_ziwei_phase2c_docs \
            tests.test_ziwei_phase2c_acceptance -v
          echo PHASE2C_GOVERNANCE_FOCUSED_PASS
      - name: Full repository regression
        run: |
          python -m unittest discover -s tests -p 'test*.py'
          echo PHASE2C_GOVERNANCE_FULL_REPO_PASS
