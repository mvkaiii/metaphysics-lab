name: Phase 2A Task 8 private source snapshot

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source head
        run: git rev-parse HEAD > source-head.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task8-private-source
          path: |
            source-head.txt
            engine/
            tools/
            tests/
            requirements.txt
