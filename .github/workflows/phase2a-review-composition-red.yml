name: Phase 2A composition review RED

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run composition coherence RED tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_composition -v 2>&1 | tee composition-red.txt
      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-review-composition-red-evidence
          path: composition-red.txt
