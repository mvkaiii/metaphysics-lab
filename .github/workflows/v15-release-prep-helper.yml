name: v1.5 Release Prep Helper

on:
  push:
    branches:
      - feature/lin-tianji-v1.5-release-preparation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Apply v1.5 release-prep source patch
        run: python tools/v15_release_prep_helper.py

      - name: Rebuild distribution
        run: python tools/build_ai_distribution.py

      - name: Verify release package contract
        run: python tools/build_release_package.py --verify

      - name: Remove one-shot helper files
        run: |
          git rm .github/workflows/v15-release-prep-helper.yml
          git rm tools/v15_release_prep_helper.py

      - name: Commit deterministic release-prep changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: prepare 林氏天機 v1.5 release candidate"
          git push origin HEAD:feature/lin-tianji-v1.5-release-preparation
