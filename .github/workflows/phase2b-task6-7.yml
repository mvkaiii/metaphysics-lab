name: Phase 2B Tasks 6 and 7

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: write

jobs:
  task67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ziwei-fine-cycle-stem-resolver-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Write RED integration/composition tests
        run: |
          cat > tests/test_ziwei_fine_cycle_integration.py <<'PY'
          import unittest
          from dataclasses import replace
          from unittest.mock import patch

          from engine.ziwei.basis import build_star_location_index
          from engine.ziwei.errors import ZiweiFineCycleError, ZiweiPhase2AError
          from engine.ziwei.fine_cycle import build_fine_cycle_layer
          from engine.ziwei.fine_cycle_stems import (
              resolve_day_stem,
              resolve_hour_stem,
              resolve_month_stem,
          )
          from engine.ziwei.models import ChartIdentity
          from engine.ziwei.transformations import get_transformation_set as real_get_transformation_set
          from tests.ziwei_phase2b_fixtures import (
              CHART,
              PROVENANCE,
              SYNTHETIC_STAR_RECORDS,
              calendar_context,
          )


          def _stars(chart=CHART):
              return build_star_location_index(SYNTHETIC_STAR_RECORDS, chart, PROVENANCE)


          class FineCycleTransformationIntegrationTests(unittest.TestCase):
              def test_each_fine_scope_builds_exactly_four_transformations_and_edges(self):
                  for resolution in (
                      resolve_month_stem(calendar_context(lunar_year=2023, lunar_month=6, lunar_day=13)),
                      resolve_day_stem(calendar_context()),
                      resolve_hour_stem(calendar_context()),
                  ):
                      layer = build_fine_cycle_layer(resolution, CHART, _stars())
                      self.assertEqual(layer.identity.scope, resolution.scope)
                      self.assertEqual(layer.identity.reference, resolution.reference)
                      self.assertEqual(layer.heavenly_stem, resolution.heavenly_stem)
                      self.assertEqual(layer.earthly_branch, resolution.earthly_branch)
                      self.assertEqual(len(layer.transformations.transformations), 4)
                      self.assertEqual(len(layer.flying_edges), 4)

              def test_chart_mismatch_uses_existing_phase2a_contract(self):
                  other = ChartIdentity("other", "natal", "synthetic-v1")
                  with self.assertRaises(ZiweiPhase2AError) as cm:
                      build_fine_cycle_layer(resolve_day_stem(calendar_context()), CHART, _stars(other))
                  self.assertEqual(cm.exception.code, "chart_basis_mismatch")

              def test_non_fine_scope_is_rejected_before_downstream_calls(self):
                  resolution = replace(resolve_day_stem(calendar_context()), scope="weekly")
                  with self.assertRaises(ZiweiFineCycleError) as cm:
                      build_fine_cycle_layer(resolution, CHART, _stars())
                  self.assertEqual(cm.exception.code, "invalid_fine_cycle_scope")

              def test_reference_scope_mismatch_is_rejected(self):
                  resolution = replace(
                      resolve_day_stem(calendar_context()),
                      reference="lunar:2023-06",
                  )
                  with self.assertRaises(ZiweiFineCycleError) as cm:
                      build_fine_cycle_layer(resolution, CHART, _stars())
                  self.assertEqual(cm.exception.code, "fine_cycle_reference_conflict")

              def test_hour_branch_and_reference_must_match_resolution(self):
                  resolution = replace(
                      resolve_hour_stem(calendar_context()),
                      hour_branch="子",
                  )
                  with self.assertRaises(ZiweiFineCycleError) as cm:
                      build_fine_cycle_layer(resolution, CHART, _stars())
                  self.assertEqual(cm.exception.code, "fine_cycle_reference_conflict")

              def test_downstream_transformation_stem_mismatch_is_rejected(self):
                  resolution = resolve_month_stem(calendar_context(lunar_year=2023, lunar_month=6, lunar_day=13))
                  wrong = real_get_transformation_set("丁")
                  with patch("engine.ziwei.fine_cycle.get_transformation_set", return_value=wrong):
                      with self.assertRaises(ZiweiFineCycleError) as cm:
                          build_fine_cycle_layer(resolution, CHART, _stars())
                  self.assertEqual(cm.exception.code, "fine_cycle_stem_mismatch")

              def test_unknown_fine_cycle_profile_is_rejected(self):
                  resolution = replace(resolve_day_stem(calendar_context()), profile_id="unknown")
                  with self.assertRaises(ZiweiFineCycleError) as cm:
                      build_fine_cycle_layer(resolution, CHART, _stars())
                  self.assertEqual(cm.exception.code, "invalid_fine_cycle_profile")


          if __name__ == "__main__":
              unittest.main()
          PY
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_ziwei_composition.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_fine_cycle_scope_is_rejected(self):\n        natal = _base_natal()\n        source, trans, edges, identity = _components("monthly", "2026-L07", "丙", natal)\n        with self.assertRaises(ZiweiPhase2AError) as cm:\n            build_cycle_layer(identity, source, trans, edges, PROVENANCE)\n        self.assertEqual(cm.exception.code, "unsupported_scope")\n\n'''
          new = '''    def test_fine_cycle_scopes_are_supported(self):\n        natal = _base_natal()\n        for scope, reference in (\n            ("monthly", "lunar:2026-07"),\n            ("daily", "ziwei-day:2026-08-21@late_zi_forward-v1"),\n            ("hourly", "ziwei-hour:2026-08-21:申@late_zi_forward-v1"),\n        ):\n            source, trans, edges, identity = _components(scope, reference, "丙", natal)\n            layer = build_cycle_layer(identity, source, trans, edges, PROVENANCE)\n            self.assertEqual(layer.identity.scope, scope)\n\n    def test_arbitrary_scope_still_fails_closed(self):\n        natal = _base_natal()\n        source, trans, edges, identity = _components("weekly", "2026-W34", "丙", natal)\n        with self.assertRaises(ZiweiPhase2AError) as cm:\n            build_cycle_layer(identity, source, trans, edges, PROVENANCE)\n        self.assertEqual(cm.exception.code, "unsupported_scope")\n\n'''
          if old not in text:
              raise SystemExit('old fine-scope test block not found')
          text = text.replace(old, new)
          old2 = '''    def test_fine_cycle_availability_remains_unavailable(self):\n        stack = build_layer_stack(CHART, _base_natal())\n        self.assertEqual(stack.availability["monthly_transformations"].status, "unavailable")\n        self.assertEqual(stack.availability["monthly_transformations"].reason, "fine_cycle_stem_resolver_not_enabled")\n        self.assertEqual(stack.availability["daily_transformations"].status, "unavailable")\n        self.assertEqual(stack.availability["hourly_transformations"].status, "unavailable")\n'''
          new2 = '''    def test_fine_cycle_availability_requires_matching_resolution(self):\n        stack = build_layer_stack(CHART, _base_natal())\n        for key in ("monthly_transformations", "daily_transformations", "hourly_transformations"):\n            self.assertEqual(stack.availability[key].status, "conditional")\n            self.assertEqual(stack.availability[key].reason, "matching_resolved_stem_required")\n\n    def test_fine_cycle_duplicate_identity_and_conflict_semantics(self):\n        natal = _base_natal()\n        source_a, trans_a, edges_a, identity = _components(\n            "monthly", "lunar:2026-07", "丙", natal\n        )\n        layer_a = build_cycle_layer(identity, source_a, trans_a, edges_a, PROVENANCE)\n        with self.assertRaises(ZiweiPhase2AError) as cm_dup:\n            build_layer_stack(CHART, natal, (layer_a, layer_a))\n        self.assertEqual(cm_dup.exception.code, "duplicate_layer_identity")\n        source_b, trans_b, edges_b, unused = _components(\n            "monthly", "lunar:2026-07", "丁", natal\n        )\n        layer_b = build_cycle_layer(identity, source_b, trans_b, edges_b, PROVENANCE)\n        with self.assertRaises(ZiweiPhase2AError) as cm_conflict:\n            build_layer_stack(CHART, natal, (layer_a, layer_b))\n        self.assertEqual(cm_conflict.exception.code, "layer_conflict")\n\n    def test_yearly_monthly_daily_hourly_coexist_without_overwrite(self):\n        natal = _base_natal()\n        specs = (\n            ("yearly", "2026", "丁"),\n            ("monthly", "lunar:2026-07", "丙"),\n            ("daily", "ziwei-day:2026-08-21@late_zi_forward-v1", "乙"),\n            ("hourly", "ziwei-hour:2026-08-21:申@late_zi_forward-v1", "甲"),\n        )\n        layers = []\n        for scope, reference, stem in specs:\n            source, trans, edges, identity = _components(scope, reference, stem, natal)\n            layers.append(build_cycle_layer(identity, source, trans, edges, PROVENANCE))\n        stack = build_layer_stack(CHART, natal, tuple(layers))\n        self.assertEqual(tuple(layer.identity.scope for layer in stack.cycles),\n                         ("yearly", "monthly", "daily", "hourly"))\n'''
          if old2 not in text:
              raise SystemExit('old availability block not found')
          text = text.replace(old2, new2)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify initial RED
        run: |
          set +e
          python -m unittest tests.test_ziwei_fine_cycle_integration tests.test_ziwei_composition -v > task67-red.txt 2>&1
          rc=$?
          cat task67-red.txt
          if [ "$rc" -eq 0 ]; then
            echo "Tasks 6/7 unexpectedly GREEN before implementation"
            exit 1
          fi
          grep -q "No module named 'engine.ziwei.fine_cycle'" task67-red.txt
          echo TASK67_INITIAL_RED
      - name: Implement thin fine-cycle orchestration
        run: |
          cat > engine/ziwei/fine_cycle.py <<'PY'
          from __future__ import annotations

          from .composition import build_cycle_layer
          from .errors import ZiweiFineCycleError, ZiweiPhase2AError
          from .fine_cycle_stems import (
              DAY_BOUNDARY_PROFILE,
              FINE_CYCLE_PROFILE_ID,
              FINE_CYCLE_RULE_VERSION,
          )
          from .flying import fly_transformations
          from .models import CycleStemSource, LayerIdentity
          from .transformation_profiles import PROFILE_ID
          from .transformations import get_transformation_set

          FINE_SCOPES = {"monthly", "daily", "hourly"}


          def _validate_resolution(resolution):
              if resolution.scope not in FINE_SCOPES:
                  raise ZiweiFineCycleError(
                      "invalid_fine_cycle_scope",
                      "unsupported fine-cycle scope",
                      {"scope": resolution.scope},
                  )
              if (
                  resolution.profile_id != FINE_CYCLE_PROFILE_ID
                  or resolution.rule_version != FINE_CYCLE_RULE_VERSION
              ):
                  raise ZiweiFineCycleError(
                      "invalid_fine_cycle_profile",
                      "resolution does not use the supported fine-cycle profile",
                      {
                          "profile_id": resolution.profile_id,
                          "rule_version": resolution.rule_version,
                      },
                  )
              boundary_suffix = "@" + DAY_BOUNDARY_PROFILE
              if resolution.scope == "monthly":
                  valid_reference = resolution.reference.startswith("lunar:")
                  if resolution.hour_branch is not None:
                      valid_reference = False
              elif resolution.scope == "daily":
                  valid_reference = (
                      resolution.reference.startswith("ziwei-day:")
                      and resolution.reference.endswith(boundary_suffix)
                      and resolution.hour_branch is None
                      and resolution.effective_date.isoformat() in resolution.reference
                  )
              else:
                  valid_reference = (
                      resolution.reference.startswith("ziwei-hour:")
                      and resolution.reference.endswith(boundary_suffix)
                      and resolution.hour_branch == resolution.earthly_branch
                      and resolution.hour_branch is not None
                      and (":" + resolution.hour_branch + "@") in resolution.reference
                      and resolution.effective_date.isoformat() in resolution.reference
                  )
              if not valid_reference:
                  raise ZiweiFineCycleError(
                      "fine_cycle_reference_conflict",
                      "fine-cycle scope/reference metadata is incoherent",
                      {"scope": resolution.scope, "reference": resolution.reference},
                  )


          def build_fine_cycle_layer(
              resolution,
              chart_identity,
              star_locations,
              transformation_profile_id=PROFILE_ID,
          ):
              _validate_resolution(resolution)
              if star_locations.chart_identity != chart_identity:
                  raise ZiweiPhase2AError(
                      "chart_basis_mismatch",
                      "fine-cycle chart and star index mismatch",
                  )
              source = CycleStemSource(
                  "cycle_stem",
                  chart_identity,
                  resolution.scope,
                  resolution.reference,
                  resolution.heavenly_stem,
              )
              transformations = get_transformation_set(
                  resolution.heavenly_stem,
                  transformation_profile_id,
              )
              if transformations.heavenly_stem != resolution.heavenly_stem:
                  raise ZiweiFineCycleError(
                      "fine_cycle_stem_mismatch",
                      "resolved and transformation stems differ",
                      {
                          "resolved_stem": resolution.heavenly_stem,
                          "transformation_stem": transformations.heavenly_stem,
                      },
                  )
              edges = fly_transformations(transformations, star_locations, source)
              identity = LayerIdentity(
                  chart_identity.chart_id,
                  resolution.scope,
                  resolution.reference,
                  transformations.profile_id,
              )
              return build_cycle_layer(
                  identity,
                  source,
                  transformations,
                  edges,
                  resolution.provenance,
                  earthly_branch=resolution.earthly_branch,
              )
          PY
      - name: Verify staged RED is exactly Composition scope guard
        run: |
          set +e
          python -m unittest tests.test_ziwei_fine_cycle_integration.FineCycleTransformationIntegrationTests.test_each_fine_scope_builds_exactly_four_transformations_and_edges -v > staged-red.txt 2>&1
          rc=$?
          cat staged-red.txt
          if [ "$rc" -eq 0 ]; then
            echo "Composition was unexpectedly already fine-cycle capable"
            exit 1
          fi
          grep -q "Phase 2A does not execute fine-cycle transformations" staged-red.txt
          echo TASK6_STAGED_RED_COMPOSITION_DEPENDENCY
      - name: Expand Composition minimally
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/ziwei/composition.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'SUPPORTED_SCOPES = {"birth_year", "decadal", "yearly"}',
              'SUPPORTED_SCOPES = {"birth_year", "decadal", "yearly", "monthly", "daily", "hourly"}',
          )
          text = text.replace(
              '"Phase 2A does not execute fine-cycle transformations",',
              '"unsupported Ziwei transformation layer scope",',
          )
          text = text.replace(
              '"monthly_transformations": AvailabilityRecord(\n                "unavailable", FINE_CYCLE_REASON\n            ),\n            "daily_transformations": AvailabilityRecord(\n                "unavailable", FINE_CYCLE_REASON\n            ),\n            "hourly_transformations": AvailabilityRecord(\n                "unavailable", FINE_CYCLE_REASON\n            ),',
              '"monthly_transformations": AvailabilityRecord(\n                "conditional", "matching_resolved_stem_required"\n            ),\n            "daily_transformations": AvailabilityRecord(\n                "conditional", "matching_resolved_stem_required"\n            ),\n            "hourly_transformations": AvailabilityRecord(\n                "conditional", "matching_resolved_stem_required"\n            ),',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify GREEN and regressions
        run: |
          python -m unittest tests.test_ziwei_fine_cycle_integration -v
          python -m unittest tests.test_ziwei_composition tests.test_ziwei_flying -v
          python -m unittest discover -v
          echo FINE_CYCLE_TRANSFORMATIONS_PASS
          echo FINE_CYCLE_FLYING_PASS
          echo FINE_CYCLE_COMPOSITION_PASS
          echo FINE_CYCLE_NEGATIVE_CASES_PASS
      - name: Commit Tasks 6 and 7 to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ziwei/fine_cycle.py engine/ziwei/composition.py tests/test_ziwei_fine_cycle_integration.py tests/test_ziwei_composition.py
          git commit -m "feat: integrate Ziwei fine-cycle transformation layers"
          git push origin HEAD:feature/ziwei-fine-cycle-stem-resolver-v1
