name: Temporary refresh AI distribution

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Rebuild official AI distribution
        run: python tools/build_ai_distribution.py
      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          test "$changed" = "dist/ai/metaphysics_lab.py"
      - name: Commit generated runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/metaphysics_lab.py
          git commit -m "build: refresh AI distribution for EFA"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
