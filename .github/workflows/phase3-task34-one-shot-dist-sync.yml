name: Phase 3 Task 3.4 One-Shot Distribution Sync

on:
  push:
    branches:
      - feature/lin-tianji-phase3-eligibility-ranking
    paths:
      - .github/workflows/phase3-task34-one-shot-dist-sync.yml

permissions:
  contents: write

jobs:
  sync-generated-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/lin-tianji-phase3-eligibility-ranking
          fetch-depth: 0

      - name: Confirm clean starting tree
        shell: bash
        run: |
          set -euo pipefail
          echo "head_sha=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild and verify AI distribution
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Prove exact generated-only dirty path
        shell: bash
        run: |
          set -euo pipefail
          echo 'git status --short:'
          git status --short
          echo 'git diff --name-only:'
          git diff --name-only
          status="$(git status --porcelain=v1)"
          expected=' M dist/ai/metaphysics_lab.py'
          if [[ "$status" != "$expected" ]]; then
            echo 'ERROR: expected exactly one modified generated artifact.' >&2
            printf 'expected: %q\nactual:   %q\n' "$expected" "$status" >&2
            exit 1
          fi
          changed="$(git diff --name-only)"
          test "$changed" = 'dist/ai/metaphysics_lab.py'

      - name: Commit generated artifact only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/ai/metaphysics_lab.py
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = 'dist/ai/metaphysics_lab.py'
          git commit -m 'build: sync Task 3.4 generated distribution'
          git push origin HEAD:feature/lin-tianji-phase3-eligibility-ranking
