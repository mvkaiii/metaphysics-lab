name: Phase 2C Baseline Validation

on:
  pull_request:
    branches:
      - design/ziwei-flowing-stars
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Full repository baseline
        run: python -m unittest discover -s tests -v
      - name: Python 3.9 syntax gate
        run: |
          python -m compileall -q engine tests tools
          python - <<'PY'
          import ast
          from pathlib import Path
          for root in ('engine', 'tests', 'tools'):
              for path in Path(root).rglob('*.py'):
                  ast.parse(path.read_text(encoding='utf-8'), feature_version=(3, 9))
          print('PHASE2C_BASELINE_PYTHON39_PASS')
          PY
