name: v1.7 Guided Contract GREEN Fix

on:
  push:
    branches:
      - release/v1.7.0-integration
    paths:
      - .github/workflows/v17-guided-contract-green.yml

permissions:
  contents: write

jobs:
  green-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.7.0-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2
      - name: Apply minimal instruction-contract repair
        run: |
          python tools/repair_v17_guided_contract.py
      - name: Rebuild distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check
      - name: Focused regression
        run: |
          python -m unittest tests.test_v17_guided_inquiry_ai_contract tests.test_v17_sandbox_followup_regressions tests.test_project_ux_contract -v
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/核心提示詞.md dist/ai/project_instructions.txt
          git commit -m 'fix: restore v1.7 guided inquiry instruction contract'
          git push origin HEAD:release/v1.7.0-integration

