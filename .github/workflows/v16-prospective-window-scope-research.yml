name: v1.6 prospective window scope research

on:
  push:
    branches:
      - research/v1.6-prospective-window-scope-v1
    paths:
      - 'engine/distribution/prospective_window_scope.py'
      - 'engine/distribution/claim_authority_manifest.py'
      - 'engine/distribution/prospective_claim_universe.py'
      - 'tests/test_distribution_prospective_window_scope.py'
      - 'tests/test_distribution_claim_authority_manifest.py'
      - 'tests/test_distribution_prospective_claim_universe.py'
      - 'tests/test_distribution_prospective_scope_integration.py'
      - '.github/workflows/v16-prospective-window-scope-research.yml'
  pull_request:
    branches:
      - impl/v1.6-legacy-adapter-paired-evaluation
    paths:
      - 'engine/distribution/prospective_window_scope.py'
      - 'engine/distribution/claim_authority_manifest.py'
      - 'engine/distribution/prospective_claim_universe.py'
      - 'tests/test_distribution_prospective_window_scope.py'
      - 'tests/test_distribution_claim_authority_manifest.py'
      - 'tests/test_distribution_prospective_claim_universe.py'
      - 'tests/test_distribution_prospective_scope_integration.py'
      - '.github/workflows/v16-prospective-window-scope-research.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run prospective governance focused tests
        run: |
          python -m unittest \
            tests.test_distribution_prospective_window_scope \
            tests.test_distribution_claim_authority_manifest \
            tests.test_distribution_prospective_claim_universe \
            -v
