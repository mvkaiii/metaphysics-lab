name: Phase 2C Task 0 GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-flowing-stars-v1
  workflow_dispatch:

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Task 0 and capability regression
        run: |
          python -m unittest tests.test_ziwei_phase2c_rule_source -v
          python -m unittest discover -s tests -p '*capabilit*.py' -v
