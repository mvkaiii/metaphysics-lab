name: v1.7 Investigate AI Distribution Mismatches

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-artifact-investigate-ai-mismatch.yml

permissions:
  actions: read
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare broad AI distribution pool with strict policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | {id,name,size_in_bytes,expired,created_at,head_sha:.workflow_run.head_sha,run_id:.workflow_run.id}' \
            | jq -s '.' > "$tmp"

          python - "$tmp" <<'PY'
          import json
          import re
          import subprocess
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools')
          from v17_artifact_cleanup_ai_policy import (
              CURRENT_CANDIDATE,
              V160_TAG_SHA,
              select_ai_distribution_cleanup_artifacts,
          )

          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          broad_re = re.compile(r'^lin-tianji-v1\.(5|6|7)-(?:rebuilt-)?ai-distribution-')
          broad = [
              item for item in artifacts
              if item.get('head_sha') not in {CURRENT_CANDIDATE, V160_TAG_SHA}
              and broad_re.match(item.get('name', ''))
          ]
          strict = select_ai_distribution_cleanup_artifacts(artifacts)
          strict_ids = {item['id'] for item in strict}
          rejected = [item for item in broad if item['id'] not in strict_ids]

          enriched = []
          for item in rejected:
              run = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{item["run_id"]}'
              ], text=True))
              enriched.append({
                  **item,
                  'run_name': run['name'],
                  'run_path': run['path'],
                  'head_branch': run['head_branch'],
                  'run_head_sha': run['head_sha'],
                  'display_title': run['display_title'],
                  'event': run['event'],
                  'conclusion': run['conclusion'],
              })

          print(json.dumps({
              'broad_count': len(broad),
              'broad_bytes': sum(x['size_in_bytes'] for x in broad),
              'strict_count': len(strict),
              'strict_bytes': sum(x['size_in_bytes'] for x in strict),
              'rejected_count': len(rejected),
              'rejected_bytes': sum(x['size_in_bytes'] for x in rejected),
              'rejected': enriched,
          }, indent=2, sort_keys=True))
          PY
