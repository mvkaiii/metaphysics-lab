name: v1.7 Sandbox Follow-up GREEN Builder

on:
  push:
    branches:
      - release/v1.7.0-sandbox-followup
    paths:
      - .github/workflows/v17-sandbox-followup-green.yml

permissions:
  contents: write

jobs:
  build-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.7.0-sandbox-followup
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply narrow GREEN fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit('expected text missing in %s: %r' % (path, old[:120]))
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # S04: pending forecast is its own distinct validation direction; allow the
          # existing fourth slot whenever a pending forecast supplies that high-value path.
          replace_once(
              'engine/distribution/guided_inquiry.py',
              '    if answer["forecast_lock_eligible"]:\n        rows.append(_row("validation", domain, scope, ceiling, ceiling, "forecast_can_be_tracked"))\n',
              '    if payload["pending_forecast_available"]:\n        rows.append(_row("validation", domain, scope, ceiling, ceiling, "pending_forecast_tracking"))\n    elif answer["forecast_lock_eligible"]:\n        rows.append(_row("validation", domain, scope, ceiling, ceiling, "forecast_can_be_tracked"))\n',
          )
          replace_once(
              'engine/distribution/guided_inquiry.py',
              '    allow_fourth = normalized["mode"] == "entry" and normalized["pending_forecast_available"]\n',
              '    allow_fourth = normalized["pending_forecast_available"]\n',
          )

          # S09: hard natural-language recovery-only boundary while BLOCKED.
          blocked_anchor = '- `BLOCKED`：不得把有衝突或 identity／manifest 不一致的 Case 當完整 authority；只能使用 `safe_analysis_scopes` 明確允許的安全範圍，或先完成必要的人工確認／修正。\n'
          blocked_rule = '\nBLOCKED 狀態下只提供解除 blocking conflict 的 recovery guidance；不得列出『衝突解除後可以問』的一般命理問題清單。\n'
          replace_once('core/AI工作流程.md', blocked_anchor, blocked_anchor + blocked_rule)

          # S11: wording itself must remain under the deterministic specificity ceiling.
          spec_anchor = '- 建議只能在目前允許的 **specificity ceiling** 內導引，不得提高 specificity；只有在既有 authority 與輸入精度已允許時，才可提出更細時間層、事件型態或決策比較。\n'
          spec_rule = '- 建議問題的文字本身也不得超過 specificity ceiling；不得把 event_family 改寫成升職、加薪或其他 event_form 故事。\n'
          replace_once('core/AI工作流程.md', spec_anchor, spec_anchor + spec_rule)

          # Project Instructions carry the same hard presentation rules. Keep the
          # established <= 8000-character qualification by removing redundant wording.
          pi = Path('core/核心提示詞.md')
          text = pi.read_text(encoding='utf-8')
          dialogue_anchor = '## 對話方式\n'
          addition = (
              'BLOCKED 狀態下只提供解除 blocking conflict 的 recovery guidance；不得列出『衝突解除後可以問』的一般命理問題清單。\n'
              '建議問題的文字本身也不得超過 specificity ceiling；不得把 event_family 改寫成升職、加薪或其他 event_form 故事。\n'
          )
          if dialogue_anchor not in text or 'BLOCKED 狀態下只提供解除 blocking conflict' in text:
              raise SystemExit('project instructions insertion contract mismatch')
          text = text.replace(dialogue_anchor, addition + dialogue_anchor, 1)
          redundant = '一般使用者回答仍以台灣繁體中文白話呈現，不把 runtime 欄位或演算法權重當回答主體。\n\n主動顯示建議，預設 3 個；不得在盲判前用驗證事件產生建議；使用者可以直接自由輸入、不必選建議。\n'
          if redundant not in text:
              raise SystemExit('expected redundant v1.5 presentation text missing')
          text = text.replace(redundant, '', 1)
          redundant2 = '**對話是自然語言；Markdown Case 才是結構化文件。**\n\n'
          if redundant2 not in text:
              raise SystemExit('expected redundant dialogue tagline missing')
          text = text.replace(redundant2, '', 1)
          old_summary = '最後永遠遵守：命盤提供模型；Python 提供可重現的盤面與時間層；事件提供證據；現實背景決定策略。'
          new_summary = '命盤提供模型；Python 提供可重現盤面；事件提供證據；現實背景決定策略。'
          if old_summary not in text:
              raise SystemExit('expected summary line missing')
          text = text.replace(old_summary, new_summary, 1)
          # Remove three redundant blank separators without changing rules.
          text = text.replace('一般命理問題清單。\n\n建議問題的文字本身', '一般命理問題清單。\n建議問題的文字本身', 1)
          text = text.replace('其他 event_form 故事。\n\n## 對話方式', '其他 event_form 故事。\n## 對話方式', 1)
          text = text.replace('命盤提供模型；Python 提供可重現盤面；事件提供證據；現實背景決定策略。\n\n# 十七', '命盤提供模型；Python 提供可重現盤面；事件提供證據；現實背景決定策略。\n# 十七', 1)
          pi.write_text(text, encoding='utf-8')
          if len(text) > 8000:
              raise SystemExit('project instructions exceed 8000 chars: %d' % len(text))
          print('project instructions chars:', len(text))

          # S03 is a contract wording bug, not a product opt-out bug. Bump v3 and
          # remove the explicit stop phrase while preserving S02 -> S03 continuity.
          script = Path('docs/release/v1.7.0-isolated-sandbox-script.md')
          text = script.read_text(encoding='utf-8')
          if 'script_version: v1.7.0-isolated-sandbox-script.v2' not in text:
              raise SystemExit('sandbox script v2 marker missing')
          text = text.replace('script_version: v1.7.0-isolated-sandbox-script.v2', 'script_version: v1.7.0-isolated-sandbox-script.v3', 1)
          old_s03 = 'User prompt: `先到這裡。`\n\nPASS criteria: the completed answer is followed by exactly 3 natural continuation directions when no distinct fourth direction is warranted.'
          new_s03 = 'User prompt: `好，接著還能看什麼？`\n\nPASS criteria: the completed answer is followed by exactly 3 natural continuation directions when no distinct fourth direction is warranted.'
          if old_s03 not in text:
              raise SystemExit('S03 v2 prompt missing')
          text = text.replace(old_s03, new_s03, 1)
          script.write_text(text, encoding='utf-8')

          # All executable evidence-contract references move with the frozen script.
          for path in (
              'tools/validate_v17_sandbox_evidence.py',
              'tests/test_v17_sandbox_execution_contract.py',
              'tests/test_v17_sandbox_contract.py',
          ):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if 'v1.7.0-isolated-sandbox-script.v2' not in text:
                  raise SystemExit('v2 script marker missing in %s' % path)
              p.write_text(text.replace('v1.7.0-isolated-sandbox-script.v2', 'v1.7.0-isolated-sandbox-script.v3'), encoding='utf-8')

          # Qualification is reset because this is a new semantic candidate.
          q = Path('docs/release/v1.7.0-qualification.md')
          text = q.read_text(encoding='utf-8')
          text = text.replace('sandbox_contract_version: v1.7.0-isolated-sandbox-script.v2', 'sandbox_contract_version: v1.7.0-isolated-sandbox-script.v3', 1)
          text = text.replace('The repaired v2 contract', 'The repaired v3 contract', 1)
          text = text.replace('tested_release_candidate_sha: aaa0e3ff31bdccfad089f2ba63cc7c783c740c39', 'tested_release_candidate_sha: PENDING', 1)
          text = text.replace('candidate_frozen_at: 2026-09-10T16:02:30Z', 'candidate_frozen_at: PENDING', 1)
          text = text.replace('hosted_v17_validation_run_id: 34499591543', 'hosted_v17_validation_run_id: PENDING', 1)
          text = text.replace('hosted_v17_validation_job_id: 102946709215', 'hosted_v17_validation_job_id: PENDING', 1)
          text = text.replace('hosted_v17_validation_status: PASS', 'hosted_v17_validation_status: PENDING', 1)
          text = text.replace('hosted_v17_validation_started_at: 2026-09-10T16:02:52Z', 'hosted_v17_validation_started_at: PENDING', 1)
          text = text.replace('hosted_v17_validation_completed_at: 2026-09-10T16:05:10Z', 'hosted_v17_validation_completed_at: PENDING', 1)
          text = text.replace('- [x] v1.7 release-surface validator PASS on exact candidate SHA', '- [ ] v1.7 release-surface validator PASS on exact candidate SHA', 1)
          text = text.replace('- [x] full repository regression PASS', '- [ ] full repository regression PASS', 1)
          text = text.replace('- [x] v1.5 / v1.6 backward-compatibility gates PASS', '- [ ] v1.5 / v1.6 backward-compatibility gates PASS', 1)
          text = text.replace('- [x] Python 3.9 compile PASS', '- [ ] Python 3.9 compile PASS', 1)
          text = text.replace('- [x] deterministic AI distribution check PASS', '- [ ] deterministic AI distribution check PASS', 1)
          text = text.replace('- [x] deterministic v1.7.0 three-file User Package PASS', '- [ ] deterministic v1.7.0 three-file User Package PASS', 1)
          text = text.replace('- [x] private/outcome contamination scan PASS', '- [ ] private/outcome contamination scan PASS', 1)
          text = text.replace('- [x] clean tree PASS', '- [ ] clean tree PASS', 1)
          text = text.replace('- [x] hosted v1.7 validation PASS on exact candidate SHA', '- [ ] hosted v1.7 validation PASS on exact candidate SHA', 1)
          reset_note = '\n## Sandbox follow-up candidate reset\n\nThe previous `aaa0e3ff31bdccfad089f2ba63cc7c783c740c39` candidate and its v2 sandbox qualification are superseded after real sandbox execution exposed S03 contract wording plus S04/S09/S11 behavior gaps. The v3 script preserves the failed run as historical evidence; software gates and the isolated sandbox must be rerun on the new exact semantic candidate.\n'
          if '## Sandbox follow-up candidate reset' not in text:
              text = text.replace('\n## Critical rubric\n', reset_note + '\n## Critical rubric\n', 1)
          q.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild deterministic AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Run focused GREEN regression
        run: |
          python -m unittest \
            tests.test_v17_sandbox_followup_regressions \
            tests.test_v17_sandbox_execution_contract \
            tests.test_v17_sandbox_contract \
            tests.test_v17_guided_inquiry -v

      - name: Verify instruction size and generated parity
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('dist/ai/project_instructions.txt').read_text(encoding='utf-8')
          assert len(text) <= 8000, len(text)
          assert text == Path('core/核心提示詞.md').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n').rstrip() + '\n'
          print('project instructions chars:', len(text))
          PY

      - name: Remove staging workflow and commit GREEN candidate
        run: |
          rm .github/workflows/v17-sandbox-followup-green.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/distribution/guided_inquiry.py core/AI工作流程.md core/核心提示詞.md docs/release/v1.7.0-isolated-sandbox-script.md docs/release/v1.7.0-qualification.md tools/validate_v17_sandbox_evidence.py tests/test_v17_sandbox_execution_contract.py tests/test_v17_sandbox_contract.py dist/ai/metaphysics_lab.py dist/ai/metaphysics_core.md dist/ai/project_instructions.txt .github/workflows/v17-sandbox-followup-green.yml
          git commit -m 'fix: harden v1.7 sandbox follow-up behavior'
          git push origin HEAD:release/v1.7.0-sandbox-followup
