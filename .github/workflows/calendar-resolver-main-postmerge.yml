name: Calendar Resolver main post-merge validation

on:
  pull_request:
    branches:
      - main

jobs:
  verify-main:
    runs-on: ubuntu-latest
    env:
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run Calendar subsystem
        run: |
          python -m unittest \
            tests.test_calendar_precision \
            tests.test_calendar_models \
            tests.test_calendar_timezone \
            tests.test_calendar_lunar \
            tests.test_calendar_resolver \
            tests.test_calendar_package_exports \
            tests.test_ziwei_calendar_adapter \
            -v 2>&1 | tee calendar-subsystem.txt
      - name: Run full repository suite
        run: python -m unittest discover -v 2>&1 | tee full-repo.txt
      - name: Verify provider provenance
        run: |
          python - <<'PY' | tee provenance.txt
          from importlib.metadata import version
          import tzdata
          assert version('lunar_python') == '1.4.8'
          assert version('tzdata') == '2026.3'
          assert tzdata.IANA_VERSION == '2026c'
          print('PROVENANCE_PASS')
          PY
      - name: Verify documentation contract
        run: |
          python - <<'PY' | tee docs-sanity.txt
          from pathlib import Path
          files = [
              Path('README.md'),
              Path('docs/架構說明.md'),
              Path('docs/安裝到ChatGPT-Project.md'),
              Path('docs/更新與版本同步.md'),
              Path('core/命理分析作業規範.md'),
              Path('VERSION.md'),
              Path('CHANGELOG.md'),
          ]
          text = '\n'.join(p.read_text() for p in files)
          assert '1901-01-01..2100-12-31' in text
          assert '2057-09-28..2057-10-27' in text
          assert '2089-09-04' in text and '2097-08-07' in text
          assert 'metaphysics_day_boundary_applied = false' in text
          assert 'lunar-python==1.4.8' in text
          assert 'tzdata==2026.3' in text
          assert '00:00' in Path('docs/架構說明.md').read_text()
          core = Path('core/命理分析作業規範.md').read_text()
          assert '第一階段盲判 → 第二階段事件校準' in core
          assert '改寫第一版盲判' in core
          print('DOCS_SANITY_PASS')
          PY
      - name: Verify validation-only diff
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed" | tee validation-scope.txt
          test "$changed" = ".github/workflows/calendar-resolver-main-postmerge.yml"
          echo MAIN_SCOPE_PASS | tee -a validation-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-resolver-main-postmerge-evidence
          path: |
            calendar-subsystem.txt
            full-repo.txt
            provenance.txt
            docs-sanity.txt
            validation-scope.txt
