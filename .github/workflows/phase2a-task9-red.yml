name: Phase 2A Task 9 RED

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run stable promotion RED test
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_capabilities.ZiweiPhase2AStablePromotionTests -v 2>&1 | tee task9-red.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task9-red-evidence
          path: task9-red.txt
