name: v1.6 Yearly Ziwei Transformations Y1 Distribution Rebuild

on:
  push:
    branches:
      - research/v1.6-yearly-ziwei-transformations-y1

permissions:
  contents: write

jobs:
  rebuild-distribution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm exact validation SHA
        run: |
          echo "github_sha=${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild committed distribution only
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^dist/ai/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi
          sha256sum dist/ai/*

      - name: Commit deterministic generated artifacts
        run: |
          if git diff --quiet -- dist/ai; then
            echo "Distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai
          git commit -m "build: refresh AI distribution for yearly transformations"
          git push origin HEAD:research/v1.6-yearly-ziwei-transformations-y1
