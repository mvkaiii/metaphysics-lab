name: v1.6 Yearly Ziwei Transformations Y1 Distribution Rebuild

on:
  push:
    branches:
      - research/v1.6-yearly-ziwei-transformations-y1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm exact validation SHA
        run: |
          echo "github_sha=${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild distribution into isolated output
        run: |
          mkdir -p "$RUNNER_TEMP/dist-ai"
          python tools/build_ai_distribution.py --output-dir "$RUNNER_TEMP/dist-ai"
          python tools/build_ai_distribution.py --output-dir "$RUNNER_TEMP/dist-ai" --check
          sha256sum "$RUNNER_TEMP/dist-ai"/*

      - name: Upload deterministic rebuilt distribution
        uses: actions/upload-artifact@v4
        with:
          name: v1.6-yearly-transformations-y1-dist-rebuild-${{ github.sha }}
          path: ${{ runner.temp }}/dist-ai/
          if-no-files-found: error
