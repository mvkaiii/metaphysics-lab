name: v1.7 Sandbox Follow-up GREEN Builder Retry

on:
  push:
    branches:
      - release/v1.7.0-sandbox-followup
    paths:
      - .github/workflows/v17-sandbox-followup-green-retry.yml

permissions:
  contents: write

jobs:
  build-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.7.0-sandbox-followup
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply frozen GREEN patch from first builder
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/v17-sandbox-followup-green.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('staging patch block missing')
          block = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(block), {})

          # The repository source is one character longer than the previously
          # reconstructed artifact. Remove one redundant blank separator only.
          pi = Path('core/核心提示詞.md')
          text = pi.read_text(encoding='utf-8')
          if len(text) > 8000:
              old = '\n\n## 可驗證資料包交付'
              if old not in text:
                  raise SystemExit('no safe redundant separator available')
              text = text.replace(old, '\n## 可驗證資料包交付', 1)
              pi.write_text(text, encoding='utf-8')
          if len(text) > 8000:
              raise SystemExit('project instructions still exceed 8000 chars: %d' % len(text))
          print('project instructions chars:', len(text))
          PY

      - name: Rebuild deterministic AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Run focused GREEN regression
        run: |
          python -m unittest \
            tests.test_v17_sandbox_followup_regressions \
            tests.test_v17_sandbox_execution_contract \
            tests.test_v17_sandbox_contract \
            tests.test_v17_guided_inquiry -v

      - name: Verify instruction size and generated parity
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('dist/ai/project_instructions.txt').read_text(encoding='utf-8')
          assert len(text) <= 8000, len(text)
          assert text == Path('core/核心提示詞.md').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n').rstrip() + '\n'
          print('project instructions chars:', len(text))
          PY

      - name: Remove staging workflows and commit GREEN candidate
        run: |
          rm .github/workflows/v17-sandbox-followup-green.yml
          rm .github/workflows/v17-sandbox-followup-green-retry.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden v1.7 sandbox follow-up behavior'
          git push origin HEAD:release/v1.7.0-sandbox-followup
