name: v1.7 Post-Cleanup Artifact Inventory

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-artifact-postcleanup-inventory.yml

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify post-cleanup artifact state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | {id,name,size_in_bytes,expired,created_at,head_sha:.workflow_run.head_sha,run_id:.workflow_run.id}' \
            | jq -s '.' > "$tmp"

          python - "$tmp" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools')
          from v17_artifact_cleanup_ai_policy import (
              CURRENT_CANDIDATE,
              V160_TAG_SHA,
              select_ai_distribution_cleanup_artifacts,
          )

          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          strict = select_ai_distribution_cleanup_artifacts(artifacts)
          broad_re = re.compile(r'^lin-tianji-v1\.(5|6|7)-(?:rebuilt-)?ai-distribution-')
          broad = [
              item for item in artifacts
              if item.get('head_sha') not in {CURRENT_CANDIDATE, V160_TAG_SHA}
              and broad_re.match(item.get('name', ''))
          ]
          protected = [
              item for item in artifacts
              if item.get('head_sha') in {CURRENT_CANDIDATE, V160_TAG_SHA}
          ]

          result = {
              'total_count': len(artifacts),
              'total_bytes': sum(item['size_in_bytes'] for item in artifacts),
              'protected_count': len(protected),
              'protected_bytes': sum(item['size_in_bytes'] for item in protected),
              'strict_old_ai_count': len(strict),
              'strict_old_ai_bytes': sum(item['size_in_bytes'] for item in strict),
              'broad_old_ai_count': len(broad),
              'broad_old_ai_bytes': sum(item['size_in_bytes'] for item in broad),
              'broad_old_ai_items': broad,
          }
          print(json.dumps(result, indent=2, sort_keys=True))

          if strict:
              raise SystemExit('strict old AI distribution cleanup pool is not empty')
          if len(broad) != 3 or sum(item['size_in_bytes'] for item in broad) != 2_058_033:
              raise SystemExit('unexpected broad AI distribution remainder')
          PY
