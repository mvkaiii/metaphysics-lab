name: v1.7 Task 2 Finalize

on:
  push:
    branches:
      - release/v1.7.0-integration

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require triggering SHA to remain branch head
        run: |
          remote_sha="$(git ls-remote origin refs/heads/release/v1.7.0-integration | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Apply v1.7 contract and candidate docs
        run: |
          python - <<'PY'
          from pathlib import Path

          constants = Path("engine/distribution/constants.py")
          text = constants.read_text(encoding="utf-8")
          old_project = 'PROJECT_CONTRACT_VERSION = "1.1"'
          old_runtime = 'DISTRIBUTION_RUNTIME_VERSION = "1.1-exp"'
          assert text.count(old_project) == 1, "unexpected Project Contract source state"
          assert text.count(old_runtime) == 1, "unexpected Distribution Runtime source state"
          assert 'RUNTIME_SCHEMA_VERSION = "1.1"' in text
          assert 'CASE_SCHEMA_VERSION = "1.1"' in text
          text = text.replace(old_project, 'PROJECT_CONTRACT_VERSION = "1.2"', 1)
          text = text.replace(old_runtime, 'DISTRIBUTION_RUNTIME_VERSION = "1.2-exp"', 1)
          constants.write_text(text, encoding="utf-8")

          version = Path("VERSION.md")
          text = version.read_text(encoding="utf-8")
          marker = "## 最新正式發布\n"
          section = '''## v1.7.0 Release Contract｜整合候選

v1.7.0 定位為**可靠性與可用性版本**。此區塊描述目前整合候選的版本契約；在正式 Git tag / GitHub Release 建立前，`v1.6.0` 仍是最新正式發布，發布日期不在 implementation 階段預填，而是在正式 Release 執行時依 Asia/Taipei 當地日期確定。

```text
Project Contract          1.2
Runtime Schema            1.1
Case Schema               1.1
AI Distribution Runtime   1.2-exp
Capability Manifest       1.0
```

- **Case Schema 1.1 維持不變**；既有 Case 不需要破壞性重建，也不需要 schema migration。
- Historical Activation **selector v1** 與 Interpretation Contract **interpretation v1** 繼續作為正式 default；v1.7 發布本身不構成 v2 promotion。
- **Guided Inquiry** 是建議式導覽與追問導航，**不是新的命理證據**，不得提高既有盤面或 capability 的 specificity / confidence authority。
- Capability Manifest、Case Doctor、Prospective Validation 2.0 與 Guided Inquiry 的加入不會自動提升任何 Experimental capability maturity。

---

'''
          if "## v1.7.0 Release Contract｜整合候選" not in text:
              assert text.count(marker) == 1, "VERSION insertion marker missing"
              text = text.replace(marker, section + marker, 1)
              version.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## v1.6.0｜2026-09-05\n"
          section = '''## v1.7.0｜發行日期於正式 Release 執行時確定

### 可靠性與可用性整合候選

- 新增 Capability Manifest 1.0，讓 runtime capability 的 implementation、maturity、routing 與版本資訊有單一可驗證來源。
- 新增 Case Doctor + Legacy Reconciliation，以唯讀診斷與明確 reconciliation plan 處理 legacy / duplicate / subject-integrity 問題；不自動刪除或合併使用者檔案。
- 新增 Prospective Validation 2.0，將 clean prospective、conditional / known context、hidden existing reality 與 retrospective calibration 分開；只有合格且已裁決的 clean records 可進 clean denominator。
- 新增 Guided Inquiry，預設提供 3 個、必要時 4 個建議方向；它只做對話導航，不讀取盲判前禁止的驗證事件，且**不是新的命理證據**。
- Project Contract 升為 1.2；Runtime Schema 與 **Case Schema 1.1** 維持不變。既有 Case **不需要破壞性重建**或 schema migration。
- Historical Activation **selector v1** 與 Interpretation Contract **interpretation v1** 仍是 default；本 release 不包含 v2 promotion，也不因發版提升 Experimental capability maturity。
- AI Distribution Runtime 目標版本為 1.2-exp；正式發布日期、release candidate SHA、User Package digest 與 sandbox evidence 只在正式 Release gate 完成後記錄，不在 implementation 階段預填。

'''
          if "## v1.7.0｜發行日期於正式 Release 執行時確定" not in text:
              assert text.count(marker) == 1, "CHANGELOG insertion marker missing"
              text = text.replace(marker, section + marker, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Rebuild deterministic AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Run Task 2 GREEN qualification
        run: |
          python -m unittest \
            tests.test_v17_release_contract \
            tests.test_v16_post_release_docs \
            tests.test_v17_capability_docs_drift \
            tests.test_v17_capability_distribution_parity \
            tests.test_project_ux_contract -v
          python -m compileall -q engine tests tools dist/ai/metaphysics_lab.py
          git diff --check

      - name: Require branch head unchanged before push
        run: |
          remote_sha="$(git ls-remote origin refs/heads/release/v1.7.0-integration | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Commit Task 2 contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/constants.py VERSION.md CHANGELOG.md dist/ai
          git status --short
          git commit -m "chore: set v1.7 runtime contract"
          git push origin HEAD:release/v1.7.0-integration
