name: v1.6 prospective claim-authority set generated sync

on:
  push:
    branches:
      - research/v1.6-prospective-claim-authority-set

permissions:
  contents: write

jobs:
  sync-generated-distribution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Rebuild twice and require deterministic bytes
        run: |
          python tools/build_ai_distribution.py
          first="$(sha256sum dist/ai/metaphysics_lab.py | awk '{print $1}')"
          python tools/build_ai_distribution.py
          second="$(sha256sum dist/ai/metaphysics_lab.py | awk '{print $1}')"
          echo "DIST_SHA256=$second"
          test "$first" = "$second"
      - name: Require exact generated dirty surface
        run: |
          python - <<'PY'
          import subprocess
          status = subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'],
              text=True,
          ).splitlines()
          print('DIRTY=', status)
          expected = [' M dist/ai/metaphysics_lab.py']
          if status != expected:
              raise SystemExit('unexpected generated dirty surface: ' + repr(status))
          PY
      - name: Commit exact generated artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/ai/metaphysics_lab.py
          test "$(git diff --cached --name-only)" = "dist/ai/metaphysics_lab.py"
          git commit -m 'build: sync prospective claim-authority set distribution'
          git push origin HEAD:research/v1.6-prospective-claim-authority-set
