name: Feature Historical Calibration Validation

on:
  push:
    branches:
      - feature/progressive-case-historical-calibration
      - fix/postmerge-audit-161-165
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm validation SHA
        run: |
          echo "event=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"
          git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Commit full blind-source subject identity binding
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/postmerge-audit-161-165'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/distribution/calibration.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "from .case_pack import BASE_CASE_FILES, CASE_FILES, set_case_calibration_status, update_case_record\n",
                  "from .case_pack import BASE_CASE_FILES, CASE_FILES, set_case_calibration_status, update_case_record, validate_case\n",
              ),
              (
                  "def _canonical_case_sources(sources, subject_id=None) -> Tuple[list, list]:\n",
                  "def _canonical_case_sources(sources, subject_id=None, source_case_files=None) -> Tuple[list, list]:\n",
              ),
              (
                  '''    if subject_short_ids:\n        resolved_subject = str(subject_id or "")\n        subject_hex = resolved_subject[5:] if resolved_subject.startswith("subj_") else ""\n        is_hex = len(subject_hex) >= 12 and all(ch in "0123456789abcdef" for ch in subject_hex.lower())\n        short_id = next(iter(subject_short_ids))\n        if not is_hex or not subject_hex.upper().startswith(short_id):\n            raise DistributionError(\n                "blind_source_violation",\n                "subject-aware blind sources must match payload subject_id",\n                {"subject_id": resolved_subject, "subject_short_id": short_id, "actual_sources": actual},\n            )\n    return canonical, actual\n''',
                  '''    if subject_short_ids:\n        if not isinstance(source_case_files, Mapping):\n            raise DistributionError(\n                "blind_source_violation",\n                "subject-aware blind sources require the selected Base Case file contents for full identity validation",\n                {"actual_sources": actual},\n            )\n        if set(source_case_files) != set(actual):\n            raise DistributionError(\n                "blind_source_violation",\n                "source_case_files must contain exactly the selected blind Base Case files",\n                {"actual_sources": actual, "provided_sources": sorted(str(key) for key in source_case_files)},\n            )\n        validation = validate_case({"case_files": source_case_files})\n        resolved_subject = str(subject_id or "")\n        if validation.get("subject_id") != resolved_subject:\n            raise DistributionError(\n                "blind_source_violation",\n                "subject-aware blind sources must match the full payload subject_id",\n                {"subject_id": resolved_subject, "source_subject_id": validation.get("subject_id"), "actual_sources": actual},\n            )\n    return canonical, actual\n''',
              ),
              (
                  '    canonical_sources, actual_sources = _canonical_case_sources(payload.get("source_files_used"), subject_id)\n',
                  '    canonical_sources, actual_sources = _canonical_case_sources(\n        payload.get("source_files_used"), subject_id, payload.get("source_case_files")\n    )\n',
              ),
          ]
          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit("expected one calibration patch target, found %d" % count)
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- engine/distribution/calibration.py; then
            echo "Full identity fix already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add engine/distribution/calibration.py
            git commit -m "fix: bind blind Base5 to full subject identity (#162)"
            git push origin HEAD:fix/postmerge-audit-161-165
          fi

      - name: Historical selector and progressive Case focused tests
        run: |
          python -m unittest \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_historical_support \
            tests.test_distribution_case_pack \
            tests.test_distribution_partial_case \
            tests.test_distribution_runtime_info -v

      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check
          git diff --exit-code -- dist/ai

      - name: Full repository regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall engine tests tools

      - name: Verify clean validation tree
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"

      - name: Upload generated distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progressive-case-ai-distribution
          path: dist/ai/
          if-no-files-found: error
