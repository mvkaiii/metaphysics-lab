name: Feature Historical Calibration Validation

on:
  push:
    branches:
      - feature/progressive-case-historical-calibration
      - fix/postmerge-audit-161-165
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm validation SHA
        run: |
          echo "event=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"
          git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Commit historical authority test migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/postmerge-audit-161-165'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_distribution_historical_calibration.py")
          text = path.read_text(encoding="utf-8")
          import_marker = ")\n\n\nBASE_FILES = ["
          import_replacement = ")\n\nfrom tests.historical_authority_helpers import authoritative_finalize, authoritative_lock\n\n\nBASE_FILES = ["
          if import_replacement not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("historical calibration import patch target mismatch")
              text = text.replace(import_marker, import_replacement, 1)
          text = text.replace("lock_historical_calibration(", "authoritative_lock(")
          text = text.replace("finalize_historical_calibration(", "authoritative_finalize(locked, ")
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_distribution_historical_integrity.py")
          text = path.read_text(encoding="utf-8")
          import_marker = ")\n\n\ndef _row(year):"
          import_replacement = ")\n\nfrom tests.historical_authority_helpers import authoritative_finalize, authoritative_lock\n\n\ndef _row(year):"
          if import_replacement not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("historical integrity import patch target mismatch")
              text = text.replace(import_marker, import_replacement, 1)
          text = text.replace("lock_historical_calibration(", "authoritative_lock(")
          text = text.replace("finalize_historical_calibration(", "authoritative_finalize(locked, ")
          path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- tests/test_distribution_historical_calibration.py tests/test_distribution_historical_integrity.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_distribution_historical_calibration.py tests/test_distribution_historical_integrity.py
            git commit -m "test: migrate historical finalize to Case authority (#163)"
            git push origin HEAD:fix/postmerge-audit-161-165
          fi

      - name: Historical selector and progressive Case focused tests
        run: |
          python -m unittest \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_historical_integrity \
            tests.test_distribution_historical_support \
            tests.test_distribution_case_pack \
            tests.test_distribution_partial_case \
            tests.test_postmerge_audit_regressions \
            tests.test_distribution_runtime_info -v

      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Full repository regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall engine tests tools

      - name: Upload generated distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progressive-case-ai-distribution
          path: dist/ai/
          if-no-files-found: error
