name: Feature Historical Calibration Validation

on:
  push:
    branches:
      - fix/postmerge-audit-161-165
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Persist reserved lock authority hardening
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          case_path = Path('engine/distribution/case_pack.py')
          case = case_path.read_text(encoding='utf-8')
          marker = '_RESERVED_INTERNAL_RECORD_TYPES = frozenset(("historical_calibration_lock",))'
          if marker not in case:
              old = '_CALIBRATION_STATES = frozenset(("uncalibrated", "basic", "calibrated"))\n'
              assert case.count(old) == 1
              case = case.replace(old, old + marker + '\n', 1)

              old = 'def update_case_record(payload: Mapping[str, object]) -> dict:\n'
              new = 'def _update_case_record(payload: Mapping[str, object], *, allow_reserved_internal: bool = False) -> dict:\n'
              assert case.count(old) == 1
              case = case.replace(old, new, 1)

              old = '    entry = _mapping(payload.get("entry"), "entry")\n    if canonical == "05_驗證事件紀錄.md":\n'
              new = '''    entry = _mapping(payload.get("entry"), "entry")\n    if entry.get("record_type") in _RESERVED_INTERNAL_RECORD_TYPES and not allow_reserved_internal:\n        raise DistributionError(\n            "immutable_case_record",\n            "reserved internal Case record types cannot be appended through the public mutation API",\n            {"filename": requested_filename, "record_type": entry.get("record_type")},\n        )\n    if canonical == "05_驗證事件紀錄.md":\n'''
              assert case.count(old) == 1
              case = case.replace(old, new, 1)

              suffix = '    return {"subject_id": validation["subject_id"], "changed_files": changed}\n'
              assert case.endswith(suffix)
              case += '''\n\ndef update_case_record(payload: Mapping[str, object]) -> dict:\n    """Public progressive Case mutation entry point; reserved authority records are blocked."""\n    return _update_case_record(payload, allow_reserved_internal=False)\n\n\ndef _append_internal_case_record(payload: Mapping[str, object]) -> dict:\n    """Internal-only append path for runtime-owned immutable authority records."""\n    return _update_case_record(payload, allow_reserved_internal=True)\n'''
              case_path.write_text(case, encoding='utf-8')
          else:
              assert 'def _append_internal_case_record(' in case
              assert 'allow_reserved_internal=False' in case

          authority_path = Path('engine/distribution/historical_lock_authority.py')
          authority = authority_path.read_text(encoding='utf-8')
          if '_append_internal_case_record' not in authority:
              old = '''"""Case-backed authority for immutable historical calibration locks.\n\nThe public SHA-256 digest remains a deterministic content checksum. Trust comes from\nretrieving the original lock record from the subject's persisted Case, not from a\ndigest supplied in the same finalize request.\n"""'''
              new = '''"""Case-backed authority for immutable historical calibration locks.\n\nThe public SHA-256 digest remains a deterministic content checksum. The trust anchor\nis host-retrieved persisted Case state: finalize reloads the original lock instead of\ntrusting request-supplied lock material, and public Case mutation cannot create this\nreserved record type. This does not cryptographically authenticate a persistence layer\nthat an attacker can rewrite outside the runtime's mutation boundary.\n"""'''
              assert authority.count(old) == 1
              authority = authority.replace(old, new, 1)

              old = 'from .case_pack import CASE_FILES, _record_entries, parse_front_matter, update_case_record, validate_case\n'
              new = 'from .case_pack import CASE_FILES, _append_internal_case_record, _record_entries, parse_front_matter, validate_case\n'
              assert authority.count(old) == 1
              authority = authority.replace(old, new, 1)

              old = '    update = update_case_record({\n'
              new = '    update = _append_internal_case_record({\n'
              assert authority.count(old) == 1
              authority = authority.replace(old, new, 1)

              old = '''    if not isinstance(locked, Mapping) or not isinstance(digest, str) or not digest:\n        raise DistributionError(\n            "immutable_calibration_violation",\n            "historical lock authority record is malformed",\n            {"lock_record_id": lock_record_id},\n        )\n    return {\n'''
              new = '''    if not isinstance(locked, Mapping) or not isinstance(digest, str) or not digest:\n        raise DistributionError(\n            "immutable_calibration_violation",\n            "historical lock authority record is malformed",\n            {"lock_record_id": lock_record_id},\n        )\n    calibration_id = locked.get("calibration_id")\n    if not isinstance(calibration_id, str) or not calibration_id or lock_record_id != "historical-lock-%s" % calibration_id:\n        raise DistributionError(\n            "immutable_calibration_violation",\n            "historical lock record_id is not bound to locked calibration_id",\n            {"lock_record_id": lock_record_id},\n        )\n    if locked.get("subject_id") != record.get("subject_id"):\n        raise DistributionError(\n            "immutable_calibration_violation",\n            "historical locked payload subject does not match authority record subject",\n            {"lock_record_id": lock_record_id},\n        )\n    return {\n'''
              assert authority.count(old) == 1
              authority = authority.replace(old, new, 1)
              authority_path.write_text(authority, encoding='utf-8')
          else:
              assert 'host-retrieved persisted Case state' in authority
              assert 'record_id is not bound to locked calibration_id' in authority
          PY
          git diff --check
          if git diff --quiet -- engine/distribution/case_pack.py engine/distribution/historical_lock_authority.py; then
            echo "Authority hardening already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/case_pack.py engine/distribution/historical_lock_authority.py
          git commit -m "fix: reserve historical lock authority records (#163)"
          git push origin HEAD:fix/postmerge-audit-161-165
