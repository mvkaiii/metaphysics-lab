      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Focused second-round and existing contract tests
        run: |
          python -m unittest \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_historical_integrity \
            tests.test_distribution_historical_support \
            tests.test_distribution_case_pack \
            tests.test_distribution_partial_case \
            tests.test_postmerge_audit_regressions \
            tests.test_second_round_adversarial_regressions \
            tests.test_distribution_runtime_info -v

      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: python -m compileall engine tests tools

      - name: Diff sanity
        run: git diff --check

      - name: Persist reviewed fixes and generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/partial_case.py engine/natal/candidates.py engine/distribution/case_pack.py dist/ai
          git diff --cached --exit-code && { echo "No fix changes to commit"; exit 1; } || true
          git commit -m "fix: harden second-round candidate and case boundaries"
          git push origin HEAD:fix/postmerge-audit-161-165
