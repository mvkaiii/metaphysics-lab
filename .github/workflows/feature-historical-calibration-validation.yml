name: Temporary Case Record Patch

on:
  push:
    branches:
      - fix/postmerge-audit-161-165

permissions:
  contents: write

jobs:
  patch-case-records:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: fix/postmerge-audit-161-165
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply exact Case record patches
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/distribution/case_pack.py")
          text = path.read_text(encoding="utf-8")

          if "def _json_semantically_equal(left: object, right: object) -> bool:" not in text:
              old = '''def _record_id(value: object, *, error_code: str = "invalid_case_payload") -> str:\n    if not isinstance(value, str) or value != value.strip() or not _RECORD_ID_PATTERN.fullmatch(value):\n        raise DistributionError(\n            error_code,\n            "record_id must be a canonical safe single-line identifier",\n            {"field": "entry.record_id"},\n        )\n    return value\n\n\ndef _timestamp'''
              new = '''def _record_id(value: object, *, error_code: str = "invalid_case_payload") -> str:\n    if not isinstance(value, str) or value != value.strip() or not _RECORD_ID_PATTERN.fullmatch(value):\n        raise DistributionError(\n            error_code,\n            "record_id must be a canonical safe single-line identifier",\n            {"field": "entry.record_id"},\n        )\n    return value\n\n\ndef _json_semantically_equal(left: object, right: object) -> bool:\n    try:\n        return json.dumps(left, ensure_ascii=False, sort_keys=True, separators=(",", ":")) == json.dumps(\n            right, ensure_ascii=False, sort_keys=True, separators=(",", ":")\n        )\n    except (TypeError, ValueError):\n        return False\n\n\ndef _timestamp'''
              if text.count(old) != 1:
                  raise SystemExit("record helper patch target not found exactly once")
              text = text.replace(old, new, 1)

          owner_marker = '''    normalized_entry = dict(entry)\n    normalized_entry["record_id"] = record_id\n'''
          if "tracking record subject_id must match the authoritative Case subject" not in text:
              replacement = owner_marker + '''    entry_subject_id = normalized_entry.get("subject_id")\n    if entry_subject_id is not None and entry_subject_id != validation.get("subject_id"):\n        raise DistributionError(\n            "case_subject_mismatch",\n            "tracking record subject_id must match the authoritative Case subject",\n            {"entry_subject_id": entry_subject_id, "case_subject_id": validation.get("subject_id")},\n        )\n'''
              if text.count(owner_marker) != 1:
                  raise SystemExit("record owner patch target not found exactly once")
              text = text.replace(owner_marker, replacement, 1)

          old_compare = '''        if existing_records[record_id] == normalized_entry:\n'''
          new_compare = '''        if _json_semantically_equal(existing_records[record_id], normalized_entry):\n'''
          if old_compare in text:
              if text.count(old_compare) != 1:
                  raise SystemExit("record comparison patch target is ambiguous")
              text = text.replace(old_compare, new_compare, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Run focused Case record regressions
        run: |
          python -m unittest tests.test_third_round_adversarial_regressions.ThirdRoundCaseRecordTests -v

      - name: Commit Case record patch
        run: |
          if git diff --quiet -- engine/distribution/case_pack.py; then
            echo "Case record patch already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/case_pack.py
          git commit -m "fix: bind case record semantics to JSON and subject authority"
          git push origin HEAD:fix/postmerge-audit-161-165
