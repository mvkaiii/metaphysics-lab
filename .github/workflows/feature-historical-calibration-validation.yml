name: Feature Historical Calibration Validation

on:
  push:
    branches:
      - feature/progressive-case-historical-calibration
      - fix/postmerge-audit-161-165
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm validation SHA
        run: |
          echo "event=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"
          git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate pinned vendor maintenance candidate
        run: |
          rm -rf /tmp/metaphysics-vendor /tmp/metaphysics-vendor-generated
          mkdir -p /tmp/metaphysics-vendor /tmp/metaphysics-vendor-generated
          python -m pip download --no-deps --no-binary :all: lunar-python==1.4.8 -d /tmp/metaphysics-vendor
          python -m pip download --no-deps --only-binary=:all: tzdata==2026.3 -d /tmp/metaphysics-vendor
          python tools/vendor_refresh.py \
            --repo-root /tmp/metaphysics-vendor-generated \
            --lunar-sdist /tmp/metaphysics-vendor/lunar_python-1.4.8.tar.gz \
            --tzdata-wheel /tmp/metaphysics-vendor/tzdata-2026.3-py2.py3-none-any.whl \
            > /tmp/metaphysics-vendor-generated/refresh-output.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/metaphysics-vendor-generated/vendor/manifest.json').read_text())
          for row in manifest['packages']:
              print(row['package_name'], row['artifact_storage_sha256'], row['vendored_tree_sha256'])
              for path in row['artifact_shards']:
                  payload = Path('/tmp/metaphysics-vendor-generated') / path
                  print(path, len(payload.read_bytes()), row['artifact_shard_sha256'][path])
          PY

      - name: Upload vendor maintenance candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-vendor-maintenance-candidate
          path: /tmp/metaphysics-vendor-generated/
          if-no-files-found: error

      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Historical selector and progressive Case focused tests
        run: |
          python -m unittest \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_historical_integrity \
            tests.test_distribution_historical_support \
            tests.test_distribution_case_pack \
            tests.test_distribution_partial_case \
            tests.test_postmerge_audit_regressions \
            tests.test_second_round_adversarial_regressions \
            tests.test_third_round_adversarial_regressions \
            tests.test_third_round_bundle_parity \
            tests.test_fourth_round_nonfinite_case_records \
            tests.test_fifth_round_legacy_record_id_compat \
            tests.test_distribution_runtime_info -v

      - name: Full repository regression
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/full-repository-regression.log

      - name: Upload full repository regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-repository-regression-log
          path: /tmp/full-repository-regression.log
          if-no-files-found: error

      - name: Python 3.9 compile check
        run: |
          python -m compileall engine tests tools

      - name: Commit regenerated distribution to feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- dist/ai && test -z "$(git status --short -- dist/ai)"; then
            echo "Distribution already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai
          git commit -m "build: regenerate portable offline AI distribution"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Verify clean validation tree
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --short)"

      - name: Upload generated distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progressive-case-ai-distribution
          path: dist/ai/
          if-no-files-found: error
