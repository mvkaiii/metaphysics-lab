name: Persist Second Round Generated Distribution

on:
  push:
    branches:
      - fix/postmerge-audit-161-165

permissions:
  contents: write

jobs:
  persist-generated-distribution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: fix/postmerge-audit-161-165
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild and persist generated distribution only
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check
          git diff --check
          if git diff --quiet -- dist/ai; then
            echo "Generated distribution already committed"
            exit 0
          fi
          test -z "$(git status --short | grep -v '^ M dist/ai/' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai
          git commit -m "build: refresh second-round distribution"
          git push origin HEAD:fix/postmerge-audit-161-165
