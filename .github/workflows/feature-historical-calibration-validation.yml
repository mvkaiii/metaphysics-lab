name: Feature Historical Calibration Validation

on:
  push:
    branches:
      - feature/progressive-case-historical-calibration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Historical selector and progressive Case tests
        run: |
          python -m unittest \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_case_pack \
            tests.test_distribution_runtime_info -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall engine tests
