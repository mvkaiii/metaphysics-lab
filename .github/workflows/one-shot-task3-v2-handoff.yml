name: One-shot Task3 v2 oracle handoff

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Acquire and verify exact HKO source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .handoff
          curl --fail --location --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --user-agent 'Metaphysics-Lab-v2-handoff/1.0' \
            'https://www.hko.gov.hk/en/gts/astron2015/Solar_Term_2015.htm' \
            --output .handoff/Solar_Term_2015.htm
          curl --fail --location --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --user-agent 'Metaphysics-Lab-v2-handoff/1.0' \
            'https://www.hko.gov.hk/en/gts/astron2016/Solar_Term_2016.htm' \
            --output .handoff/Solar_Term_2016.htm
          echo '60a45ab889ef436936571a04a49387c6f9ce8d43243fb21c64e3fcb0331c8320  .handoff/Solar_Term_2015.htm' | sha256sum -c -
          echo '84beb01553646b807a7c15d6efebdd7550af1ac6d7f06e07bfdd124dab9e443b  .handoff/Solar_Term_2016.htm' | sha256sum -c -

      - name: Copy only sealed clean-room inputs
        shell: bash
        run: |
          set -euo pipefail
          cp docs/research/bazi-decadal-independent-profile-spec.v2.md .handoff/
          cp docs/research/bazi-decadal-oracle-case-inputs.v2.json .handoff/
          cp docs/research/bazi-decadal-preoracle-seal.v2.json .handoff/
          echo '24825b1c2c850873f54e117c53c13932a8a730dc3a245a1c5e7e2599259c3305  .handoff/bazi-decadal-independent-profile-spec.v2.md' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          cases=json.loads(Path('.handoff/bazi-decadal-oracle-case-inputs.v2.json').read_text(encoding='utf-8'))
          seal=json.loads(Path('.handoff/bazi-decadal-preoracle-seal.v2.json').read_text(encoding='utf-8'))
          assert cases['bundle_sha256']=='939f8e29123acabfc16366b05622d1d3598b6aa72c4cc54cf96db3ce6e35128e'
          assert seal['seal_sha256']=='56f63fbe9561a9216e2f6e597d0f76ca4006af0ffd09a775f4da0d980e13ae0c'
          assert cases['expected_values_present'] is False
          assert len(cases['cases'])==12
          forbidden=('forward','reverse','yin_year','yang_year','expected_from_contract')
          text=json.dumps(cases,ensure_ascii=False).lower()
          assert all(token not in text for token in forbidden)
          PY

      - name: Generate handoff metadata and instructions
        shell: bash
        run: |
          set -euo pipefail
          cat > .handoff/source-bindings.json <<'JSON'
          {
            "provider": "Hong Kong Observatory",
            "role": "official_public_astronomical_reference_for_this_qualification_cycle",
            "not_claimed_as": "unique_or_universal_bazi_industry_standard",
            "timezone": "UTC+08:00",
            "published_precision_seconds": 60,
            "sources": [
              {
                "year": 2015,
                "file": "Solar_Term_2015.htm",
                "sha256": "60a45ab889ef436936571a04a49387c6f9ce8d43243fb21c64e3fcb0331c8320"
              },
              {
                "year": 2016,
                "file": "Solar_Term_2016.htm",
                "sha256": "84beb01553646b807a7c15d6efebdd7550af1ac6d7f06e07bfdd124dab9e443b"
              }
            ]
          }
          JSON
          cat > .handoff/README_FIRST.md <<'EOF'
          # Task 3 v2 independent oracle handoff

          This directory is the complete allowed Task 3 clean-room input boundary.

          ## Isolation rule

          Before reading task files, fail closed if the executor already has access to:
          - Metaphysics Lab production Bazi implementation;
          - production outputs for these 12 cases;
          - prior Task 3 dry-run or comparison results;
          - expected values for these cases;
          - qualification results.

          General system/safety instructions are not contamination.

          Do not search or clone the Metaphysics Lab repository. Do not obtain production code/output.

          ## Required input verification

          Verify:
          - approved spec file SHA256:
            24825b1c2c850873f54e117c53c13932a8a730dc3a245a1c5e7e2599259c3305
          - case bundle canonical SHA256 field:
            939f8e29123acabfc16366b05622d1d3598b6aa72c4cc54cf96db3ce6e35128e
          - pre-oracle seal canonical SHA256 field:
            56f63fbe9561a9216e2f6e597d0f76ca4006af0ffd09a775f4da0d980e13ae0c
          - HKO 2015 raw bytes SHA256:
            60a45ab889ef436936571a04a49387c6f9ce8d43243fb21c64e3fcb0331c8320
          - HKO 2016 raw bytes SHA256:
            84beb01553646b807a7c15d6efebdd7550af1ac6d7f06e07bfdd124dab9e443b
          - exactly 12 opaque case IDs bdv2-001 through bdv2-012;
          - expected_values_present=false.

          HKO is used here as an official public astronomical reference source for
          this qualification cycle. This handoff does not claim HKO is the unique
          or universal Bazi industry standard.

          ## Oracle task

          Independently implement only the approved written contract in
          bazi-decadal-independent-profile-spec.v2.md.

          Use the supplied HKO raw bytes as the only astronomical Jie input.
          Do not use lunar-python or any Metaphysics Lab production implementation.

          Freeze the exact oracle source bytes and SHA256 before producing expected
          values.

          For every sealed case, output only the planned paths:
          - /decadal_direction
          - /periods/0/pillar
          - /periods/0/start_age_years
          - /periods/0/start_datetime
          - /periods/1/end_datetime

          Each row must be either:
          - provided + expected, or
          - missing_reference + reason.

          Do not modify cases, sources, paths or tolerances. Do not run production
          comparison. Package only:
          - oracle source code;
          - oracle source SHA256;
          - oracle output bundle;
          - sealing receipt.

          Then stop.
          EOF
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.handoff')
          files=[
            'bazi-decadal-independent-profile-spec.v2.md',
            'bazi-decadal-oracle-case-inputs.v2.json',
            'bazi-decadal-preoracle-seal.v2.json',
            'Solar_Term_2015.htm',
            'Solar_Term_2016.htm',
            'source-bindings.json',
            'README_FIRST.md',
          ]
          rows={}
          for name in files:
            data=(root/name).read_bytes()
            rows[name]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          manifest={
            'schema_version':'2.0',
            'handoff_type':'bazi_decadal_independent_oracle_handoff',
            'status':'READY_FOR_INDEPENDENT_ORACLE_EXECUTOR',
            'approved_spec_sha256':'24825b1c2c850873f54e117c53c13932a8a730dc3a245a1c5e7e2599259c3305',
            'case_bundle_sha256':'939f8e29123acabfc16366b05622d1d3598b6aa72c4cc54cf96db3ce6e35128e',
            'preoracle_seal_sha256':'56f63fbe9561a9216e2f6e597d0f76ca4006af0ffd09a775f4da0d980e13ae0c',
            'expected_values_present':False,
            'production_code_included':False,
            'production_output_included':False,
            'files':rows,
          }
          (root/'handoff-manifest.v2.json').write_text(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          all_files=files+['handoff-manifest.v2.json']
          with (root/'SHA256SUMS').open('w',encoding='utf-8',newline='\n') as handle:
            for name in sorted(all_files):
              handle.write(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n')
          PY

      - name: Build deterministic inner handoff zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.handoff')
          output=Path('Bazi-Decadal-Independent-Oracle-Handoff-v2-20260930.zip')
          names=sorted(p.name for p in root.iterdir() if p.is_file())
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in names:
              data=(root/name).read_bytes()
              info=zipfile.ZipInfo(name,date_time=(2026,9,30,10,9,20))
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=0o100644 << 16
              z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          sha256sum Bazi-Decadal-Independent-Oracle-Handoff-v2-20260930.zip

      - name: Upload handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: task3-v2-independent-oracle-handoff
          path: Bazi-Decadal-Independent-Oracle-Handoff-v2-20260930.zip
          if-no-files-found: error
          retention-days: 90
