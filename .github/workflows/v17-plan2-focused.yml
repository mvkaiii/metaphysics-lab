name: v1.7 Plan 2 Focused

on:
  push:
    branches:
      - feature/v1.7-case-doctor-reconciliation

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Case Doctor focused tests
        run: |
          python -m unittest tests.test_v17_case_doctor -v
