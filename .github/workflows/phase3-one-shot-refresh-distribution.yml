name: Phase 3 One-Shot Refresh Distribution

on:
  push:
    branches:
      - feature/lin-tianji-phase3-eligibility-ranking

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild and guard generated delta
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check
          git diff --check
          git diff --name-only > /tmp/tracked.txt
          git ls-files --others --exclude-standard > /tmp/untracked.txt
          echo 'Tracked changes:'
          cat /tmp/tracked.txt
          echo 'Untracked files:'
          cat /tmp/untracked.txt
          test ! -s /tmp/untracked.txt
          test "$(cat /tmp/tracked.txt)" = "dist/ai/metaphysics_lab.py"

      - name: Commit only guarded generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/ai/metaphysics_lab.py
          test "$(git diff --cached --name-only)" = "dist/ai/metaphysics_lab.py"
          git commit -m 'build(distribution): refresh Phase 3 ranking bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
