name: v1.6 Yearly Ziwei Transformations Y1 Full Gate

on:
  push:
    branches:
      - research/v1.6-yearly-ziwei-transformations-y1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm exact validation SHA
        run: |
          echo "github_sha=${{ github.sha }}"
          git log -1 --format=%H
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Enforce engine change boundary
        shell: bash
        run: |
          BASE=eaf03116bf5e02b08b4b51caed2cb2c31f796686
          git diff --name-only "$BASE"...HEAD -- engine | sort > /tmp/engine-changes.txt
          printf '%s\n' \
            engine/distribution/forecast.py \
            engine/ziwei/yearly_cycle.py | sort > /tmp/allowed-engine-changes.txt
          echo "Engine changes:"
          cat /tmp/engine-changes.txt
          unexpected="$(comm -23 /tmp/engine-changes.txt /tmp/allowed-engine-changes.txt)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected production engine changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Y1 focused and source-oracle tests
        run: |
          python -m unittest -v \
            tests.test_distribution_forecast \
            tests.test_distribution_structural_interpretation \
            tests.test_yearly_ziwei_transformations_y1 \
            tests.test_ziwei_transformations \
            tests.test_ziwei_flying \
            tests.test_ziwei_composition

      - name: Frozen v1.6 event-family research regressions
        run: |
          python -m pytest \
            tests/test_v16_event_family_legacy_adapter.py \
            tests/test_v16_event_family_paired_oracle.py \
            tests/test_v16_event_family_paired_evaluation.py \
            tests/test_v16_event_family_hybrid_qualification.py \
            tests/test_v16_event_family_attribution.py \
            tests/test_v16_hierarchical_claim_authority.py \
            tests/test_v16_hybrid_claim_composer.py \
            tests/test_v16_hybrid_output_contract.py \
            -q

      - name: Frozen Q1 O1 T1 S1 I1 focused regressions
        run: |
          python -m unittest -v \
            tests.test_v16_claim_consumption_qualification \
            tests.test_v16_claim_consumption_oracle_seal \
            tests.test_v16_claim_consumption_private_threshold \
            tests.test_v16_claim_consumption_sampling_eligibility \
            tests.test_v16_prospective_case_intake

      - name: Lin Tianji v1.5 focused regression
        run: |
          python -m unittest \
            tests.test_bazi_structural_relations \
            tests.test_distribution_bazi_structural_interpretation \
            tests.test_distribution_ziwei_structural_interpretation \
            tests.test_distribution_structural_interpretation \
            tests.test_distribution_evidence_models \
            tests.test_distribution_evidence \
            tests.test_distribution_evidence_audit \
            tests.test_distribution_evidence_ranker \
            tests.test_distribution_evidence_runtime \
            tests.test_distribution_forecast \
            tests.test_historical_activation_relations \
            tests.test_historical_activation_selector \
            tests.test_historical_activation_capabilities \
            tests.test_distribution_historical_calibration \
            tests.test_distribution_historical_integrity \
            tests.test_distribution_historical_support \
            tests.test_distribution_historical_personalization_policy \
            tests.test_distribution_historical_personalization \
            tests.test_distribution_historical_personalization_runtime \
            tests.test_distribution_historical_personalization_bundle \
            tests.test_distribution_interpretation_contract \
            tests.test_distribution_interpretation_contract_local_window_validation \
            tests.test_distribution_interpretation_contract_runtime \
            tests.test_distribution_interpretation_contract_bundle \
            tests.test_project_ux_contract \
            tests.test_ai_contract_docs \
            tests.test_distribution_case_pack \
            tests.test_distribution_blind_sources \
            tests.test_distribution_blind_source_bundle_parity \
            tests.test_distribution_prospective \
            tests.test_distribution_prospective_evaluation \
            tests.test_distribution_prospective_evaluation_comparison \
            tests.test_distribution_partial_case \
            tests.test_postmerge_audit_regressions \
            tests.test_second_round_adversarial_regressions \
            tests.test_third_round_adversarial_regressions \
            tests.test_third_round_bundle_parity \
            tests.test_fourth_round_nonfinite_case_records \
            tests.test_fifth_round_legacy_record_id_compat \
            tests.test_distribution_runtime_info -v

      - name: Prediction validation
        run: python tools/run_lin_tianji_prediction_validation.py --json

      - name: Release surface validation
        run: python tools/run_v15_release_surface_validation.py --json

      - name: Deterministic retrospective benchmark v2
        run: |
          mkdir -p "$RUNNER_TEMP/y1"
          python tools/v16_yearly_transformations_benchmark_predictions.py > "$RUNNER_TEMP/y1/p1.json"
          python tools/v16_yearly_transformations_benchmark_predictions.py > "$RUNNER_TEMP/y1/p2.json"
          cmp "$RUNNER_TEMP/y1/p1.json" "$RUNNER_TEMP/y1/p2.json"
          python tools/v16_yearly_transformations_benchmark_adjudicate.py "$RUNNER_TEMP/y1/p1.json" > "$RUNNER_TEMP/y1/a1.json"
          python tools/v16_yearly_transformations_benchmark_adjudicate.py "$RUNNER_TEMP/y1/p1.json" > "$RUNNER_TEMP/y1/a2.json"
          cmp "$RUNNER_TEMP/y1/a1.json" "$RUNNER_TEMP/y1/a2.json"
          sha256sum "$RUNNER_TEMP/y1/p1.json" "$RUNNER_TEMP/y1/a1.json"

      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python compile check
        run: python -m compileall -q engine tests tools

      - name: Verify checkout clean before generated build
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build AI distribution from research head
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Bazi flow-day/hour qualification evidence
        run: python tools/build_bazi_flow_time_qualification.py --check

      - name: Ziwei flow-day/hour qualification evidence
        run: python tools/build_ziwei_flow_time_qualification.py --check

      - name: Ziwei month-boundary qualification evidence
        run: python tools/build_ziwei_month_boundary_qualification.py --check

      - name: Upload research-head rebuilt distribution
        uses: actions/upload-artifact@v4
        with:
          name: v1.6-yearly-transformations-y1-full-gate-${{ github.sha }}
          path: dist/ai/
          if-no-files-found: error
