name: v1.7 Artifact Cleanup Batch 3

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-artifact-cleanup-batch3.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Re-run cleanup policy tests
        run: |
          python tools/v17_artifact_cleanup_policy_test.py
          python tools/v17_artifact_cleanup_phase2_policy_test.py
          python tools/v17_artifact_cleanup_ai_policy_test.py

      - name: Preflight exact old AI distribution pool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | {id,name,size_in_bytes,expired,created_at,head_sha:.workflow_run.head_sha,run_id:.workflow_run.id}' \
            | jq -s '.' > "$tmp"

          python - "$tmp" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools')
          from v17_artifact_cleanup_ai_policy import select_ai_distribution_cleanup_artifacts

          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          selected = select_ai_distribution_cleanup_artifacts(artifacts)

          expected_count = 365
          expected_bytes = 284_897_065
          actual_count = len(selected)
          actual_bytes = sum(item['size_in_bytes'] for item in selected)
          if actual_count != expected_count or actual_bytes != expected_bytes:
              raise SystemExit(
                  f'cleanup pool drift: expected count={expected_count} bytes={expected_bytes}; '
                  f'actual count={actual_count} bytes={actual_bytes}'
              )

          ids = [item['id'] for item in sorted(selected, key=lambda item: item['id'])]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate artifact ids in cleanup pool')

          Path('/tmp/v17-artifact-cleanup-ai-ids.txt').write_text(
              ''.join(f'{artifact_id}\n' for artifact_id in ids), encoding='utf-8'
          )
          print(json.dumps({'count': actual_count, 'bytes': actual_bytes, 'first_id': ids[0], 'last_id': ids[-1]}, sort_keys=True))
          PY

      - name: Delete and verify exact old AI distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while read -r id; do
            test -n "$id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1; then
              echo "Artifact still exists after DELETE: $id" >&2
              exit 1
            fi
            deleted=$((deleted + 1))
            if (( deleted % 25 == 0 )); then
              echo "Deleted and verified $deleted artifacts..."
            fi
          done < /tmp/v17-artifact-cleanup-ai-ids.txt
          test "$deleted" -eq 365
          echo "Deleted and verified $deleted old AI distribution artifacts (284897065 bytes)."
