name: Phase 2B Task 0

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: write

jobs:
  task0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ziwei-fine-cycle-stem-resolver-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Write RED reconciliation test
        run: |
          cat > tests/test_rule_source_reconciliation.py <<'PY'
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          FILES = (
              "core/命理分析作業規範.md",
              "core/命理推導計算規則.md",
              "core/核心提示詞.md",
              "core/紫微流月推導規則.md",
              "core/紫微流日推導規則.md",
              "core/紫微流時推導規則.md",
          )

          class RuleSourceReconciliationTests(unittest.TestCase):
              def test_current_runtime_capabilities_are_not_documented_as_missing(self):
                  combined = "\n".join((ROOT / p).read_text(encoding="utf-8") for p in FILES)
                  self.assertNotIn("Project 紫微流月定位層", combined)
                  self.assertNotIn("Project 紫微流日定位層", combined)
                  self.assertNotIn("Project 紫微流時定位層", combined)
                  self.assertNotIn("Project Bazi Calendar Engine", combined)
                  self.assertNotIn("- Calendar / Input Resolver", combined)
                  self.assertNotIn("紫微流時：`planned / on_demand`", combined)
                  self.assertIn("Calendar Resolver v1", combined)
                  self.assertIn("Ziwei Transformation Core", combined)
                  self.assertIn("Ziwei Flying Core", combined)

              def test_fine_cycle_transformations_are_not_prematurely_marked_implemented(self):
                  text = (ROOT / "core/命理推導計算規則.md").read_text(encoding="utf-8")
                  self.assertIn("流月／流日／流時細部四化", text)
                  self.assertIn("planned / on_demand", text)

          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Verify RED
        run: |
          set +e
          python -m unittest tests.test_rule_source_reconciliation -v > task0-red.txt 2>&1
          rc=$?
          cat task0-red.txt
          if [ "$rc" -eq 0 ]; then
            echo "Task 0 test unexpectedly GREEN before reconciliation"
            exit 1
          fi
          grep -Eq "Project 紫微流月定位層|Project Bazi Calendar Engine|Calendar / Input Resolver|紫微流時：.*planned" task0-red.txt
          echo TASK0_EXPECTED_RED
      - name: Reconcile formal rule sources
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('core/命理分析作業規範.md'),
              Path('core/命理推導計算規則.md'),
              Path('core/核心提示詞.md'),
              Path('core/紫微流月推導規則.md'),
              Path('core/紫微流日推導規則.md'),
              Path('core/紫微流時推導規則.md'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('Project 紫微流月定位層', '紫微流月定位層')
              text = text.replace('Project 紫微流日定位層', '紫微流日定位層')
              text = text.replace('Project 紫微流時定位層', '紫微流時定位層')
              text = text.replace('Project Bazi Calendar Engine', 'Metaphysics Lab 八字時間推導引擎')
              text = text.replace('- Calendar / Input Resolver\n', '')
              text = text.replace('- Calendar Resolver\n', '')
              text = text.replace('紫微流時：`planned / on_demand`', '紫微流時定位：`implemented / experimental / on_demand`')
              text = text.replace('Calendar Resolver、timezone、國曆轉農曆與 23:00 日界 policy 尚未實作。',
                                  'Calendar Resolver v1 已提供 neutral civil/calendar context；紫微 23:00 日界 policy 仍由下游 capability 自行版本化，不由定位 core 偷套。')
              text = text.replace('未來 Calendar / Input Resolver 或其他可信上游解析', 'Calendar Resolver v1 或其他可信上游解析')
              path.write_text(text, encoding='utf-8')

          # Remove stale "紫微流時" from legacy not-implemented lists where it is now implemented.
          for name in ('core/紫微流月推導規則.md', 'core/紫微流日推導規則.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('- 紫微流時\n', '')
              path.write_text(text, encoding='utf-8')

          # Append one canonical runtime-state block to the central derivation rules.
          path = Path('core/命理推導計算規則.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Phase 2B 前置現況基線（v1.2.0）'
          if marker not in text:
              text += '''\n\n---\n\n## Phase 2B 前置現況基線（v1.2.0）\n\n目前正式 runtime 狀態：\n\n- Calendar Resolver v1：implemented neutral infrastructure。\n- 紫微流月定位：`implemented / stable / default`。\n- 紫微流日定位：`implemented / experimental / on_demand`。\n- 紫微流時定位：`implemented / experimental / on_demand`。\n- Ziwei Transformation Core：`implemented / stable / on_demand`。\n- Ziwei Flying Core：`implemented / stable / on_demand`。\n- 流月／流日／流時細部四化：`planned / on_demand`。\n- 流月／流日／流時飛化：`planned / on_demand`。\n- 流曜：`planned / on_demand`。\n\n此段只同步既有 v1.2.0 runtime 事實，不代表 Phase 2B capability 已啟用。\n'''
              path.write_text(text, encoding='utf-8')

          # Ensure hour rules distinguish upstream resolver responsibility from this core.
          path = Path('core/紫微流時推導規則.md')
          text = path.read_text(encoding='utf-8')
          note = 'Calendar Resolver v1 已實作，負責 neutral civil/calendar context；本流時定位 core 不負責紫微 23:00 日界 policy。'
          if note not in text:
              text += '\n\n## 十、Calendar Resolver 現況\n\n' + note + '\n'
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify GREEN and full regression
        run: |
          python -m unittest tests.test_rule_source_reconciliation -v
          python -m unittest discover -v
          echo RULE_SOURCE_RECONCILIATION_PASS
      - name: Commit Task 0 to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core tests/test_rule_source_reconciliation.py
          git commit -m "docs: reconcile Ziwei runtime rule sources"
          git push origin HEAD:feature/ziwei-fine-cycle-stem-resolver-v1
