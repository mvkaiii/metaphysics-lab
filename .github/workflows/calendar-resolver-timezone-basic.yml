name: Calendar Resolver timezone basic

on:
  pull_request:
    branches:
      - feature/calendar-resolver-v1

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_calendar_models tests.test_calendar_timezone -v
