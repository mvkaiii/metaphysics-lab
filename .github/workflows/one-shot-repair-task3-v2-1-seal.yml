name: One-shot repair Task3 v2.1 seal digest

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebuild seal with repository canonical algorithm
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.seal_bazi_decadal_reference_inputs import build_preoracle_seal

          path=Path('docs/research/bazi-decadal-preoracle-seal.v2.1.json')
          draft=json.loads(path.read_text(encoding='utf-8'))
          draft['profile']['specification_sha256']='b47de7809cadb82159c272b2d2d7fb3bbc7ffc99d9e8ed6c1fa60a1bf3c900e4'
          sealed=build_preoracle_seal(draft)
          path.write_text(
              json.dumps(sealed,ensure_ascii=False,sort_keys=True,indent=2)+'\n',
              encoding='utf-8'
          )
          print(sealed['seal_sha256'])
          PY

      - name: Commit canonical seal only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/bazi-decadal-preoracle-seal.v2.1.json
          git commit -m "research: canonicalize Task3 v2.1 seal digest"
          git push origin "HEAD:${{ github.head_ref }}"
