name: Ziwei Phase 2A baseline validation

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full baseline regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee baseline-unittest.txt
      - name: Record baseline scope
        shell: bash
        run: |
          python - <<'PY' | tee baseline-scope.txt
          import subprocess
          files = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
          ).splitlines()
          expected = ['.github/workflows/ziwei-phase2a-baseline.yml']
          assert files == expected, files
          print('BASELINE_SCOPE_PASS')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-phase2a-baseline-evidence
          path: |
            baseline-unittest.txt
            baseline-scope.txt
