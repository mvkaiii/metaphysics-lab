name: v1.7 Artifact Inventory

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-artifact-inventory.yml

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Inventory current Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_candidate='7c9c4a390a05cc78460bfcb615db76bc4c1791c7'
          v160_sha='c325d754112df71c6747e17262d2e781d2864441'

          tmp="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | {id,name,size_in_bytes,expired,created_at,updated_at,head_sha:.workflow_run.head_sha,run_id:.workflow_run.id}' \
            | jq -s '.' > "$tmp"

          echo '=== TOTAL ==='
          jq '{count:length, bytes:(map(.size_in_bytes)|add // 0)}' "$tmp"

          echo '=== PROTECTED SHA TOTALS ==='
          jq --arg current "$current_candidate" --arg v160 "$v160_sha" '
            [ .[] | select(.head_sha == $current or .head_sha == $v160) ]
            | group_by(.head_sha)
            | map({head_sha:.[0].head_sha,count:length,bytes:(map(.size_in_bytes)|add // 0)})' "$tmp"

          echo '=== GROUPED BY HEAD SHA (largest first) ==='
          jq '
            group_by(.head_sha)
            | map({head_sha:.[0].head_sha,count:length,bytes:(map(.size_in_bytes)|add // 0),newest:(map(.created_at)|max)})
            | sort_by(.bytes) | reverse | .[:80]' "$tmp"

          echo '=== TOP 120 ARTIFACTS BY SIZE ==='
          jq 'sort_by(.size_in_bytes) | reverse | .[:120]' "$tmp"

          echo '=== CANDIDATE CLEANUP POOL (excluding current candidate and v1.6.0 tag SHA) ==='
          jq --arg current "$current_candidate" --arg v160 "$v160_sha" '
            [ .[]
              | select(.head_sha != $current and .head_sha != $v160)
              | select(.name | test("^(lin-tianji-v1\\.[567].*ai-distribution-|.*(validation|qualification|snapshot|evidence|sandbox|transport).*)"; "i"))
            ]
            | {count:length,bytes:(map(.size_in_bytes)|add // 0),items:(sort_by(.size_in_bytes)|reverse|.[:160])}' "$tmp"
