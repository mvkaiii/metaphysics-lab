name: v1.7 Artifact Inventory (Read-only)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Print read-only artifact inventory
        run: python tools/v17_artifact_inventory.py
