name: v1.7 Artifact Cleanup Batch 2

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-artifact-cleanup-batch2.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Re-run cleanup policy tests
        run: |
          python tools/v17_artifact_cleanup_policy_test.py
          python tools/v17_artifact_cleanup_phase2_policy_test.py

      - name: Preflight exact Phase 2C0 validation allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools')
          from v17_artifact_cleanup_phase2_policy import ALLOWLIST, select_phase2_cleanup_artifacts

          artifacts = []
          for artifact_id in ALLOWLIST:
              raw = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact_id}'
              ], text=True))
              run_id = raw['workflow_run']['id']
              run = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
              ], text=True))
              artifacts.append({
                  'id': raw['id'],
                  'name': raw['name'],
                  'expired': raw['expired'],
                  'head_sha': raw['workflow_run']['head_sha'],
                  'size_in_bytes': raw['size_in_bytes'],
                  'run_name': run['name'],
                  'run_path': run['path'],
                  'head_branch': run['head_branch'],
              })

          selected = select_phase2_cleanup_artifacts(artifacts)
          expected_ids = set(ALLOWLIST)
          actual_ids = {item['id'] for item in selected}
          if actual_ids != expected_ids:
              raise SystemExit(f'allowlist preflight mismatch: expected={sorted(expected_ids)} actual={sorted(actual_ids)}')

          total = sum(item['size_in_bytes'] for item in selected)
          expected_total = 502_963_663
          if total != expected_total:
              raise SystemExit(f'byte total mismatch: expected={expected_total} actual={total}')

          Path('/tmp/v17-artifact-cleanup-phase2-ids.txt').write_text(
              ''.join(f'{item["id"]}\n' for item in sorted(selected, key=lambda item: item['id'])),
              encoding='utf-8',
          )
          print(json.dumps({'count': len(selected), 'bytes': total, 'ids': sorted(actual_ids)}, sort_keys=True))
          PY

      - name: Delete and verify exact Phase 2C0 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while read -r id; do
            test -n "$id"
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1; then
              echo "Artifact still exists after DELETE: $id" >&2
              exit 1
            fi
            deleted=$((deleted + 1))
          done < /tmp/v17-artifact-cleanup-phase2-ids.txt
          test "$deleted" -eq 7
          echo "Deleted and verified $deleted Phase 2C0 artifacts (502963663 bytes)."
