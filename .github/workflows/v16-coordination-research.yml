name: v1.6 Coordination Semantics Research

on:
  push:
    branches:
      - research/v1.6-coordination-semantics-c1

permissions:
  contents: read

jobs:
  coordination-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm research SHA
        run: git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Phase2C current release identity prerequisite
        run: python -m pytest -q tests/test_ziwei_phase2c_rule_source.py

      - name: Coordination focused gates
        run: |
          python -m pytest -q \
            tests/test_v16_coordination_policy_v2.py \
            tests/test_v16_coordination_wrapper_integration.py

      - name: Relevant interpretation regression
        run: |
          python -m pytest -q \
            tests/test_distribution_claim_evidence.py \
            tests/test_distribution_evidence_ranker.py \
            tests/test_distribution_interpretation_contract_v1_freeze.py \
            tests/test_distribution_interpretation_contract_v2.py

      - name: Rebuild AI distribution and verify parity
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: python -m compileall engine tests tools

      - name: Verify clean tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
