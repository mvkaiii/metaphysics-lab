name: v1.7 Local Staging Transport

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - .github/workflows/v17-local-staging-transport.yml

permissions:
  contents: write

jobs:
  persist-xdelta-transport:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: ci/v17-local-staging-7c9c4-transport
          fetch-depth: 0

      - name: Confirm helper is semantically exact candidate
        run: |
          set -euo pipefail
          git diff --quiet 7c9c4a390a05cc78460bfcb615db76bc4c1791c7 -- . \
            ':(exclude).github/workflows/v17-local-staging-transport.yml' \
            ':(exclude)transport/**'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install xdelta3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3
          xdelta3 -V

      - name: Build, verify and create binary delta transport
        run: |
          set -euo pipefail
          rm -rf transport
          mkdir -p "$RUNNER_TEMP/v17-kit" transport/v17-xdelta
          python tools/build_release_package.py --verify --output "$RUNNER_TEMP/v17-kit/Metaphysics-Lab-v1.7.0-User-Package.zip"
          cp docs/release/v1.7.0-isolated-sandbox-script.md "$RUNNER_TEMP/v17-kit/v1.7.0-isolated-sandbox-script.md"
          cp docs/release/v1.7.0-isolated-sandbox-base.json "$RUNNER_TEMP/v17-kit/v1.7.0-isolated-sandbox-base.json"
          git show v1.5.0:dist/ai/metaphysics_lab.py > "$RUNNER_TEMP/metaphysics_lab_v1.5.0.py"
          test "$(git hash-object "$RUNNER_TEMP/metaphysics_lab_v1.5.0.py")" = "21809e4adfa90c9fd3ed37220623deef1696fd0d"
          xdelta3 -e -9 -s "$RUNNER_TEMP/metaphysics_lab_v1.5.0.py" dist/ai/metaphysics_lab.py "$RUNNER_TEMP/runtime.xdelta"
          xdelta3 -d -s "$RUNNER_TEMP/metaphysics_lab_v1.5.0.py" "$RUNNER_TEMP/runtime.xdelta" "$RUNNER_TEMP/runtime.roundtrip.py"
          cmp dist/ai/metaphysics_lab.py "$RUNNER_TEMP/runtime.roundtrip.py"
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import lzma
          import os
          import struct
          import textwrap
          import zipfile

          candidate = '7c9c4a390a05cc78460bfcb615db76bc4c1791c7'
          expected_package = '57933797496f4b943e0cff20997a45a35dce760521d8add4254fd5f8fb952741'
          expected_kit = 'bba33cf6cb88669988570f0a6c2250808d0339655dce283c3dd2ea102644e9b1'
          expected_base_git_blob = '21809e4adfa90c9fd3ed37220623deef1696fd0d'
          root = Path(os.environ['RUNNER_TEMP']) / 'v17-kit'
          transport = Path('transport/v17-xdelta')
          chunk_size = 24000
          line_width = 120

          def sha_bytes(data):
              return hashlib.sha256(data).hexdigest()
          def sha(path):
              return sha_bytes(path.read_bytes())

          package = root / 'Metaphysics-Lab-v1.7.0-User-Package.zip'
          actual_package = sha(package)
          if actual_package != expected_package:
              raise SystemExit(f'user package SHA mismatch: {actual_package}')

          script = root / 'v1.7.0-isolated-sandbox-script.md'
          base_json = root / 'v1.7.0-isolated-sandbox-base.json'
          readme = root / 'README-START-HERE.md'
          readme.write_text(
              '# Metaphysics Lab v1.7.0 Isolated Sandbox Kit v3\n\n'
              f'Tested release candidate: `{candidate}`\n\n'
              '這個 kit 只用於 v1.7.0 最終 isolated sandbox qualification。請建立一個全新的 ChatGPT Project，不要沿用之前的 sandbox Project 或對話。\n\n'
              '1. 解壓 `Metaphysics-Lab-v1.7.0-User-Package.zip`。\n'
              '2. 將 `metaphysics_lab.py`、`metaphysics_core.md` 上傳到新 Project 的 Sources。\n'
              '3. 將 `project_instructions.txt` 的完整內容貼到 Project Instructions；不要把它當第四個 Source。\n'
              '4. 將 `v1.7.0-isolated-sandbox-base.json` 上傳到同一個 Project 的 Sources。\n'
              '5. 執行前記下介面上「實際顯示」的 model UI label，大小寫與文字必須逐字保存，不要自行正規化。\n'
              '6. 嚴格依 `v1.7.0-isolated-sandbox-script.md` 的 conversation grouping、setup message 與 prompt 執行 S01-S12。\n'
              '7. 不重試、不補答、不改寫失敗回覆；所有 setup prompt、scenario prompt 與 assistant response 都逐字保存。\n\n'
              'Release gate 只有在 S01-S12 與全部 critical rubrics 都 PASS，且 evidence validator 回傳 `release_allowed: true` 時才可關閉。\n',
              encoding='utf-8',
          )
          checks = {
              'Metaphysics-Lab-v1.7.0-User-Package.zip': sha(package),
              'v1.7.0-isolated-sandbox-base.json': sha(base_json),
              'v1.7.0-isolated-sandbox-script.md': sha(script),
              'README-START-HERE.md': sha(readme),
          }
          (root / 'CHECKSUMS.txt').write_text(''.join(f'{digest}  {name}\n' for name, digest in checks.items()), encoding='utf-8')
          members = ['README-START-HERE.md','CHECKSUMS.txt','Metaphysics-Lab-v1.7.0-User-Package.zip','v1.7.0-isolated-sandbox-base.json','v1.7.0-isolated-sandbox-script.md']
          kit = Path(os.environ['RUNNER_TEMP']) / 'Metaphysics-Lab-v1.7.0-Isolated-Sandbox-Kit-v3.zip'
          with zipfile.ZipFile(kit, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in members:
                  data = (root / name).read_bytes()
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          actual_kit = sha(kit)
          if actual_kit != expected_kit:
              raise SystemExit(f'sandbox kit SHA mismatch: {actual_kit}')

          base_runtime = (Path(os.environ['RUNNER_TEMP']) / 'metaphysics_lab_v1.5.0.py').read_bytes()
          target_runtime = Path('dist/ai/metaphysics_lab.py').read_bytes()
          records = {
              'runtime.xdelta': (Path(os.environ['RUNNER_TEMP']) / 'runtime.xdelta').read_bytes(),
              'dist/ai/metaphysics_core.md': Path('dist/ai/metaphysics_core.md').read_bytes(),
              'dist/ai/project_instructions.txt': Path('dist/ai/project_instructions.txt').read_bytes(),
              'docs/release/v1.7.0-isolated-sandbox-script.md': Path('docs/release/v1.7.0-isolated-sandbox-script.md').read_bytes(),
              'docs/release/v1.7.0-isolated-sandbox-base.json': Path('docs/release/v1.7.0-isolated-sandbox-base.json').read_bytes(),
          }
          raw = io.BytesIO()
          raw.write(b'V17XDELTA1\0')
          raw.write(struct.pack('>I', len(records)))
          for name in sorted(records):
              name_bytes = name.encode('utf-8')
              data = records[name]
              raw.write(struct.pack('>I', len(name_bytes)))
              raw.write(name_bytes)
              raw.write(struct.pack('>Q', len(data)))
              raw.write(data)
          payload = lzma.compress(raw.getvalue(), preset=9 | lzma.PRESET_EXTREME)
          encoded = base64.b64encode(payload).decode('ascii')
          parts = [encoded[i:i + chunk_size] for i in range(0, len(encoded), chunk_size)]
          for index, chunk in enumerate(parts):
              (transport / f'part-{index:02d}.b64').write_text('\n'.join(textwrap.wrap(chunk, line_width)) + '\n', encoding='ascii')
          meta = {
              'candidate': candidate,
              'base_release': 'v1.5.0',
              'base_runtime_git_blob_sha1': expected_base_git_blob,
              'base_runtime_sha256': sha_bytes(base_runtime),
              'base_runtime_size': len(base_runtime),
              'target_runtime_sha256': sha_bytes(target_runtime),
              'target_runtime_size': len(target_runtime),
              'xdelta_size': len(records['runtime.xdelta']),
              'package_sha256': actual_package,
              'kit_sha256': actual_kit,
              'transport_sha256': sha_bytes(payload),
              'transport_size': len(payload),
              'b64_len': len(encoded),
              'chunk_size': chunk_size,
              'line_width': line_width,
              'total_parts': len(parts),
              'records': {name: {'size': len(data), 'sha256': sha_bytes(data)} for name, data in sorted(records.items())},
          }
          (transport / 'meta.json').write_text(json.dumps(meta, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False, sort_keys=True))
          PY

      - name: Commit transport-only files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A transport
          git diff --cached --check
          git commit -m 'ci: persist compact xdelta v1.7 transport'
          git push origin HEAD:ci/v17-local-staging-7c9c4-transport
