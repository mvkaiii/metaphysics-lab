name: Temporary Q2 generated distribution sync

on:
  push:
    branches:
      - impl/v1.6-event-family-hybrid-qualification-q2

permissions:
  contents: write

jobs:
  sync-generated-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild official AI distribution
        run: python tools/build_ai_distribution.py

      - name: Enforce generated-only scope
        run: |
          python - <<'PY'
          import subprocess
          import sys

          rows = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          paths = []
          for row in rows:
              path = row[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.append(path)

          expected = ["dist/ai/metaphysics_lab.py"]
          if not paths:
              print("No generated drift remains; nothing to commit.")
              raise SystemExit(0)
          if paths != expected:
              print("Refusing sync: changed paths were:", paths)
              print("Expected exactly:", expected)
              raise SystemExit(1)
          print("Scope guard passed:", paths)
          PY

      - name: Commit generated-only sync if needed
        run: |
          if git diff --quiet -- dist/ai/metaphysics_lab.py; then
            echo "No generated drift remains; nothing to commit."
            exit 0
          fi
          git add dist/ai/metaphysics_lab.py
          test "$(git diff --cached --name-only)" = "dist/ai/metaphysics_lab.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync generated AI distribution for Q2"
          git push origin HEAD:impl/v1.6-event-family-hybrid-qualification-q2
