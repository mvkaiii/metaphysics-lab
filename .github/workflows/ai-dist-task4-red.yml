name: ai-dist-task4-red

on:
  pull_request:
    branches: [main]

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Task 4 RED
        run: python -m unittest tests.test_distribution_case_pack -v
