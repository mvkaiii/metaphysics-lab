name: 林氏天機 v1.6 Validation

on:
  push:
    branches:
      - 'release/v1.6.0-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm validation SHA
        run: |
          echo "event=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"
          git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Implement verified Task 3 wiring
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return False
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one Task 3 anchor in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          changed = False
          changed |= replace_once(
              'engine/distribution/constants.py',
              '    "lock_prospective_forecast",\n    "interpret_structural_evidence",',
              '    "lock_prospective_forecast",\n    "classify_validation_context",\n    "build_validation_summary",\n    "interpret_structural_evidence",',
          )

          capability_anchor = '    "distribution.structural_interpretation": {'
          capability_entry = '''    "distribution.prospective_validation": {
              "id": "distribution.prospective_validation",
              "implementation": "implemented",
              "maturity": "experimental",
              "routing": "on_demand",
              "rule_version": "prospective-validation-v2-exp",
              "module": "engine.distribution.prospective_validation",
              "dependencies": ("distribution.prospective_forecast_governance",),
              "output_classification": "Validation governance metadata",
              "ranking_authority": False,
          },
          '''
          cap_path = Path('engine/distribution/capabilities.py')
          cap_text = cap_path.read_text(encoding='utf-8')
          if '"distribution.prospective_validation"' not in cap_text:
              if cap_text.count(capability_anchor) != 1:
                  raise SystemExit('expected exactly one capability insertion anchor')
              cap_path.write_text(cap_text.replace(capability_anchor, capability_entry + capability_anchor, 1), encoding='utf-8')
              changed = True

          runtime_old = '''        if action in ("resolve_query_anchor", "lock_prospective_forecast"):
              from .prospective import lock_prospective_forecast, resolve_query_anchor
              handler = {
                  "resolve_query_anchor": resolve_query_anchor,
                  "lock_prospective_forecast": lock_prospective_forecast,
              }[action]
              return _ok(action, handler(request))
          if action == "interpret_structural_evidence":'''
          runtime_new = '''        if action in ("resolve_query_anchor", "lock_prospective_forecast"):
              from .prospective import lock_prospective_forecast, resolve_query_anchor
              handler = {
                  "resolve_query_anchor": resolve_query_anchor,
                  "lock_prospective_forecast": lock_prospective_forecast,
              }[action]
              return _ok(action, handler(request))
          if action in ("classify_validation_context", "build_validation_summary"):
              from .prospective_validation import build_validation_summary, classify_validation_context
              handler = {
                  "classify_validation_context": classify_validation_context,
                  "build_validation_summary": build_validation_summary,
              }[action]
              return _ok(action, handler(request))
          if action == "interpret_structural_evidence":'''
          changed |= replace_once('engine/distribution/runtime.py', runtime_old, runtime_new)

          if not changed:
              print('Task 3 wiring already present')
          PY
          python tools/build_ai_distribution.py
          python -m unittest \
            tests.test_v17_prospective_validation_runtime \
            tests.test_v17_capability_manifest \
            tests.test_distribution_runtime_info \
            tests.test_v17_capability_distribution_parity -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/constants.py engine/distribution/runtime.py engine/distribution/capabilities.py dist/ai/metaphysics_lab.py
          if git diff --cached --quiet; then
            echo "No Task 3 source changes to commit"
          else
            git commit -m "feat: expose prospective validation v2 runtime actions"
            git push origin HEAD:"${HEAD_REF}"
          fi

      - name: Y1 yearly Ziwei qualification
        run: |
          python -m unittest tests.test_yearly_ziwei_transformations_y1 -v
          python -m unittest tests.test_distribution_forecast tests.test_distribution_structural_interpretation -v

      - name: Preserve v1 default routing
        run: python -m unittest tests.test_v16_default_profiles -v

      - name: Bazi flow-day/hour qualification evidence
        run: python tools/build_bazi_flow_time_qualification.py --check

      - name: Ziwei flow-day/hour qualification evidence
        run: python tools/build_ziwei_flow_time_qualification.py --check

      - name: Ziwei month-boundary qualification evidence
        run: python tools/build_ziwei_month_boundary_qualification.py --check

      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Run 林氏天機 prediction validation
        run: python tools/run_lin_tianji_prediction_validation.py --json

      - name: Run v1.6 release-surface validation
        run: python tools/run_v16_release_surface_validation.py --json

      - name: Verify deterministic v1.6.0 three-file user package
        run: python tools/build_release_package.py --verify --output "$RUNNER_TEMP/Metaphysics-Lab-v1.6.0-User-Package.zip"

      - name: Release contract
        run: python -m unittest tests.test_v16_sandbox_contract_v2 tests.test_v16_release_contract tests.test_v15_release_contract -v

      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall -q engine tools tests
          python -c "compile(open('dist/ai/metaphysics_lab.py', encoding='utf-8').read(), 'dist/ai/metaphysics_lab.py', 'exec')"

      - name: Private outcome contamination scan
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden_names = {
              '驗證事件紀錄.md',
              'Kai_CDBF04_05_驗證事件紀錄.md',
              'adjudication-1.json',
          }
          roots = [Path('dist/ai'), Path('docs/release')]
          bad = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.name in forbidden_names:
                      bad.append(str(path))
          if bad:
              raise SystemExit('forbidden private/outcome release artifacts: ' + ', '.join(sorted(bad)))
          print('private/outcome release-artifact scan: PASS')
          PY

      - name: Verify clean tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload generated distribution
        uses: actions/upload-artifact@v4
        with:
          name: lin-tianji-v1.6-ai-distribution-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: dist/ai/
          if-no-files-found: error
