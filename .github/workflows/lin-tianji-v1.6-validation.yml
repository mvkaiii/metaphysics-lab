name: 林氏天機 v1.6 Validation

on:
  push:
    branches:
      - 'release/v1.6.0-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Confirm validation SHA
        run: |
          echo "event=${{ github.event_name }}"
          echo "github_sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"
          git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Implement verified Task 5 workflow contract
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/AI工作流程.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 5.7 Prospective Validation 2.0 context 分流'
          anchor = '9. 當次 known reality／現實背景可以讓策略更具體，但只作用在策略層，不回寫 canonical contract，不得改變 ranking、不得提高 specificity、不得把 known reality 視為 prospective hit。'
          if marker not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('expected exactly one Task 5 workflow anchor')
              lines = [
                  '',
                  '## 5.7 Prospective Validation 2.0 context 分流',
                  '',
                  '對需要正式追蹤、日後可驗證的預測，在揭露結果、讀取驗證事件或進入事件校準之前，必須先呼叫 `classify_validation_context` 固定驗證情境；分類結果與原本的 prospective forecast lock 並存，不取代 v1.5 lock。',
                  '',
                  '- `clean_prospective`：只有提問與鎖定時結果仍未知、且預測窗真正位於 knowledge cutoff 之後的前向預測。只有此類在完成 adjudication 後可以進入 **clean prospective denominator**。',
                  '- `conditional_prospective`：未來仍有不確定性，但在 lock 時已有部分或完整已知條件／安排。必須與乾淨前瞻結果分開統計，不得包裝成純盲判命中。',
                  '- `hidden_existing_reality`：被問的事實在 knowledge cutoff 前已經存在，只是提問時尚未知。這是辨識既存現實，不是未來預測，不得進 clean prospective denominator。',
                  '- `retrospective_calibration`：預測窗與事實都屬歷史回顧／校準用途，只能作校準證據，不得進 clean prospective denominator。',
                  '',
                  '已知安排、既存現實或歷史事件不得被靜默改標為 `clean_prospective`；若時間窗跨越 knowledge cutoff，先拆分或 fail closed，不得用單一紀錄混算。',
                  '',
                  '結果彙總使用 `build_validation_summary`。只有已完成驗證且 context 為 `clean_prospective` 的紀錄可形成乾淨分母；`pending` 與 `cannot_recall` 不得算入可評分分母。現階段不得從小樣本宣稱模型優於基準，應保留 `superiority_claim_status = "not_established"` 與 `accuracy_rate = None`，直到另有經核准的統計規則。',
                  '',
              ]
              text = text.replace(anchor, anchor + '\n' + '\n'.join(lines), 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Task 5 workflow contract already present')
          PY
          python tools/build_ai_distribution.py
          python -m unittest \
            tests.test_v17_prospective_validation_distribution \
            tests.test_ai_distribution_build \
            tests.test_v17_prospective_validation_runtime -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/AI工作流程.md dist/ai/
          if git diff --cached --quiet; then
            echo "No Task 5 source changes to commit"
          else
            git commit -m "feat: document prospective validation v2 workflow"
            git push origin HEAD:"${HEAD_REF}"
          fi

      - name: Y1 yearly Ziwei qualification
        run: |
          python -m unittest tests.test_yearly_ziwei_transformations_y1 -v
          python -m unittest tests.test_distribution_forecast tests.test_distribution_structural_interpretation -v

      - name: Preserve v1 default routing
        run: python -m unittest tests.test_v16_default_profiles -v

      - name: Bazi flow-day/hour qualification evidence
        run: python tools/build_bazi_flow_time_qualification.py --check

      - name: Ziwei flow-day/hour qualification evidence
        run: python tools/build_ziwei_flow_time_qualification.py --check

      - name: Ziwei month-boundary qualification evidence
        run: python tools/build_ziwei_month_boundary_qualification.py --check

      - name: Rebuild AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Run 林氏天機 prediction validation
        run: python tools/run_lin_tianji_prediction_validation.py --json

      - name: Run v1.6 release-surface validation
        run: python tools/run_v16_release_surface_validation.py --json

      - name: Verify deterministic v1.6.0 three-file user package
        run: python tools/build_release_package.py --verify --output "$RUNNER_TEMP/Metaphysics-Lab-v1.6.0-User-Package.zip"

      - name: Release contract
        run: python -m unittest tests.test_v16_sandbox_contract_v2 tests.test_v16_release_contract tests.test_v15_release_contract -v

      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python 3.9 compile check
        run: |
          python -m compileall -q engine tools tests
          python -c "compile(open('dist/ai/metaphysics_lab.py', encoding='utf-8').read(), 'dist/ai/metaphysics_lab.py', 'exec')"

      - name: Private outcome contamination scan
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden_names = {
              '驗證事件紀錄.md',
              'Kai_CDBF04_05_驗證事件紀錄.md',
              'adjudication-1.json',
          }
          roots = [Path('dist/ai'), Path('docs/release')]
          bad = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.name in forbidden_names:
                      bad.append(str(path))
          if bad:
              raise SystemExit('forbidden private/outcome release artifacts: ' + ', '.join(sorted(bad)))
          print('private/outcome release-artifact scan: PASS')
          PY

      - name: Verify clean tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload generated distribution
        uses: actions/upload-artifact@v4
        with:
          name: lin-tianji-v1.6-ai-distribution-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: dist/ai/
          if-no-files-found: error
