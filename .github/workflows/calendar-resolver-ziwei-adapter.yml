name: Calendar Resolver Ziwei adapter

on:
  pull_request:
    branches:
      - feature/calendar-resolver-v1

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run Ziwei hour RED check
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_project_ziwei_hour -v > ziwei-adapter-output.txt 2>&1
          status=$?
          cat ziwei-adapter-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-ziwei-adapter-output
          path: ziwei-adapter-output.txt
      - name: Preserve test exit status
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
