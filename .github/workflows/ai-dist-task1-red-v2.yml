name: ai-dist-task1-red-v2
on:
  pull_request:
    branches: [main]
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run Task 1 RED
        run: python -m unittest tests.test_distribution_runtime_info -v
