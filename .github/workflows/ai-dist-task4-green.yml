name: ai-dist-task4-green

on:
  pull_request:
    branches: [main]

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Task 4 Case Pack tests
        run: python -m unittest tests.test_distribution_case_pack -v
      - name: Run natal exporter regressions
        run: python -m unittest tests.test_natal_export -v
      - name: Run distribution regressions
        run: >-
          python -m unittest
          tests.test_distribution_runtime_info
          tests.test_distribution_natal
          tests.test_distribution_forecast
          -v
