name: One-shot Phase 2.2 Distribution Sync

on:
  push:
    branches:
      - feature/lin-tianji-phase2-evidence-feature-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'chore(ci): one-shot Phase 2.2 distribution sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild deterministic distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Verify generated-only diff
        shell: bash
        run: |
          git status --short
          git diff --name-only
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          printf 'changed_path=%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "dist/ai/metaphysics_lab.py"

      - name: Commit generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/metaphysics_lab.py
          git commit -m "build: sync Phase 2.2 generated distribution"
          git push origin HEAD:feature/lin-tianji-phase2-evidence-feature-foundation
