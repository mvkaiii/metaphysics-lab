name: Phase 2C Task 9 RED

on:
  pull_request:
    branches:
      - feature/ziwei-flowing-stars-v1

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Task 9 RED acceptance contract
        run: python -m unittest tests.test_ziwei_phase2c_acceptance -v
