name: v1.6 Legacy Paired TDD

on:
  push:
    branches:
      - impl/v1.6-legacy-adapter-paired-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm branch SHA
        run: git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Legacy Adapter focused gate
        run: python -m unittest -v tests.test_v16_event_family_legacy_adapter

      - name: Paired Oracle focused gate
        run: python -m unittest -v tests.test_v16_event_family_paired_oracle

      - name: Paired Evaluator focused gate
        run: python -m unittest -v tests.test_v16_event_family_paired_evaluation

      - name: Frozen Legacy authority regressions
        run: |
          python -m pytest \
            tests/test_distribution_interpretation_contract_v2.py \
            tests/test_v16_claim_consumption_contract.py \
            tests/test_v16_coordination_wrapper_integration.py \
            -q
