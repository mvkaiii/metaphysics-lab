name: v1.7 Guided Inquiry Finalize Distribution

on:
  push:
    branches:
      - feature/v1.7-guided-inquiry

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feature/v1.7-guided-inquiry
          fetch-depth: 0

      - name: Require triggering SHA to remain branch head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Add bundle smoke parity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_ai_distribution_bundle.py")
          text = path.read_text(encoding="utf-8")
          marker = "    def test_natal_request_matches_modular_runtime(self):\n"
          method = (
              "    def test_guided_inquiry_request_matches_modular_runtime(self):\n"
              "        payload = {\n"
              "            \"mode\": \"entry\",\n"
              "            \"case_health\": \"PASS\",\n"
              "            \"user_opted_out\": False,\n"
              "            \"blocking_state\": \"none\",\n"
              "            \"case_integrity_action_available\": False,\n"
              "            \"pending_forecast_available\": False,\n"
              "            \"current_answer\": None,\n"
              "        }\n"
              "        modular = dispatch(\"suggest_inquiries\", payload)\n"
              "        self.assertTrue(modular[\"ok\"], modular)\n"
              "        _, bundled = self.bundled_request(\"suggest_inquiries\", payload)\n"
              "        self.assertEqual(bundled, modular)\n\n"
          )
          if "def test_guided_inquiry_request_matches_modular_runtime" not in text:
              if marker not in text:
                  raise SystemExit("bundle parity insertion marker missing")
              text = text.replace(marker, method + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Rebuild deterministic AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Run Task 8 qualification
        run: |
          python -m unittest \
            tests.test_v17_guided_inquiry \
            tests.test_v17_guided_inquiry_runtime \
            tests.test_v17_guided_inquiry_ai_contract \
            tests.test_v17_guided_inquiry_distribution \
            tests.test_ai_distribution_bundle \
            tests.test_v17_capability_manifest \
            tests.test_distribution_runtime_info \
            tests.test_ai_distribution_docs \
            tests.test_project_ux_contract -v
          python -m compileall -q engine tests tools dist/ai/metaphysics_lab.py
          git diff --check

      - name: Commit generated distribution only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai tests/test_ai_distribution_bundle.py
          if git diff --cached --quiet; then
            echo "Generated distribution is already committed"
            exit 0
          fi
          git commit -m "build: include Guided Inquiry in portable distribution"
          git push origin HEAD:feature/v1.7-guided-inquiry
