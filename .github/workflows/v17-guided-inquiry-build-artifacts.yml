name: v1.7 Guided Inquiry Build Artifacts

on:
  push:
    branches:
      - feature/v1.7-guided-inquiry

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild deterministic AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Verify Project Instructions size contract
        run: |
          python -m unittest tests.test_project_ux_contract -v

      - name: Upload rebuilt distribution
        uses: actions/upload-artifact@v4
        with:
          name: guided-inquiry-dist
          path: |
            dist/ai/metaphysics_lab.py
            dist/ai/metaphysics_core.md
            dist/ai/project_instructions.txt
          if-no-files-found: error
          retention-days: 1
