name: Phase 2A Task 7 GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run public qualification unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_qualification_tools.ZiweiPublicQualificationTests -v 2>&1 | tee task7-unit.txt
      - name: Fetch exact pinned iztro source
        shell: bash
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/SylarLong/iztro/814b77e6371e1050cac31bbf674db3c3138fcfde/src/data/heavenlyStems.ts \
            -o /tmp/heavenlyStems.ts
          sha256sum /tmp/heavenlyStems.ts | tee task7-source-sha256.txt
      - name: Run exact public qualification
        shell: bash
        run: |
          RUN_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set -o pipefail
          python tools/qualify_ziwei_phase2a_public.py \
            --source-ts /tmp/heavenlyStems.ts \
            --source-revision 814b77e6371e1050cac31bbf674db3c3138fcfde \
            --run-timestamp "$RUN_TS" \
            --output public-iztro-evidence.json 2>&1 | tee task7-external.txt
      - name: Assert 40 of 40 evidence
        shell: bash
        run: |
          python - <<'PY' | tee task7-assert.txt
          import json
          from pathlib import Path
          data = json.loads(Path('public-iztro-evidence.json').read_text())
          assert data['source_revision'] == '814b77e6371e1050cac31bbf674db3c3138fcfde'
          assert data['cases_checked'] == 40
          assert data['cases_matched'] == 40
          assert data['mismatches'] == []
          assert data['status'] == 'PASS'
          print('EXTERNAL_PROFILE_PASS 40/40')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task7-green-evidence
          path: |
            task7-unit.txt
            task7-source-sha256.txt
            task7-external.txt
            task7-assert.txt
            public-iztro-evidence.json
