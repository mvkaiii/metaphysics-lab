name: Phase 2A Task 2 GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Task 2 GREEN and regressions
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests.test_ziwei_basis \
            tests.test_engine_module_layout \
            tests.test_project_ziwei_month \
            -v 2>&1 | tee task2-green.txt
      - name: Upload GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task2-green-evidence
          path: task2-green.txt
