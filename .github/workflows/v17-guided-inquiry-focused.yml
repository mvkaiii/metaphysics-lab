name: v1.7 Guided Inquiry Focused

on:
  push:
    branches:
      - feature/v1.7-guided-inquiry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2

      - name: Guided Inquiry distribution qualification
        run: |
          python -m unittest \
            tests.test_v17_guided_inquiry \
            tests.test_v17_guided_inquiry_runtime \
            tests.test_v17_guided_inquiry_ai_contract \
            tests.test_v17_guided_inquiry_distribution \
            tests.test_ai_distribution_bundle \
            tests.test_v17_capability_manifest \
            tests.test_distribution_runtime_info \
            tests.test_ai_distribution_docs -v

      - name: Compile focused runtime and distribution
        run: |
          python -m compileall -q engine tests tools dist/ai/metaphysics_lab.py
