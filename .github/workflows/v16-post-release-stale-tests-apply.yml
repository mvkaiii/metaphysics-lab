name: v1.6 Post-release Stale Tests Apply

on:
  push:
    branches: [docs/v1.6.0-post-release-normalization]
    paths:
      - '.github/workflows/v16-post-release-stale-tests-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v1.6.0-post-release-normalization
          fetch-depth: 0
      - name: Update only stale current-release assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace_exact('tests/test_ai_distribution_acceptance.py', [
              ('def test_formal_release_is_v1_5_0_without_capability_promotion(self):', 'def test_formal_release_is_v1_6_0_without_capability_promotion(self):'),
              ('self.assertIn("Metaphysics Lab Core：**v1.5.0**", formal)', 'self.assertIn("Metaphysics Lab Core：**v1.6.0**", formal)'),
              ('self.assertIn("發布日期：**2026-08-29**", formal)', 'self.assertIn("發布日期：**2026-09-05**", formal)'),
              ('self.assertIn("正式 release commit：`66f604222caadac0209125a78674c3f4491c4b99`", formal)', 'self.assertIn("正式 release commit：`c325d754112df71c6747e17262d2e781d2864441`", formal)'),
          ])

          replace_exact('tests/test_rule_source_reconciliation.py', [
              ('self.assertIn("Metaphysics Lab Core：**v1.5.0**", version)', 'self.assertIn("Metaphysics Lab Core：**v1.6.0**", version)'),
          ])

          replace_exact('tests/test_ziwei_phase2b_docs.py', [
              ('def test_current_release_is_v150_without_phase2b_promotion(self):', 'def test_current_release_is_v160_without_phase2b_promotion(self):'),
              ("self.assertIn('Metaphysics Lab Core：**v1.5.0**', self.version)", "self.assertIn('Metaphysics Lab Core：**v1.6.0**', self.version)"),
          ])

          replace_exact('tests/test_ziwei_phase2c_acceptance.py', [
              ('def test_current_release_is_v150_while_phase2c_qualification_snapshot_keeps_origin(self):', 'def test_current_release_is_v160_while_phase2c_qualification_snapshot_keeps_origin(self):'),
              ('self.assertIn("Metaphysics Lab Core：**v1.5.0**", text)', 'self.assertIn("Metaphysics Lab Core：**v1.6.0**", text)'),
          ])

          replace_exact('tests/test_ziwei_phase2c_docs.py', [
              ('def test_current_release_is_v150_without_flowing_star_promotion(self):', 'def test_current_release_is_v160_without_flowing_star_promotion(self):'),
              ('self.assertIn("Metaphysics Lab Core：**v1.5.0**", text)', 'self.assertIn("Metaphysics Lab Core：**v1.6.0**", text)'),
          ])

          replace_exact('tools/check_phase2c_rule_source.py', [
              ('_EXPECTED_RELEASE_IDENTITY = "v1.5.0"', '_EXPECTED_RELEASE_IDENTITY = "v1.6.0"'),
          ])
          replace_exact('tests/test_ziwei_phase2c_rule_source.py', [
              ('self.assertEqual(report["release_identity"], "v1.5.0")', 'self.assertEqual(report["release_identity"], "v1.6.0")'),
              ('self.assertEqual(report["expected_release_identity"], "v1.5.0")', 'self.assertEqual(report["expected_release_identity"], "v1.6.0")'),
          ])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_ai_distribution_acceptance.py tests/test_rule_source_reconciliation.py tests/test_ziwei_phase2b_docs.py tests/test_ziwei_phase2c_acceptance.py tests/test_ziwei_phase2c_docs.py tests/test_ziwei_phase2c_rule_source.py tools/check_phase2c_rule_source.py
          git diff --cached --check
          git commit -m "test: align current-release assertions with v1.6.0"
          git push origin HEAD:docs/v1.6.0-post-release-normalization
