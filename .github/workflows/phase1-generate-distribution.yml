name: Phase 1 Generate Distribution

on:
  push:
    branches:
      - feature/lin-tianji-phase1-forecast-governance

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 1 branch
        uses: actions/checkout@v4
        with:
          ref: feature/lin-tianji-phase1-forecast-governance
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild AI distribution
        run: python tools/build_ai_distribution.py

      - name: Refuse unexpected generated changes
        run: |
          git status --short
          test "$(git diff --name-only)" = "dist/ai/metaphysics_lab.py"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit generated bundle only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/ai/metaphysics_lab.py
          git diff --cached --quiet && { echo "expected generated bundle change is missing"; exit 1; }
          git commit -m "build: refresh Phase 1 AI distribution"
          git push origin HEAD:feature/lin-tianji-phase1-forecast-governance
