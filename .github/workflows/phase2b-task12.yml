name: Phase 2B Review Docs RED

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: read

jobs:
  review-docs-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85582e8a5bef4a229eed7ea9b9f8cdf4dc62a088
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove stale user docs RED
        run: |
          cat > /tmp/test_phase2b_user_docs_red.py <<'PY'
          import unittest
          from pathlib import Path

          ROOT = Path('.')
          USER_DOCS = (
              'docs/快速開始.md',
              'docs/安裝到ChatGPT-Project.md',
              'docs/更新與版本同步.md',
          )

          class Phase2BUserDocsRed(unittest.TestCase):
              def test_user_docs_match_phase2b_runtime_state(self):
                  combined = '\n'.join((ROOT / p).read_text(encoding='utf-8') for p in USER_DOCS)
                  for required in (
                      'ziwei-fine-cycle-lunar-late-zi-v1',
                      'late_zi_forward-v1',
                      'implemented / experimental / on_demand',
                      'lunar-lite',
                      '18/18 PASS',
                      'iztro',
                      'Astralium',
                      'PENDING',
                  ):
                      self.assertIn(required, combined)
                  self.assertNotIn('Fine Cycle Stem Resolver 尚未固定', combined)
                  self.assertNotIn('流月／流日／流時四化與飛化 = planned / on_demand', combined)

          if __name__ == '__main__':
              unittest.main()
          PY
          set +e
          python /tmp/test_phase2b_user_docs_red.py -v > /tmp/review-docs-red.txt 2>&1
          rc=$?
          set -e
          cat /tmp/review-docs-red.txt
          if [ "$rc" -eq 0 ]; then
            echo 'Review finding unexpectedly GREEN on exact feature SHA'
            exit 1
          fi
          grep -Eq 'ziwei-fine-cycle-lunar-late-zi-v1|lunar-lite|Astralium|Fine Cycle Stem Resolver 尚未固定' /tmp/review-docs-red.txt
          echo REVIEW_DOCS_EXPECTED_RED
