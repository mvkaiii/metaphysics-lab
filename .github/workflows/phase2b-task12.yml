name: Phase 2B Review Docs GREEN v3

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: write

jobs:
  review-docs-green-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85582e8a5bef4a229eed7ea9b9f8cdf4dc62a088
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply reviewed docs reconciliation helper
        run: |
          git show origin/validation/phase2b-task12:.github/validation/phase2b_review_docs_fix.py > /tmp/phase2b_review_docs_fix.py
          python /tmp/phase2b_review_docs_fix.py
          printf '%s\n' \
            'docs/安裝到ChatGPT-Project.md' \
            'docs/快速開始.md' \
            'docs/更新與版本同步.md' \
            'tests/test_rule_source_reconciliation.py' \
            'tests/test_ziwei_phase2b_docs.py' \
            | sort > /tmp/expected-files.txt
          git -c core.quotePath=false diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          echo REVIEW_FIX_SCOPE_PASS

      - name: Verify GREEN reconciliation docs
        run: |
          python -m unittest tests.test_rule_source_reconciliation tests.test_ziwei_phase2b_docs -v
          echo RULE_SOURCE_RECONCILIATION_PASS
          echo USER_DOCS_PHASE2B_SYNC_PASS

      - name: Full regression
        run: python -m unittest discover -v

      - name: Preserve release identity and no algorithm edits
        run: |
          git diff --exit-code 85582e8a5bef4a229eed7ea9b9f8cdf4dc62a088 -- VERSION.md
          test -z "$(git diff --name-only 85582e8a5bef4a229eed7ea9b9f8cdf4dc62a088 -- engine core qualification requirements.txt)"
          grep -q 'Metaphysics Lab Core：\*\*v1.2.0\*\*' VERSION.md
          echo VERSION_IDENTITY_UNCHANGED_PASS
          echo NO_ALGORITHM_SCOPE_LEAK_PASS

      - name: Commit validated review fix to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/快速開始.md docs/安裝到ChatGPT-Project.md docs/更新與版本同步.md tests/test_rule_source_reconciliation.py tests/test_ziwei_phase2b_docs.py
          git commit -m 'docs: reconcile Phase 2B installation guidance'
          git push origin HEAD:feature/ziwei-fine-cycle-stem-resolver-v1
