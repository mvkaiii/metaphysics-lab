name: Phase 2B Task 12

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: write

jobs:
  task12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ziwei-fine-cycle-stem-resolver-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Record release identity
        run: |
          git hash-object VERSION.md > /tmp/version-before.txt
          grep -q 'Metaphysics Lab Core：\*\*v1.2.0\*\*' VERSION.md
          echo VERSION_BASELINE_PASS

      - name: Write RED documentation tests
        run: |
          cat > tests/test_ziwei_phase2b_docs.py <<'PY'
          import unittest
          from pathlib import Path


          class ZiweiPhase2BDocumentationTests(unittest.TestCase):
              def setUp(self):
                  self.readme = Path('README.md').read_text(encoding='utf-8')
                  self.arch = Path('docs/架構說明.md').read_text(encoding='utf-8')
                  self.rules = Path('core/命理推導計算規則.md').read_text(encoding='utf-8')
                  self.changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
                  self.version = Path('VERSION.md').read_text(encoding='utf-8')

              def test_phase2b_profile_and_day_boundary_are_documented(self):
                  for text in (self.readme, self.arch, self.rules):
                      self.assertIn('ziwei-fine-cycle-lunar-late-zi-v1', text)
                      self.assertIn('late_zi_forward-v1', text)

              def test_capability_state_is_experimental_on_demand_not_stable_default(self):
                  for text in (self.readme, self.arch, self.rules):
                      self.assertIn('implemented / experimental / on_demand', text)
                  self.assertNotIn('紫微流月／流日／流時四化與飛化 | planned', self.readme)
                  self.assertNotIn('紫微流月／流日／流時四化與飛化     planned', self.arch)
                  self.assertNotIn('Fine Cycle Stem Resolver（紫微流月／流日／流時天干）', self.readme.split('## 目前仍未實作', 1)[-1])

              def test_calendar_boundary_ownership_is_explicit(self):
                  for text in (self.readme, self.arch, self.rules):
                      self.assertIn('Calendar Resolver', text)
                      self.assertIn('23:00', text)
                  self.assertIn('neutral', self.readme.lower())
                  self.assertIn('fine-cycle profile', self.arch)

              def test_qualification_state_is_documented_without_overclaim(self):
                  for text in (self.readme, self.arch, self.rules, self.changelog):
                      self.assertIn('lunar-lite', text)
                      self.assertIn('18/18 PASS', text)
                      self.assertIn('iztro', text)
                      self.assertIn('Astralium', text)
                      self.assertIn('PENDING', text)
                  self.assertIn('leap_twelfth_month_second_half', self.arch)
                  self.assertIn('not externally qualified', self.readme)

              def test_project_derived_is_classification_not_capability_prefix(self):
                  self.assertIn('Project 推導盤面', self.readme)
                  self.assertIn('資料分類', self.arch)
                  self.assertIn('不是 capability prefix', self.arch)

              def test_changelog_has_unreleased_phase2b_before_v120(self):
                  self.assertIn('## Unreleased｜Phase 2B', self.changelog)
                  self.assertLess(self.changelog.index('## Unreleased｜Phase 2B'), self.changelog.index('## v1.2.0｜2026-08-21'))

              def test_version_release_identity_remains_v120(self):
                  self.assertIn('Metaphysics Lab Core：**v1.2.0**', self.version)
                  self.assertNotIn('v1.3.0', self.version)
                  self.assertNotIn('Phase 2B', self.version)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Verify RED
        run: |
          set +e
          python -m unittest tests.test_ziwei_phase2b_docs -v > task12-red.txt 2>&1
          rc=$?
          cat task12-red.txt
          if [ "$rc" -eq 0 ]; then
            echo 'Task 12 unexpectedly GREEN before documentation promotion'
            exit 1
          fi
          grep -Eq 'ziwei-fine-cycle-lunar-late-zi-v1|Unreleased｜Phase 2B|lunar-lite' task12-red.txt
          echo TASK12_EXPECTED_RED

      - name: Promote Phase 2B documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'required block not found: {path}: {old[:60]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # README capability matrix and stale status.
          replace_required(
              'README.md',
              '| 紫微流月／流日／流時四化與飛化 | planned | — | on_demand |',
              '| Ziwei Fine Cycle Stem Resolver v1（流月／流日／流時天干） | implemented | experimental | on_demand |\n'
              '| 紫微流月／流日／流時四化 | implemented | experimental | on_demand |\n'
              '| 紫微流月／流日／流時飛化 | implemented | experimental | on_demand |',
          )
          replace_required(
              'README.md',
              '目前這三層只處理宮位定位。紫微流月採農曆月，初一換月；閏月採初一至十五歸原月、十六起歸下一月。',
              '這三個 palace 模組只處理宮位定位；細運天干、四化與飛化由獨立 Fine Cycle Stem Resolver／orchestration 處理。紫微流月採農曆月，初一換月；閏月採初一至十五歸原月、十六起歸下一月。',
          )
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          anchor = '\n## Phase 2A qualification\n'
          section = '''\n## Ziwei Fine Cycle Stem Resolver v1（Phase 2B / Unreleased）\n\n正式模組：\n\n```text\nengine/calendar/sexagenary.py\nengine/ziwei/fine_cycle_stems.py\nengine/ziwei/fine_cycle.py\n```\n\n固定 profile：`ziwei-fine-cycle-lunar-late-zi-v1`；rule version：`1.0-exp`；紫微細運日界：`late_zi_forward-v1`。Calendar Resolver 是 neutral civil/calendar infrastructure，維持民用日期 00:00 換日；23:00 的紫微命理換日只由 fine-cycle profile 在下游套用，不污染 Calendar Resolver，也不借用八字 policy。\n\n流月天干採農曆月邊界；23:xx 不提前切換流月。閏月初一至十五沿用原月，十六起 effective month ordinal +1。`leap_twelfth_month_second_half` 目前只有 synthetic internal coverage，**not externally qualified**。流日於 23:00 將 effective date 前進一天；流時用同一 effective Ziwei day 的日干起五鼠遁，時支直接採 `CalendarContext.hour_branch`。\n\n細運天干、四化與飛化 capability 均為 `implemented / experimental / on_demand / 1.0-exp`，不升 Stable，也不改成 Default。Composition 可同時保留 yearly / monthly / daily / hourly layers，不互相覆寫。\n\nPublic qualification：\n\n```text\npinned lunar-lite 1d104fff...   18/18 PASS\npinned iztro 814b77e6...        integration PASS\nAstralium fine-cycle             PENDING\n```\n\nAstralium 的 PENDING 原因是目前私有來源沒有完整細運 stem／transformation／flying payload；repo 只保存 aggregate 狀態，不保存 raw private chart。\n'''
          if anchor not in text:
              raise SystemExit('README Phase2A anchor missing')
          text = text.replace(anchor, section + anchor)
          old_missing = '''- 紫微 Fine Cycle Stem Resolver（流月／流日／流時天干）\n- 紫微 23:00 命理日界 school policy\n- 流月／流日／流時四化與飛化\n- 紫微流曜（moving stars）'''
          new_missing = '''- 紫微流曜（moving stars）'''
          if old_missing not in text:
              raise SystemExit('README stale missing block not found')
          text = text.replace(old_missing, new_missing)
          text = text.replace(
              'engine.ziwei.composition\n```',
              'engine.ziwei.composition\nengine.ziwei.fine_cycle_stems\nengine.ziwei.fine_cycle\n```',
          )
          readme.write_text(text, encoding='utf-8')

          # Architecture capability state / boundary ownership.
          replace_required(
              'docs/架構說明.md',
              '紫微流月／流日／流時四化與飛化     planned / on_demand',
              'Ziwei Fine Cycle Stem Resolver v1   implemented / experimental / on_demand\n'
              '紫微流月／流日／流時四化             implemented / experimental / on_demand\n'
              '紫微流月／流日／流時飛化             implemented / experimental / on_demand',
          )
          replace_required(
              'docs/架構說明.md',
              '八字 early-Zi 規則仍由八字引擎負責；紫微 23:00 命理日界尚未固定。',
              '八字 early-Zi 規則仍由八字引擎負責；紫微細運的 `late_zi_forward-v1` 由下游 fine-cycle profile 負責，Calendar Resolver 本身仍不套用命理日界。',
          )
          arch = Path('docs/架構說明.md')
          text = arch.read_text(encoding='utf-8')
          text = text.replace(
              '├── composition.py\n├── month.py',
              '├── composition.py\n├── fine_cycle_stems.py\n├── fine_cycle.py\n├── month.py',
          )
          anchor = '\n## Ziwei Transformation & Flying Core v1\n'
          section = '''\n## Ziwei Fine Cycle Stem Resolver v1\n\n```text\nCalendarContext\n→ fine_cycle_stems.py\n→ ResolvedCycleStem\n→ Transformation Core\n→ Flying Core\n→ fine_cycle.py / CycleTransformationLayer\n→ ZiweiLayerStack\n```\n\nprofile 固定為 `ziwei-fine-cycle-lunar-late-zi-v1`，rule version `1.0-exp`，日界 policy 為 `late_zi_forward-v1`。Calendar Resolver 仍是 neutral civil/calendar infrastructure；它只提供 civil date、農曆欄位與 hour branch，23:00 不在 Resolver 內改日。\n\n流月 stem 採農曆月：一般月份初一換月；閏月初一至十五維持原月，十六起 effective month ordinal +1；23:xx 不提前切月。`leap_twelfth_month_second_half` 的 ordinal 13 行為目前只有 synthetic test，標示為 **not externally qualified**。\n\n流日於 23:00 將 effective Ziwei date 前進一天，00:00 不再重複前進。流時用同一 effective day 的日干起五鼠遁，earthly branch 直接使用 `CalendarContext.hour_branch`。這套 policy 不 import 或重用八字換日 policy。\n\n細運 stem／transformations／flying 都是 `implemented / experimental / on_demand / 1.0-exp`。`Project 推導盤面` 是**資料分類**，不是 capability prefix；計算結果必須標示 Project-derived provenance，但 capability id 仍採 `ziwei.flow_*`。\n\nPublic qualification：pinned `lunar-lite` `1d104fff...` 為 **18/18 PASS**；pinned `iztro` `814b77e6...` 的 monthly/daily/hourly mutagen stem linkage 為 **integration PASS**。Astralium fine-cycle qualification 為 **PENDING**，因目前沒有完整 private fine-cycle source payload。\n'''
          if anchor not in text:
              raise SystemExit('architecture core anchor missing')
          text = text.replace(anchor, section + anchor)
          text = text.replace(
              '   ├─ decadal\n   └─ yearly',
              '   ├─ decadal\n   ├─ yearly\n   ├─ monthly\n   ├─ daily\n   └─ hourly',
          )
          old_missing = '''- Fine Cycle Stem Resolver（紫微流月／流日／流時天干）\n- 紫微 23:00 命理日界 school policy\n- 流月／流日／流時四化與飛化\n- 流曜（moving stars）'''
          if old_missing not in text:
              raise SystemExit('architecture stale missing block not found')
          text = text.replace(old_missing, '- 流曜（moving stars）')
          arch.write_text(text, encoding='utf-8')

          # Formal rule source: replace stale fine-cycle boundary section and add module ownership.
          rules = Path('core/命理推導計算規則.md')
          text = rules.read_text(encoding='utf-8')
          old = '''## 尚未實作：其他紫微細運\n\n目前不自行建立：\n\n- 流月／流日／流時細部四化\n- 流月／流日／流時流曜\n- 相應細層飛化\n- Cross-System Validation 正式引擎\n\n不得因流月、流日或流時定位已實作而自行延伸到四化、流曜、飛化或 Resolver。'''
          new = '''## 已實作但按需調用：紫微 Fine Cycle Stem Resolver v1\n\n固定 profile：\n\n```text\nziwei-fine-cycle-lunar-late-zi-v1\nrule_version = 1.0-exp\nday_boundary = late_zi_forward-v1\n```\n\n可建立流月／流日／流時天干地支，並以解析出的天干接入既有 Transformation Core 與 Flying Core，建立對應細運四化與飛化 layer。這些能力均為：\n\n```text\nimplemented / experimental / on_demand\n```\n\nCalendar Resolver 是 neutral civil/calendar infrastructure，civil date 仍在 00:00 換日；紫微的 23:00 effective-day 前進只由本 fine-cycle profile 套用，不得把八字 early-Zi policy 直接搬入。流月仍採農曆月，23:xx 不提前切月；閏月初一至十五沿用原月，十六起 effective month ordinal +1。\n\n流時以已套用 `late_zi_forward-v1` 的 effective day stem 起五鼠遁，時支直接使用 `CalendarContext.hour_branch`，不得由 resolver 自行重算。\n\nPublic qualification：pinned `lunar-lite` `1d104fff...` 為 **18/18 PASS**；pinned `iztro` `814b77e6...` fine-cycle mutagen integration 為 **PASS**。`leap_twelfth_month_second_half` 目前只有 synthetic internal coverage，屬 **not externally qualified**。Astralium fine-cycle qualification 為 **PENDING**，原因是目前沒有完整細運 private source payload。\n\n仍未實作：流月／流日／流時流曜（moving stars）、Cross-System Validation 正式引擎。'''
          if old not in text:
              raise SystemExit('formal rules stale fine-cycle block not found')
          text = text.replace(old, new)
          text = text.replace(
              '- 紫微流時正式實作：`engine/ziwei/hour.py`',
              '- 紫微流時正式實作：`engine/ziwei/hour.py`\n- 紫微 Fine Cycle Stem Resolver：`engine/ziwei/fine_cycle_stems.py`\n- 紫微細運四化／飛化 orchestration：`engine/ziwei/fine_cycle.py`\n- 中立干支數學 helper：`engine/calendar/sexagenary.py`',
          )
          text = text.replace(
              'engine/ziwei/hour.py\n```',
              'engine/ziwei/hour.py\nengine/ziwei/fine_cycle_stems.py\nengine/ziwei/fine_cycle.py\nengine/calendar/sexagenary.py\n```',
              1,
          )
          rules.write_text(text, encoding='utf-8')

          # Changelog: Unreleased, not a version bump.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '\n## v1.2.0｜2026-08-21\n'
          section = '''\n## Unreleased｜Phase 2B\n\n### Ziwei Fine Cycle Stem Resolver v1\n\n- 新增 `engine/calendar/sexagenary.py` 中立干支數學 helper，不 import 八字 policy。\n- 新增 `engine/ziwei/fine_cycle_stems.py`，固定 profile `ziwei-fine-cycle-lunar-late-zi-v1` / `1.0-exp`。\n- 紫微流月 stem 採農曆月與閏月 15/16 分界；23:xx 不提前切換流月。\n- 紫微流日固定 `late_zi_forward-v1`：22:59 舊日、23:00 effective date +1、00:00 不 double-rollover。\n- 紫微流時使用 effective Ziwei day stem 起五鼠遁，hour branch 直接採 CalendarContext。\n- 新增 `engine/ziwei/fine_cycle.py`，把 resolved stem 接入既有 Transformation / Flying Core。\n- Composition 支援 monthly / daily / hourly layer，保留 duplicate/conflict fail-closed semantics。\n- 細運 stem／四化／飛化 capability 升為 `implemented / experimental / on_demand / 1.0-exp`；Stable Core 與既有 palace maturity 不變；流曜仍 planned。\n\n### Phase 2B qualification\n\n```text\npinned lunar-lite 1d104fff...   18/18 PASS\npinned iztro 814b77e6...        integration PASS\nAstralium fine-cycle             PENDING\n```\n\n- `leap_twelfth_month_second_half` 目前只具 synthetic internal coverage，標記為 not externally qualified。\n- Astralium PENDING 原因：目前沒有完整 fine-cycle stem/transformation/flying private source payload。\n- repo 不提交 Astralium raw private chart；只保存 aggregate PENDING state。\n- 本段為 Unreleased 開發紀錄；`VERSION.md` 與 v1.2.0 release identity 不變。\n'''
          if anchor not in text:
              raise SystemExit('CHANGELOG v1.2.0 anchor missing')
          changelog.write_text(text.replace(anchor, section + anchor), encoding='utf-8')
          PY

      - name: Verify GREEN docs and release identity
        run: |
          python -m unittest tests.test_ziwei_phase2b_docs -v
          test "$(git hash-object VERSION.md)" = "$(cat /tmp/version-before.txt)"
          git diff --exit-code -- VERSION.md
          python -m unittest discover -v
          echo DOCS_PHASE2B_PASS
          echo VERSION_IDENTITY_UNCHANGED_PASS

      - name: Commit Task 12 to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/架構說明.md core/命理推導計算規則.md CHANGELOG.md tests/test_ziwei_phase2b_docs.py
          git commit -m 'docs: document Ziwei fine-cycle resolver Phase 2B'
          git push origin HEAD:feature/ziwei-fine-cycle-stem-resolver-v1
