name: v1.5 Terminology RED

on:
  push:
    branches:
      - feature/lin-tianji-v1.5-release-preparation

permissions:
  contents: read

jobs:
  terminology-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run terminology contract
        run: python -m unittest tests.test_v15_terminology_contract -v
