name: v1.6 Paired Distribution Sync

on:
  push:
    branches:
      - impl/v1.6-legacy-adapter-paired-evaluation

permissions:
  contents: write

jobs:
  sync-generated-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm source SHA
        run: git log -1 --format=%H

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild official AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Verify generated diff is distribution-only
        run: |
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo "No generated drift"
            exit 0
          fi
          bad="$(printf '%s\n' "$changed" | grep -v '^dist/ai/' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Commit deterministic generated diff
        run: |
          if git diff --quiet -- dist/ai/; then
            echo "Distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/
          git commit -m "build: sync paired evaluation distribution"
          git push origin HEAD:impl/v1.6-legacy-adapter-paired-evaluation
