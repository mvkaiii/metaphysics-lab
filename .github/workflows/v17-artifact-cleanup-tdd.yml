name: v1.7 Artifact Cleanup Policy TDD

on:
  push:
    branches:
      - ci/v17-local-staging-7c9c4-transport
    paths:
      - tools/v17_artifact_cleanup_policy.py
      - tools/v17_artifact_cleanup_policy_test.py
      - tools/v17_artifact_cleanup_phase2_policy.py
      - tools/v17_artifact_cleanup_phase2_policy_test.py
      - tools/v17_artifact_cleanup_ai_policy.py
      - tools/v17_artifact_cleanup_ai_policy_test.py
      - .github/workflows/v17-artifact-cleanup-tdd.yml

permissions:
  contents: read

jobs:
  policy-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run cleanup policy tests
        run: |
          python tools/v17_artifact_cleanup_policy_test.py
          python tools/v17_artifact_cleanup_phase2_policy_test.py
          python tools/v17_artifact_cleanup_ai_policy_test.py
