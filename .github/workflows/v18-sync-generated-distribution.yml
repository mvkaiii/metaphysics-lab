name: v1.8 Sync Generated Distribution

on:
  push:
    branches:
      - local/task0-2-capability-matrix
    paths:
      - engine/distribution/constants.py
      - engine/bazi/natal.py
      - tools/build_ai_distribution.py
      - .github/workflows/v18-sync-generated-distribution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: local/task0-2-capability-matrix
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Rebuild deterministic AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Require generated-only delta
        shell: bash
        run: |
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          test "$changed" = " M dist/ai/metaphysics_lab.py"

      - name: Commit generated distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/metaphysics_lab.py
          git commit -m "build(ai): sync v1.8 candidate distribution"
          git push origin HEAD:local/task0-2-capability-matrix
