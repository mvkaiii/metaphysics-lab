name: Artifact inventory (read-only)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Collect read-only artifact inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/artifact_inventory.py --repo "$GITHUB_REPOSITORY"
