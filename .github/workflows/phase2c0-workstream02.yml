name: Phase 2C0 Workstream 02 Acceptance

on:
  pull_request:
    branches:
      - design/natal-chart-foundation
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Bazi natal focused tests and regression
        run: |
          python -m unittest \
            tests.test_bazi_natal_models \
            tests.test_bazi_natal_capabilities \
            tests.test_bazi_natal \
            tests.test_bazi_time_profile_comparison \
            tests.test_bazi_decadal_luck \
            tests.test_bazi_natal_qualification \
            tests.test_project_bazi_calendar -v
      - name: Generate live public qualification evidence
        run: |
          python tools/qualify_bazi_natal.py --output /tmp/bazi-natal-public.json
          cat /tmp/bazi-natal-public.json
      - name: Python 3.9 syntax gate
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = list(Path('engine/bazi').rglob('*.py')) + list(Path('tests').glob('test_bazi*.py')) + [Path('tools/qualify_bazi_natal.py')]
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), feature_version=(3, 9))
          print('PYTHON39_BAZI_NATAL_PASS')
          PY
      - name: Verify committed evidence summary matches live output and privacy contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          forbidden = {'name', 'full_address', 'birth_datetime', 'raw_chart', 'raw_payload'}

          def walk_keys(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield key
                      yield from walk_keys(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk_keys(item)

          live_path = Path('/tmp/bazi-natal-public.json')
          live = json.loads(live_path.read_text(encoding='utf-8'))
          summary = json.loads(Path('qualification/bazi/natal/public-lunar-python-1.4.8.json').read_text(encoding='utf-8'))
          private = json.loads(Path('qualification/bazi/natal/private-summary.json').read_text(encoding='utf-8'))
          live_sha256 = hashlib.sha256(live_path.read_bytes()).hexdigest()

          assert live['status'] == 'PASS', live
          assert live['unexpected_mismatch_count'] == 0, live
          assert summary['classification'] == 'public_bazi_natal_qualification_summary'
          for key in (
              'reference_engine',
              'reference_version',
              'reference_source_revision',
              'project_profile',
              'project_rule_version',
              'status',
              'case_count',
              'matched_field_count',
              'profile_difference_count',
              'unexpected_mismatch_count',
          ):
              assert summary[key] == live[key], (key, summary[key], live[key])
          assert summary['case_ids'] == [case['case_id'] for case in live['cases']]
          for key in ('matched_branch_count', 'profile_difference_count', 'unexpected_mismatch_count'):
              assert summary['hidden_stem_table'][key] == live['hidden_stem_table'][key]
          assert summary['live_report_sha256'] == live_sha256, (summary['live_report_sha256'], live_sha256)
          assert forbidden.isdisjoint(set(walk_keys(summary)))
          assert forbidden.isdisjoint(set(walk_keys(private)))
          assert private['classification'] == 'private_bazi_natal_qualification_summary'
          assert private['status'] == 'PENDING'
          print('BAZI_NATAL_EVIDENCE_ACCEPTANCE_PASS')
          PY
      - name: Upload live qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazi-natal-public-qualification
          path: /tmp/bazi-natal-public.json
