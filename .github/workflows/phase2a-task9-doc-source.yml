name: Phase 2A Task 9 doc sync

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ziwei-transformation-flying-core-v1
          fetch-depth: 0
          path: work
      - name: Checkout temporary patch helper
        uses: actions/checkout@v4
        with:
          ref: validation/phase2a-task9-doc-source
          path: helper
      - name: Sync approved Phase 2A docs
        shell: bash
        run: |
          cd work
          python ../helper/.github/phase2a-task9-doc-patch.py
          changed=$(git -c core.quotePath=false diff --name-only)
          printf '%s\n' "$changed"
          test "$changed" = $'CHANGELOG.md\nREADME.md\nVERSION.md\ndocs/架構說明.md'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md VERSION.md CHANGELOG.md docs/架構說明.md
          git commit -m "docs: promote Ziwei Phase 2A capabilities"
          git push origin HEAD:feature/ziwei-transformation-flying-core-v1
