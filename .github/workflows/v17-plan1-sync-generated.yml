name: v1.7 Plan 1 Sync Generated

on:
  push:
    branches:
      - feature/v1.7-capability-manifest-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.7-capability-manifest-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Rebuild canonical AI distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check
      - name: Commit generated bytes if changed
        run: |
          if git diff --quiet -- dist/ai; then
            echo "Generated distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/metaphysics_lab.py dist/ai/metaphysics_core.md dist/ai/project_instructions.txt
          git commit -m "build: include capability manifest v1 in distribution"
          git push origin HEAD:feature/v1.7-capability-manifest-v1
