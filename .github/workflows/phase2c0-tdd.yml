name: Phase 2C0 TDD

on:
  pull_request:
    branches:
      - design/natal-chart-foundation
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Phase 2C0 tests and regressions
        run: |
          python -m unittest discover -s tests -p 'test_birth*.py' -v
          python -m unittest discover -s tests -p 'test_calendar*.py' -v
          python -m unittest discover -s tests -p 'test_ziwei*.py' -v
          python -m unittest discover -s tests -p 'test_bazi*.py' -v
