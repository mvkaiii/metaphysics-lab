name: Phase 0 Generated Distribution Commit

on:
  push:
    branches:
      - feature/lin-tianji-phase0-blind-lock

permissions:
  contents: write

jobs:
  commit-generated-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 0 branch
        uses: actions/checkout@v4
        with:
          ref: feature/lin-tianji-phase0-blind-lock
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild deterministic distribution
        run: |
          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Verify exact generated file boundary and digest
        run: |
          test "$(git status --porcelain | awk '{print $2}')" = "dist/ai/metaphysics_lab.py"
          echo "3d03e31b813fb625cadcd035df6da139c12a92a49b00077536df655fb1d994f3  dist/ai/metaphysics_lab.py" | sha256sum --check --strict

      - name: Commit generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/metaphysics_lab.py
          git commit -m "build: refresh Phase 0 AI distribution"
          git push origin HEAD:feature/lin-tianji-phase0-blind-lock
