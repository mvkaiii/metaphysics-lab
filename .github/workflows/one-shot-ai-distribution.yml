name: One-shot AI distribution regeneration

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run official distribution generator
        run: |
          python tools/build_ai_distribution.py --output-dir dist/ai
          python tools/build_ai_distribution.py --output-dir dist/ai --check

      - name: Upload official generated distribution
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-ai-distribution
          path: dist/ai/
          if-no-files-found: error
          retention-days: 7
