name: One-shot Bazi vendor fix distribution regeneration

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install pinned dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.2

      - name: Targeted provider and Bazi regressions
        run: |
          python -m unittest \
            tests.test_vendor_import_isolation \
            tests.test_project_bazi_calendar \
            tests.test_bazi_decadal_luck -v

      - name: Run official distribution generator
        run: |
          python tools/build_ai_distribution.py --output-dir dist/ai
          python tools/build_ai_distribution.py --output-dir dist/ai --check

      - name: Commit exact official generated distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ai/
          if git diff --cached --quiet; then
            echo "distribution already current"
            exit 0
          fi
          git commit -m "build: regenerate AI distribution after Bazi provider fix"
          git push origin "HEAD:${{ github.head_ref }}"
