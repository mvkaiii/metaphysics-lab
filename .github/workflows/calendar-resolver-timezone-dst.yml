name: Calendar Resolver timezone DST

on:
  pull_request:
    branches:
      - feature/calendar-resolver-v1

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run Gate 2 tests and preserve output
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_calendar_timezone -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > test-exit-status.txt
          exit "$status"
      - name: Upload Gate 2 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-timezone-dst-output
          path: |
            test-output.txt
            test-exit-status.txt
