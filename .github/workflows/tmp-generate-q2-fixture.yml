name: Temporary generate Q2 synthetic fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Generate synthetic fixture
        run: python tools/tmp_generate_q2_fixture.py
      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          test "$changed" = "tests/fixtures/v1.6-event-family-hybrid-qualification.synthetic.v1.json"
      - name: Commit fixture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/v1.6-event-family-hybrid-qualification.synthetic.v1.json
          git commit -m "test: add q2 synthetic qualification fixture"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
