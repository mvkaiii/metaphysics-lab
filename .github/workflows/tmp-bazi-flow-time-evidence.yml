name: Temporary Bazi Flow Time Evidence

on:
  push:
    branches:
      - feature/bazi-flow-time-qualification

permissions:
  contents: read

jobs:
  qualify:
    if: contains(github.event.head_commit.message, 'Bazi flow-time qualification evidence')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/bazi-flow-time-qualification
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Build public qualification evidence
        run: python tools/build_bazi_flow_time_qualification.py
      - name: Show evidence
        run: cat qualification/bazi/flow_time/public-lunar-python-1.4.8.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bazi-flow-time-public-evidence
          path: qualification/bazi/flow_time/public-lunar-python-1.4.8.json
          if-no-files-found: error
