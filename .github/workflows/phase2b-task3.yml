name: Phase 2B Task 3

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: write

jobs:
  task3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ziwei-fine-cycle-stem-resolver-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Write RED monthly tests
        run: |
          cat >> tests/test_ziwei_fine_cycle_stems.py <<'PY'

          from engine.ziwei.errors import ZiweiFineCycleError
          from engine.ziwei.fine_cycle_stems import (
              FINE_CYCLE_PROFILE_ID,
              get_fine_cycle_profile,
              resolve_month_stem,
          )
          from tests.ziwei_phase2b_fixtures import calendar_context


          class FineCycleMonthTests(unittest.TestCase):
              def test_profile_is_explicit(self):
                  profile = get_fine_cycle_profile()
                  self.assertEqual(profile.profile_id, "ziwei-fine-cycle-lunar-late-zi-v1")
                  self.assertEqual(profile.rule_version, "1.0-exp")
                  self.assertEqual(profile.ziwei_day_boundary, "late_zi_forward-v1")
                  self.assertEqual(FINE_CYCLE_PROFILE_ID, profile.profile_id)

              def test_unknown_profile_has_no_fallback(self):
                  with self.assertRaises(ZiweiFineCycleError) as cm:
                      get_fine_cycle_profile("unknown")
                  self.assertEqual(cm.exception.code, "invalid_fine_cycle_profile")

              def test_public_2023_lunar_sixth_month_vector(self):
                  result = resolve_month_stem(
                      calendar_context(lunar_year=2023, lunar_month=6, lunar_day=13)
                  )
                  self.assertEqual((result.heavenly_stem, result.earthly_branch), ("己", "未"))
                  self.assertEqual(result.reference, "lunar:2023-06")
                  self.assertEqual(result.scope, "monthly")

              def test_leap_month_day_15_and_16_split(self):
                  before = resolve_month_stem(calendar_context(
                      lunar_year=2023, lunar_month=2, lunar_day=15, is_leap_month=True
                  ))
                  after = resolve_month_stem(calendar_context(
                      lunar_year=2023, lunar_month=2, lunar_day=16, is_leap_month=True
                  ))
                  self.assertEqual(before.reference, "lunar:2023-L02-A")
                  self.assertEqual(after.reference, "lunar:2023-L02-B")
                  self.assertEqual((before.heavenly_stem, before.earthly_branch), ("乙", "卯"))
                  self.assertEqual((after.heavenly_stem, after.earthly_branch), ("丙", "辰"))

              def test_synthetic_leap_twelfth_second_half_continues_ordinal_13(self):
                  result = resolve_month_stem(calendar_context(
                      lunar_year=2023, lunar_month=12, lunar_day=16, is_leap_month=True
                  ))
                  self.assertEqual(result.reference, "lunar:2023-L12-B")
                  self.assertEqual((result.heavenly_stem, result.earthly_branch), ("丙", "寅"))

              def test_23xx_does_not_advance_month_stem(self):
                  result = resolve_month_stem(calendar_context(
                      local_hour=23,
                      lunar_year=2023,
                      lunar_month=6,
                      lunar_day=30,
                  ))
                  self.assertEqual((result.heavenly_stem, result.earthly_branch), ("己", "未"))
                  self.assertEqual(result.reference, "lunar:2023-06")

              def test_calendar_boundary_conflict_and_preapplied_boundary_fail_closed(self):
                  with self.assertRaises(ZiweiFineCycleError) as cm1:
                      resolve_month_stem(calendar_context(calendar_status="boundary_conflict"))
                  self.assertEqual(cm1.exception.code, "calendar_context_unusable")
                  with self.assertRaises(ZiweiFineCycleError) as cm2:
                      resolve_month_stem(calendar_context(metaphysics_day_boundary_applied=True))
                  self.assertEqual(cm2.exception.code, "calendar_boundary_already_applied")
          PY
      - name: Verify RED
        run: |
          set +e
          python -m unittest tests.test_ziwei_fine_cycle_stems.FineCycleMonthTests -v > task3-red.txt 2>&1
          rc=$?
          cat task3-red.txt
          if [ "$rc" -eq 0 ]; then
            echo "Task 3 unexpectedly GREEN before implementation"
            exit 1
          fi
          grep -q "No module named 'engine.ziwei.fine_cycle_stems'" task3-red.txt
          echo TASK3_EXPECTED_RED
      - name: Implement monthly fine-cycle resolver
        run: |
          cat > engine/ziwei/fine_cycle_stems.py <<'PY'
          from __future__ import annotations

          from engine.calendar.models import CalendarContext
          from engine.calendar.sexagenary import five_tiger_month, lunar_year_stem

          from .errors import ZiweiFineCycleError
          from .models import FineCycleStemProfile, LayerProvenance, ResolvedCycleStem

          FINE_CYCLE_PROFILE_ID = "ziwei-fine-cycle-lunar-late-zi-v1"
          FINE_CYCLE_RULE_VERSION = "1.0-exp"
          DAY_BOUNDARY_PROFILE = "late_zi_forward-v1"

          DEFAULT_FINE_CYCLE_PROFILE = FineCycleStemProfile(
              FINE_CYCLE_PROFILE_ID,
              FINE_CYCLE_RULE_VERSION,
              "lunar_month",
              "split_after_day_15",
              "lunar_year",
              DAY_BOUNDARY_PROFILE,
              "effective_ziwei_day_stem",
          )


          def get_fine_cycle_profile(profile_id=FINE_CYCLE_PROFILE_ID):
              if profile_id != FINE_CYCLE_PROFILE_ID:
                  raise ZiweiFineCycleError(
                      "invalid_fine_cycle_profile",
                      "unknown Ziwei fine-cycle stem profile",
                      {"profile_id": profile_id},
                  )
              return DEFAULT_FINE_CYCLE_PROFILE


          def _ensure_usable_context(context: CalendarContext) -> None:
              if context.validation.calendar_conversion.status == "boundary_conflict":
                  raise ZiweiFineCycleError(
                      "calendar_context_unusable",
                      "calendar conversion is in boundary conflict",
                      {"boundary_id": context.validation.boundary_id},
                  )
              if context.policies.metaphysics_day_boundary_applied:
                  raise ZiweiFineCycleError(
                      "calendar_boundary_already_applied",
                      "metaphysics day boundary must be applied by the Ziwei profile exactly once",
                  )


          def _provenance(profile: FineCycleStemProfile) -> LayerProvenance:
              return LayerProvenance(
                  "project_derived",
                  "Metaphysics Lab",
                  None,
                  profile.profile_id,
                  profile.rule_version,
                  "engine.ziwei.fine_cycle_stems",
              )


          def _month_reference(context: CalendarContext) -> str:
              year = context.lunar.year
              month = context.lunar.month
              day = context.lunar.day
              if not context.lunar.is_leap_month:
                  return "lunar:%04d-%02d" % (year, month)
              segment = "A" if day <= 15 else "B"
              return "lunar:%04d-L%02d-%s" % (year, month, segment)


          def resolve_month_stem(
              context: CalendarContext,
              profile_id: str = FINE_CYCLE_PROFILE_ID,
          ) -> ResolvedCycleStem:
              _ensure_usable_context(context)
              profile = get_fine_cycle_profile(profile_id)
              month = context.lunar.month
              day = context.lunar.day
              if not 1 <= month <= 12 or not 1 <= day <= 30:
                  raise ZiweiFineCycleError(
                      "calendar_context_unusable",
                      "invalid lunar month/day in CalendarContext",
                      {"lunar_month": month, "lunar_day": day},
                  )
              effective_month_ordinal = month + (
                  1 if context.lunar.is_leap_month and day >= 16 else 0
              )
              year_stem = lunar_year_stem(context.lunar.year)
              stem, branch = five_tiger_month(year_stem, effective_month_ordinal)
              civil_date = context.normalized_time.gregorian_date
              return ResolvedCycleStem(
                  "monthly",
                  _month_reference(context),
                  stem,
                  branch,
                  profile.profile_id,
                  profile.rule_version,
                  civil_date,
                  civil_date,
                  None,
                  context.validation.overall_status,
                  _provenance(profile),
              )
          PY
      - name: Verify GREEN and regressions
        run: |
          python -m unittest tests.test_ziwei_fine_cycle_stems.FineCycleModelTests tests.test_ziwei_fine_cycle_stems.FineCycleMonthTests -v
          python -m unittest tests.test_project_ziwei_month tests.test_ziwei_calendar_adapter -v
          python -m unittest discover -v
          echo MONTH_STEM_INVARIANTS_PASS
          echo LEAP_MONTH_BOUNDARY_PASS
      - name: Commit Task 3 to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ziwei/fine_cycle_stems.py tests/test_ziwei_fine_cycle_stems.py
          git commit -m "feat: resolve Ziwei fine-cycle monthly stems"
          git push origin HEAD:feature/ziwei-fine-cycle-stem-resolver-v1
