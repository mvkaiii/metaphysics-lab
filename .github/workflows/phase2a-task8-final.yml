name: Phase 2A Task 8 Final

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run qualification tooling tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_qualification_tools -v 2>&1 | tee task8-tools.txt
      - name: Validate aggregate private evidence and privacy
        shell: bash
        run: |
          python - <<'PY' | tee task8-private-evidence.txt
          import json
          from pathlib import Path
          p = Path('qualification/ziwei/phase2a/private-astralium-summary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          serialized = json.dumps(data, ensure_ascii=False)
          for forbidden in ('star_locations', 'palace_stems', 'expected_edges', 'birth_datetime', 'name', 'chart_id'):
              assert forbidden not in serialized, forbidden
          assert data['source_profile'] == 'astralium-ziwei-v1-common（通行版）'
          assert data['source_digest'] == 'sha256:4cdd61ee8e9061d98e7a98f4fe7d335d96e76bcf3dab32670707f94dd461bc43'
          assert data['transformation_profile'] == {'checked': 40, 'matched': 40, 'mismatches': 0, 'status': 'PASS'}
          assert data['natal'] == {'checked': 48, 'matched': 48, 'mismatches': 0, 'status': 'PASS'}
          assert data['decadal'] == {'checked': 4, 'matched': 4, 'mismatches': 0, 'status': 'PASS'}
          assert data['yearly'] == {'checked': 28, 'matched': 28, 'mismatches': 0, 'status': 'PASS'}
          assert data['flying_total'] == {'checked': 80, 'matched': 80, 'mismatches': 0, 'status': 'PASS'}
          assert data['presentation'] == {'checked': 11, 'matched': 11, 'mismatches': 0, 'status': 'PASS'}
          assert data['status'] == 'PASS'
          print('ASTRALIUM_TRANSFORMATION_40_PASS')
          print('ASTRALIUM_NATAL_48_PASS')
          print('ASTRALIUM_DECADAL_4_PASS')
          print('ASTRALIUM_YEARLY_28_PASS')
          print('ASTRALIUM_FLYING_80_PASS')
          print('ASTRALIUM_PRESENTATION_11_PASS')
          print('PRIVACY_PASS')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task8-final-evidence
          path: |
            task8-tools.txt
            task8-private-evidence.txt
