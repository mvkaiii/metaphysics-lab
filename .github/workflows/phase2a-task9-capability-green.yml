name: Phase 2A Task 9 Capability GREEN

on:
  pull_request:
    branches:
      - feature/ziwei-transformation-flying-core-v1

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run capability tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_ziwei_phase2a_capabilities -v 2>&1 | tee capabilities.txt
      - name: Run Phase 2A internal suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests.test_ziwei_phase2a_models \
            tests.test_ziwei_basis \
            tests.test_ziwei_transformations \
            tests.test_ziwei_flying \
            tests.test_ziwei_composition \
            tests.test_ziwei_phase2a_capabilities \
            tests.test_ziwei_phase2a_qualification_tools -v 2>&1 | tee phase2a-internal.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-task9-capability-green-evidence
          path: |
            capabilities.txt
            phase2a-internal.txt
