name: publish-v1.3.0

on:
  push:
    branches:
      - release/v1.3.0-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: f7e48ebea8c841194b71b8c0f2c2168550763322
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7e48ebea8c841194b71b8c0f2c2168550763322
          fetch-depth: 0

      - name: Verify exact release target and assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f dist/ai/metaphysics_lab.py
          test -f dist/ai/METAPHYSICS_CORE.md
          test -f dist/ai/PROJECT_INSTRUCTIONS.md
          grep -F 'Metaphysics Lab Core：**v1.3.0**' VERSION.md
          sha256sum \
            dist/ai/metaphysics_lab.py \
            dist/ai/METAPHYSICS_CORE.md \
            dist/ai/PROJECT_INSTRUCTIONS.md

      - name: Refuse to overwrite an existing v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo 'v1.3.0 GitHub Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.0 >/dev/null 2>&1; then
            echo 'v1.3.0 tag already exists; refusing to overwrite.' >&2
            exit 1
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/v1.3.0-notes.md <<'EOF'
          ## Metaphysics Lab v1.3.0

          v1.3.0 正式收斂 Natal Foundation、Ziwei Fine Cycle、Ziwei Flowing Stars 與 AI Distribution Pack。

          ### 手機／一般使用者

          在下方 **Assets** 逐檔下載，不需要下載或解壓 source ZIP：

          - `metaphysics_lab.py` — deterministic runtime；上傳到 ChatGPT / Claude Project
          - `METAPHYSICS_CORE.md` — 穩定 AI 工作契約；上傳到 Project
          - `PROJECT_INSTRUCTIONS.md` — 複製內容到 Project Instructions

          完整命盤、流年或決策分析建議使用 **High reasoning**，然後對 AI 說：**「開始建立我的命理專案。」**

          ### Governance

          - Release target: `f7e48ebea8c841194b71b8c0f2c2168550763322`
          - Project Contract: `1.0`
          - Case Schema: `1.0`
          - AI Distribution Runtime: `1.0-exp`
          - 本次 release 不自動提升任何 Experimental capability 的 maturity。
          - 當前 implementation / maturity / routing 以 `runtime_info` 為權威來源。

          Release 前已通過：release-focused governance suite、deterministic build `--check`、full repository **488/488 PASS**、Python 3.9 compileall。
          EOF

      - name: Create tag, GitHub Release, and individual assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.0 \
            dist/ai/metaphysics_lab.py \
            dist/ai/METAPHYSICS_CORE.md \
            dist/ai/PROJECT_INSTRUCTIONS.md \
            --target "$TARGET_SHA" \
            --title 'Metaphysics Lab v1.3.0' \
            --notes-file /tmp/v1.3.0-notes.md \
            --latest

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.3.0" --jq '.object.sha')"
          test "$tag_sha" = "$TARGET_SHA"

          mapfile -t assets < <(gh release view v1.3.0 --json assets --jq '.assets[].name' | sort)
          expected=(METAPHYSICS_CORE.md PROJECT_INSTRUCTIONS.md metaphysics_lab.py)
          test "${assets[*]}" = "${expected[*]}"

          gh release view v1.3.0 --json url,tagName,name,isLatest --jq '.'
