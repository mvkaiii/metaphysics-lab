name: distribution-filename-migration-helper

on:
  push:
    branches:
      - release/v1.3.0-publish

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/distribution-filenames-lowercase
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Normalize internal distribution filename references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'METAPHYSICS_CORE.md': 'metaphysics_core.md',
              'PROJECT_INSTRUCTIONS.md': 'project_instructions.md',
          }
          targets = [
              Path('core/AI工作流程.md'),
              Path('core/核心提示詞.md'),
              Path('core/命理分析作業規範.md'),
              Path('CHANGELOG.md'),
              Path('VERSION.md'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          python tools/build_ai_distribution.py
          python tools/build_ai_distribution.py --check

      - name: Verify no legacy filename remains in public distribution
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/ai/METAPHYSICS_CORE.md
          test ! -e dist/ai/PROJECT_INSTRUCTIONS.md
          test -f dist/ai/metaphysics_core.md
          test -f dist/ai/project_instructions.md
          ! grep -R -n -E 'METAPHYSICS_CORE\.md|PROJECT_INSTRUCTIONS\.md' dist/ai README.md docs/ core/ CHANGELOG.md VERSION.md

      - name: Focused filename and distribution tests
        run: |
          python -m unittest \
            tests.test_distribution_filename_migration \
            tests.test_ai_distribution_acceptance \
            tests.test_ai_distribution_build \
            tests.test_ai_distribution_docs -v

      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile and diff check
        run: |
          python -m compileall engine tests tools
          git diff --check

      - name: Commit validated migration output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core CHANGELOG.md VERSION.md dist/ai
          if git diff --cached --quiet; then
            echo 'No additional migration changes.'
            exit 0
          fi
          git commit -m 'release: sync internal references to lowercase filenames'
          git push origin HEAD:release/distribution-filenames-lowercase
