name: Task 7 Guided Inquiry doc contract patch

on:
  push:
    branches:
      - feature/v1.7-guided-inquiry
    paths:
      - .github/workflows/_task7-doc-contract-patch.yml

permissions:
  contents: write

jobs:
  patch-doc-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Append Guided Inquiry source-doc contract
        env:
          WORKFLOW_BLOCK_B64: 
          INSTRUCTIONS_BLOCK_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          workflow_path = Path('core/AI工作流程.md')
          instructions_path = Path('core/核心提示詞.md')

          workflow = workflow_path.read_text(encoding='utf-8')
          marker = '## 11.1 Guided Inquiry｜使用者呈現契約'
          if marker not in workflow:
              block = base64.b64decode(os.environ['WORKFLOW_BLOCK_B64']).decode('utf-8')
              workflow_path.write_text(workflow.rstrip() + block.rstrip() + '\n', encoding='utf-8')

          instructions = instructions_path.read_text(encoding='utf-8')
          marker = '## Guided Inquiry｜對話導引底線'
          if marker not in instructions:
              block = base64.b64decode(os.environ['INSTRUCTIONS_BLOCK_B64']).decode('utf-8')
              instructions_path.write_text(instructions.rstrip() + block.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Verify Task 7 RED tests turn GREEN
        run: |
          python -m unittest \
            tests.test_v17_guided_inquiry_ai_contract \
            tests.test_ai_distribution_docs -v

      - name: Commit verified source-doc contract and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_task7-doc-contract-patch.yml
          git add core/AI工作流程.md core/核心提示詞.md
          git diff --cached --check
          git commit -m "docs: define Guided Inquiry AI contract"
          git push origin HEAD:${GITHUB_REF_NAME}
