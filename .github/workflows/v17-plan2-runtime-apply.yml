name: v1.7 Plan 2 Runtime Apply

on:
  push:
    branches:
      - feature/v1.7-case-doctor-reconciliation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.7-case-doctor-reconciliation
      - name: Apply runtime patch
        run: python tools/_tmp_patch_v17_runtime_case_doctor.py
      - name: Commit edit when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/distribution/runtime.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: expose Case Doctor runtime actions"
          git push origin HEAD:feature/v1.7-case-doctor-reconciliation
