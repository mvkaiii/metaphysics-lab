name: Phase 2B Task 8

on:
  pull_request:
    branches:
      - design/ziwei-fine-cycle-stem-resolver

permissions:
  contents: write

jobs:
  task8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ziwei-fine-cycle-stem-resolver-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Write RED capability tests
        run: |
          cat > tests/test_ziwei_phase2b_capabilities.py <<'PY'
          import unittest

          from engine.ziwei.capabilities import can_execute, get_capability, should_run_by_default


          class ZiweiPhase2BCapabilityTests(unittest.TestCase):
              def test_fine_cycle_stems_are_experimental_on_demand(self):
                  for capability_id in (
                      "ziwei.flow_month_stem",
                      "ziwei.flow_day_stem",
                      "ziwei.flow_hour_stem",
                  ):
                      cap = get_capability(capability_id)
                      self.assertEqual(cap["implementation"], "implemented")
                      self.assertEqual(cap["maturity"], "experimental")
                      self.assertEqual(cap["routing"], "on_demand")
                      self.assertEqual(cap["rule_version"], "1.0-exp")
                      self.assertEqual(cap["module"], "engine.ziwei.fine_cycle_stems")
                      self.assertTrue(can_execute(capability_id))
                      self.assertFalse(should_run_by_default(capability_id))

              def test_fine_cycle_transformations_and_flying_are_experimental_on_demand(self):
                  for capability_id in (
                      "ziwei.flow_month_transformations",
                      "ziwei.flow_day_transformations",
                      "ziwei.flow_hour_transformations",
                      "ziwei.flow_month_flying",
                      "ziwei.flow_day_flying",
                      "ziwei.flow_hour_flying",
                  ):
                      cap = get_capability(capability_id)
                      self.assertEqual(cap["implementation"], "implemented")
                      self.assertEqual(cap["maturity"], "experimental")
                      self.assertEqual(cap["routing"], "on_demand")
                      self.assertEqual(cap["rule_version"], "1.0-exp")
                      self.assertTrue(can_execute(capability_id))
                      self.assertFalse(should_run_by_default(capability_id))

              def test_existing_palace_and_core_maturity_do_not_change(self):
                  month = get_capability("ziwei.flow_month_palaces")
                  self.assertEqual((month["maturity"], month["routing"]), ("stable", "default"))
                  for capability_id in ("ziwei.flow_day_palaces", "ziwei.flow_hour_palaces"):
                      cap = get_capability(capability_id)
                      self.assertEqual((cap["maturity"], cap["routing"]), ("experimental", "on_demand"))
                  for capability_id in ("ziwei.transformations", "ziwei.flying"):
                      cap = get_capability(capability_id)
                      self.assertEqual((cap["implementation"], cap["maturity"], cap["routing"], cap["rule_version"]),
                                       ("implemented", "stable", "on_demand", "1.0"))

              def test_flowing_stars_remain_planned_and_not_executable(self):
                  cap = get_capability("ziwei.flowing_stars")
                  self.assertEqual(cap["implementation"], "planned")
                  self.assertFalse(can_execute("ziwei.flowing_stars"))

              def test_dependencies_are_scope_specific(self):
                  self.assertEqual(
                      get_capability("ziwei.flow_day_transformations")["dependencies"],
                      ("ziwei.flow_day_stem", "ziwei.transformations"),
                  )
                  self.assertEqual(
                      get_capability("ziwei.flow_hour_flying")["dependencies"],
                      ("ziwei.flow_hour_transformations", "ziwei.flying"),
                  )


          if __name__ == "__main__":
              unittest.main()
          PY
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_ziwei_phase2a_capabilities.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_fine_cycle_capabilities_remain_planned(self):\n        ids = (\n            "ziwei.flow_month_transformations",\n            "ziwei.flow_day_transformations",\n            "ziwei.flow_hour_transformations",\n            "ziwei.flow_month_flying",\n            "ziwei.flow_day_flying",\n            "ziwei.flow_hour_flying",\n        )\n        for capability_id in ids:\n            self.assertEqual(get_capability(capability_id)["implementation"], "planned")\n            self.assertFalse(can_execute(capability_id))\n\n'''
          new = '''    def test_phase2a_core_contract_remains_stable_after_later_capabilities(self):\n        for capability_id in ("ziwei.transformations", "ziwei.flying"):\n            cap = get_capability(capability_id)\n            self.assertEqual(cap["implementation"], "implemented")\n            self.assertEqual(cap["maturity"], "stable")\n            self.assertEqual(cap["routing"], "on_demand")\n            self.assertEqual(cap["rule_version"], "1.0")\n\n'''
          if old not in text:
              raise SystemExit('stale Phase2A capability test block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify RED
        run: |
          set +e
          python -m unittest tests.test_ziwei_phase2b_capabilities -v > task8-red.txt 2>&1
          rc=$?
          cat task8-red.txt
          if [ "$rc" -eq 0 ]; then
            echo "Task 8 unexpectedly GREEN before registry promotion"
            exit 1
          fi
          grep -Eq "flow_month_stem|planned|KeyError" task8-red.txt
          echo TASK8_EXPECTED_RED
      - name: Promote registry to experimental on-demand
        run: |
          cat > engine/ziwei/capabilities.py <<'PY'
          """Ziwei capability registry for Metaphysics Lab.

          Capability state separates implementation, maturity, and routing. An
          on-demand capability can be executable without being part of the default
          analysis path.
          """
          from __future__ import annotations

          _CAPABILITIES = {
              "ziwei.flow_month_palaces": {
                  "id": "ziwei.flow_month_palaces", "implementation": "implemented",
                  "maturity": "stable", "routing": "default", "rule_version": "1.0",
                  "module": "engine.ziwei.month", "dependencies": (),
              },
              "ziwei.flow_day_palaces": {
                  "id": "ziwei.flow_day_palaces", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.day", "dependencies": ("ziwei.flow_month_palaces",),
              },
              "ziwei.flow_hour_palaces": {
                  "id": "ziwei.flow_hour_palaces", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.hour", "dependencies": ("ziwei.flow_day_palaces",),
              },
              "ziwei.transformations": {
                  "id": "ziwei.transformations", "implementation": "implemented",
                  "maturity": "stable", "routing": "on_demand", "rule_version": "1.0",
                  "module": "engine.ziwei.transformations", "dependencies": (),
              },
              "ziwei.flying": {
                  "id": "ziwei.flying", "implementation": "implemented",
                  "maturity": "stable", "routing": "on_demand", "rule_version": "1.0",
                  "module": "engine.ziwei.flying", "dependencies": ("ziwei.transformations",),
              },
              "ziwei.flow_month_stem": {
                  "id": "ziwei.flow_month_stem", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle_stems", "dependencies": (),
              },
              "ziwei.flow_day_stem": {
                  "id": "ziwei.flow_day_stem", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle_stems", "dependencies": (),
              },
              "ziwei.flow_hour_stem": {
                  "id": "ziwei.flow_hour_stem", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle_stems", "dependencies": (),
              },
              "ziwei.flow_month_transformations": {
                  "id": "ziwei.flow_month_transformations", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle", "dependencies": ("ziwei.flow_month_stem", "ziwei.transformations"),
              },
              "ziwei.flow_day_transformations": {
                  "id": "ziwei.flow_day_transformations", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle", "dependencies": ("ziwei.flow_day_stem", "ziwei.transformations"),
              },
              "ziwei.flow_hour_transformations": {
                  "id": "ziwei.flow_hour_transformations", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle", "dependencies": ("ziwei.flow_hour_stem", "ziwei.transformations"),
              },
              "ziwei.flow_month_flying": {
                  "id": "ziwei.flow_month_flying", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle", "dependencies": ("ziwei.flow_month_transformations", "ziwei.flying"),
              },
              "ziwei.flow_day_flying": {
                  "id": "ziwei.flow_day_flying", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle", "dependencies": ("ziwei.flow_day_transformations", "ziwei.flying"),
              },
              "ziwei.flow_hour_flying": {
                  "id": "ziwei.flow_hour_flying", "implementation": "implemented",
                  "maturity": "experimental", "routing": "on_demand", "rule_version": "1.0-exp",
                  "module": "engine.ziwei.fine_cycle", "dependencies": ("ziwei.flow_hour_transformations", "ziwei.flying"),
              },
              "ziwei.flowing_stars": {
                  "id": "ziwei.flowing_stars", "implementation": "planned",
                  "maturity": None, "routing": "on_demand", "rule_version": None,
                  "module": "engine.ziwei.stars", "dependencies": (),
              },
          }


          def get_capability(capability_id: str) -> dict:
              return dict(_CAPABILITIES[capability_id])


          def can_execute(capability_id: str) -> bool:
              return get_capability(capability_id)["implementation"] == "implemented"


          def should_run_by_default(capability_id: str) -> bool:
              cap = get_capability(capability_id)
              return cap["implementation"] == "implemented" and cap["routing"] == "default"
          PY
      - name: Verify GREEN and regressions
        run: |
          python -m unittest tests.test_ziwei_phase2b_capabilities tests.test_ziwei_phase2a_capabilities tests.test_ziwei_capabilities -v
          python -m unittest discover -v
          echo CAPABILITY_EXPERIMENTAL_ON_DEMAND_PASS
      - name: Commit Task 8 to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ziwei/capabilities.py tests/test_ziwei_phase2b_capabilities.py tests/test_ziwei_phase2a_capabilities.py
          git commit -m "feat: enable experimental Ziwei fine-cycle capabilities"
          git push origin HEAD:feature/ziwei-fine-cycle-stem-resolver-v1
