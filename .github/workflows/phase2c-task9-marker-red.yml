name: Phase 2C Task 9 Marker RED

on:
  pull_request:
    branches:
      - feature/ziwei-flowing-stars-v1

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run private pending marker RED
        run: python -m unittest tests.test_ziwei_phase2c_acceptance.ZiweiPhase2CAcceptanceTests.test_public_qualifier_emits_private_pending_marker -v
