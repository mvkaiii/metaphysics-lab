name: ai-dist-task0-green
on:
  pull_request:
    branches: [main]
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run Task 0 contract tests
        run: python -m unittest tests.test_ai_contract_docs -v
